<!doctype html><meta charset="utf-8"><title>RawS native blocking fixture</title>
<h1>Native blocking fixture</h1><p class="raws-sponsor">Synthetic sponsor</p><p class="raws-allowed-sponsor">Allowed sponsor</p><pre id="report">Running…</pre>
<script>
(async () => {
  const v2 = location.pathname === "/cosmetic-parity";
  const result = {}; const source = location.origin, ads = new URL(source); ads.hostname = 'raws-ads.test';
  if (location.hostname !== 'raws-news.test') throw Error('Use the fixture hostname');
  const one = async (origin, path) => {
    const before = window.rawsExecutions || 0, e = document.createElement('script');
    const event = await new Promise(resolve => {
      const timer = setTimeout(() => resolve('timeout'), 5000);
      function done(value){ clearTimeout(timer); resolve(value); }
      e.onload=()=>done('load');e.onerror=()=>done('error');
      const u=new URL(path, origin); u.searchParams.set('id',Math.random().toString(36).slice(2));
      e.src=u.href;document.head.append(e);
    });e.remove();
    if(event==='timeout') throw Error('Timeout, not a block: '+path);
    return event==='error'?'failed':(window.rawsExecutions||0)>before?'executed':'substituted';
  };
  result.cleanThird = await one(ads,'/raws-fixture/clean.js');
  result.blockThird = await one(ads,'/raws-fixture/banner.js');
  result.exception = await one(ads,'/raws-fixture/banner.js?keep=yes');
  result.sameParty = await one(source,'/raws-fixture/banner.js');
  result.redirect = await one(ads,'/raws-fixture/shim.js');
  const show = selector => getComputedStyle(document.querySelector(selector)).display === 'none'?'hidden':'visible';
  // Give renderer rules a bounded interval after document start.
  for(let n=0;n<20 && show('.raws-sponsor')!=='hidden';n++) await new Promise(r=>setTimeout(r,100));
  result.cosmetic=show('.raws-sponsor');result.cosmeticException=show('.raws-allowed-sponsor');
  result.scriptlet=window.rawsParityMarker === true?'applied':'absent';
  if (v2) {
    // These nodes arrive after the initial static cosmetic pass.
    await new Promise(r => setTimeout(r, 300));
    const node = document.createElement('section');
    node.innerHTML = `
      <p class="raws-late-sponsor">Late scoped</p>
      <p class="raws-late-global">Late generic</p>
      <p class="raws-late-exception">Late allowed</p>
      <p class="raws-procedural">Synthetic sponsored content</p>
      <p class="raws-procedural" id="procedural-control">Editorial content</p>
      <p class="raws-untouched">Untouched</p>
    `;
    document.body.append(node);
    const observed = {
      lateScoped: '.raws-late-sponsor', lateGeneric: '.raws-late-global',
      lateException: '.raws-late-exception', procedural: '.raws-procedural',
      proceduralControl: '#procedural-control', ordinaryControl: '.raws-untouched'
    };
    // Use the same observation deadline for positive and negative cases.
    await new Promise(r => setTimeout(r, 2500));
    for (const [key, selector] of Object.entries(observed)) result[key] = show(selector);
  }
  document.querySelector('#report').textContent=JSON.stringify({
    suite:'raws-native-probe/'+(v2?2:1),outcomes:result
  },null,2);
})().catch(e=>document.querySelector('#report').textContent='INVALID RUN: '+e.message);
</script>
