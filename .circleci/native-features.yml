workflows:
  RawS native UI candidate:
    when:
      and:
      - << pipeline.parameters.run_raw_native_features >>
      - &id002
        equal:
        - ''
        - << pipeline.parameters.native_resume_receipt_id >>
      - &id003
        equal:
        - ''
        - << pipeline.parameters.native_resume_cache_key >>
      - not: << pipeline.parameters.native_resume_completed >>
    jobs:
    - raws-native-chain:
        serial-group: << pipeline.project.slug >>/raws-full
  RawS native UI explicit resume:
    when:
      and:
      - << pipeline.parameters.run_raw_native_features >>
      - not: *id002
      - not: *id003
      - not: << pipeline.parameters.native_resume_completed >>
    jobs:
    - raws-native-resume-chain:
        serial-group: << pipeline.project.slug >>/raws-full
  RawS native UI completed archive recovery:
    when:
      and:
      - << pipeline.parameters.run_raw_native_features >>
      - not: *id002
      - not: *id003
      - << pipeline.parameters.native_resume_completed >>
    jobs:
    - raws-native-recovery-chain:
        serial-group: << pipeline.project.slug >>/raws-full
  Reject incomplete native resume:
    when:
      and:
      - << pipeline.parameters.run_raw_native_features >>
      - or:
        - and:
          - *id002
          - not: *id003
        - and:
          - not: *id002
          - *id003
        - and:
          - << pipeline.parameters.native_resume_completed >>
          - or:
            - *id002
            - *id003
    jobs:
    - raws-native-invalid-resume:
        filters:
          branches:
            only: raw-sandium/native-ui158
