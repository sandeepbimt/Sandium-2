  raws-native-recovery-probe:
    machine:
      image: ubuntu-2404:current
    resource_class: large
    retention:
      caches: 15d
    environment:
      RAWS_STAGE: '1'
      RAWS_PIPELINE_NUMBER: << pipeline.number >>
      RAWS_CHECKPOINT_REVIEWED: 'true'
      RAWS_ALLOW_FRESH_SEED: 'false'
      SISO_LIMITS: local=8,remote=80
      RAWS_NATIVE_FEATURE_BUILD: 'true'
      RAWS_FINAL_ARCHIVE: 'true'
      RAWS_FINAL_PACK_ONLY: 'true'
    steps:
    - checkout
    - run:
        name: Start original one-hour job clock
        command: 'python3 - \<<''PYCODE''

          import json,os,time

          from pathlib import Path

          p=Path(''.checkpoint-state/job-start.json'')

          if p.exists():raise SystemExit(''Job clock already exists'')

          p.parent.mkdir(parents=True,exist_ok=True)

          epoch=time.time();p.write_text(json.dumps({''epoch'':epoch})+''\n'')

          with open(os.environ[''BASH_ENV''],''a'') as f:f.write(''export RAWS_FEATURE_JOB_STARTED_EPOCH=''+str(epoch)+''\n'')

          PYCODE'
        no_output_timeout: 55m
    - run:
        name: Verify native tools; install missing capabilities only
        command: bash tools/prepare_native_tools.sh
        no_output_timeout: 55m
    - run:
        name: Review explicit native feature scope and tests
        command: 'test "$CIRCLE_BRANCH" = "raw-sandium/native-ui158"

          python3 - \<<''PYCODE''

          import sys

          sys.path.insert(0,''tools'')

          from native_features import load_manifest

          from ci_compile import fingerprint

          from pathlib import Path

          if load_manifest()!=(''menu'',''toolbar''):raise SystemExit(''Both reviewed UI features must be explicitly enabled'')

          if Path(''ci/cache-identity.txt'').read_text().strip()!=fingerprint():raise SystemExit(''Recipe identity mismatch'')

          PYCODE

          /usr/bin/python3 -m unittest discover -s tests -v'
        no_output_timeout: 55m
    - run:
        name: Native checkpoint gate
        command: python3 -u tools/ci_full.py gate
        no_output_timeout: 55m
    - restore_cache:
        name: Restore exact completed full archive receipt
        keys:
        - raws-native-final-v1-{{ .Environment.CIRCLE_WORKFLOW_ID }}
    - run:
        name: Native full archive prepare-probe
        command: python3 -u tools/ci_final_archive.py prepare-probe
        no_output_timeout: 55m
    - restore_cache:
        name: Restore exact complete full base
        keys:
        - raws-final-base-v1-{{ checksum ".checkpoint-state/base.key" }}
    - run:
        name: Native checkpoint restore-base
        command: python3 -u tools/ci_full.py restore-base
        no_output_timeout: 55m
    - run:
        name: Native checkpoint restore-finish
        command: python3 -u tools/ci_full.py restore-finish
        no_output_timeout: 55m
    - run:
        name: Fresh-worker signed APK and remote-enabled reuse proof
        command: python3 -u tools/ci_restore_probe.py
        no_output_timeout: 55m
    - store_artifacts:
        path: artifacts
        destination: native-final-fresh-probe
    - store_artifacts:
        path: .checkpoint-state
        destination: native-final-restore-evidence
  raws-native-invalid-resume:
    machine:
      image: ubuntu-2404:current
    resource_class: large
    retention:
      caches: 15d
    environment:
      RAWS_STAGE: '1'
      RAWS_PIPELINE_NUMBER: << pipeline.number >>
      RAWS_CHECKPOINT_REVIEWED: 'true'
      RAWS_ALLOW_FRESH_SEED: 'true'
      SISO_LIMITS: local=8,remote=80
    steps:
    - run:
        name: Reject incomplete explicit resume selection
        command: echo 'Supply both exact resume receipt ID and exact cache key, or neither.' >&2; exit 1
        no_output_timeout: 55m
