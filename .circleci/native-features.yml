# Held standalone configuration; see docs/native-feature-pipeline.md.
version: 2.1
parameters:
  run_raw_native_features:
    type: boolean
    default: false
  native_resume_completed:
    type: boolean
    default: false
  native_resume_receipt_id:
    type: string
    default: ''
  native_resume_cache_key:
    type: string
    default: ''
jobs:
  raws-native-seed:
    machine:
      image: ubuntu-2404:current
    resource_class: large
    retention:
      caches: 15d
    environment:
      RAWS_STAGE: '1'
      RAWS_PIPELINE_NUMBER: << pipeline.number >>
      RAWS_CHECKPOINT_REVIEWED: 'true'
      RAWS_ALLOW_FRESH_SEED: 'true'
      SISO_LIMITS: local=8,remote=80
      RAWS_NATIVE_FEATURE_BUILD: 'true'
      RAWS_NATIVE_FEATURE_SEED: 'true'
    steps:
    - checkout
    - run:
        name: Start original one-hour job clock
        command: 'python3 - \<<''PYCODE''

          import json,os,time

          from pathlib import Path

          p=Path(''.feature-seed-clock.json'')

          if p.exists():raise SystemExit(''Job clock already exists'')

          p.parent.mkdir(parents=True,exist_ok=True)

          epoch=time.time();p.write_text(json.dumps({''epoch'':epoch})+''\n'')

          with open(os.environ[''BASH_ENV''],''a'') as f:f.write(''export RAWS_FEATURE_JOB_STARTED_EPOCH=''+str(epoch)+''\n'')

          PYCODE'
        no_output_timeout: 55m
    - run:
        name: Verify native tools; install missing capabilities only
        command: bash tools/prepare_native_tools.sh
        no_output_timeout: 55m
    - run:
        name: Review explicit native feature scope and tests
        command: 'test "$CIRCLE_BRANCH" = "raw-sandium/native-ui158"

          python3 - \<<''PYCODE''

          import sys

          sys.path.insert(0,''tools'')

          from native_features import load_manifest

          from ci_compile import fingerprint

          from pathlib import Path

          if load_manifest()!=(''menu'',''toolbar''):raise SystemExit(''Both reviewed UI features must be explicitly enabled'')

          if Path(''ci/cache-identity.txt'').read_text().strip()!=fingerprint():raise SystemExit(''Recipe identity mismatch'')

          PYCODE

          /usr/bin/python3 -m unittest discover -s tests -v'
        no_output_timeout: 55m
    - run:
        name: Prepare isolated unchanged baseline tools
        command: python3 -u tools/feature_seed_transport.py prepare --repository "$PWD" --session .feature-seed-transport --job-start-epoch "$RAWS_FEATURE_JOB_STARTED_EPOCH"
        no_output_timeout: 55m
    - restore_cache:
        name: 'Restore exact frozen #1396 receipt'
        keys:
        - raws-final-receipt-v1-1okrnzzf7a7dVnuYH3RZUQh3v8ABzZh4G4yc4YAiROY=
    - run:
        name: Relocate downloaded receipt outside feature state
        command: 'python3 - \<<''PYCODE''

          from pathlib import Path

          incoming=Path(''.feature-seed-incoming'');old=Path(''.raws-final-archive'')

          if incoming.exists() or not old.is_dir() or old.is_symlink():raise SystemExit(''Unexpected baseline receipt location'')

          incoming.mkdir();old.rename(incoming/''receipt'')

          PYCODE'
        no_output_timeout: 55m
    - run:
        name: Select exact old receipt in unchanged baseline process
        command: python3 -u tools/feature_seed_transport.py select --session .feature-seed-transport --receipt .feature-seed-incoming/receipt/receipt.json
        no_output_timeout: 55m
    - restore_cache:
        name: 'Restore exact #1396 full base, no prefix fallback'
        keys:
        - raws-final-base-v1-xLg0fZPI+fw9SpoFza6mLhAhAB2lVxH6jMOzj9OmBBU=
    - run:
        name: Relocate native cache inputs without copying archive
        command: "python3 - \\<<'PYCODE'\nfrom pathlib import Path\nfor name in ('raw-workspace-checkpoint.manifest.json','raw-workspace-checkpoint.shards'):\n\
          \    p=Path(name);dest=Path('.feature-seed-incoming')/name\n    if p.is_symlink() or not p.exists() or dest.exists():raise SystemExit('Unexpected\
          \ baseline archive input')\n    if p.stat().st_dev!=dest.parent.stat().st_dev:raise SystemExit('Cross-filesystem archive copy forbidden')\n  \
          \  p.rename(dest)\nPYCODE"
        no_output_timeout: 55m
    - run:
        name: Verify and restore under exact old identity
        command: python3 -u tools/feature_seed_transport.py restore --session .feature-seed-transport --incoming .feature-seed-incoming
        no_output_timeout: 55m
    - run:
        name: Adopt only restored workspace and proof
        command: python3 -u tools/feature_seed_transport.py adopt --session .feature-seed-transport --feature-root "$PWD"
        no_output_timeout: 55m
    - run:
        name: Native feature transition --baseline-checkout .feature-seed-transport/baseline
        command: python3 -u tools/ci_feature_seed.py transition --baseline-checkout .feature-seed-transport/baseline
        no_output_timeout: 55m
    - run:
        name: Native feature capture
        command: python3 -u tools/ci_feature_seed.py capture
        no_output_timeout: 55m
    - save_cache:
        name: Save NEW full feature-input base
        key: raws-full-base-v1-{{ checksum ".feature-seed-checkpoint/base.key" }}
        paths: &id001
        - raw-workspace-checkpoint.manifest.json
        - raw-workspace-checkpoint.shards
    - run:
        name: Native feature clear-readback
        command: python3 -u tools/ci_feature_seed.py clear-readback
        no_output_timeout: 55m
    - restore_cache:
        name: Read back exact new feature-input base
        keys:
        - raws-full-base-v1-{{ checksum ".feature-seed-checkpoint/base.key" }}
    - run:
        name: Native feature accept-readback
        command: python3 -u tools/ci_feature_seed.py accept-readback
        no_output_timeout: 55m
    - save_cache:
        name: Publish independent prepared receipt, not a normal head
        key: raws-native-inputs-v1-{{ .Environment.CIRCLE_WORKFLOW_ID }}
        paths:
        - .feature-seed-checkpoint
    - store_artifacts:
        path: artifacts
        destination: native-seed-evidence
    - store_artifacts:
        path: .feature-seed-checkpoint
        destination: native-seed-checkpoint
