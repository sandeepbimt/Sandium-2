version: 2.1
parameters:
  run_rawb:
    type: boolean
    default: false
jobs:
  rawb-m158-graph-preflight:
    machine:
      image: ubuntu-2404:current
    resource_class: large
    environment:
      PYTHONUNBUFFERED: "1"
    steps:
      - checkout
      - run:
          name: Validate RawB branch and source admission
          command: |
            set -euo pipefail
            test "$CIRCLE_BRANCH" = rawb/official158
            test "$(git rev-parse HEAD)" = "$CIRCLE_SHA1"
            test "<<pipeline.parameters.run_rawb>>" = true
            python3 -B rawb/preflight.py --check-only
      - run:
          name: Materialize pinned Chromium and validate RawB APK graph
          command: timeout --signal=TERM --kill-after=30s 52m python3 -B rawb/preflight.py
          no_output_timeout: 7m
      - store_artifacts:
          path: .rawb-preflight-evidence
          destination: rawb-preflight
workflows:
  RawB graph preflight:
    when:
      and:
        - << pipeline.parameters.run_rawb >>
        - equal: [rawb/official158, << pipeline.git.branch >>]
    jobs:
      - rawb-m158-graph-preflight
