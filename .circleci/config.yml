version: 2.1
jobs:
  raws-1538-ubo-apk:
    machine:
      image: ubuntu-2404:current
    resource_class: large
    environment:
      RAWS_STAGE: '1'
      RAWS_PIPELINE_NUMBER: << pipeline.number >>
      RAWS_CHECKPOINT_REVIEWED: 'true'
      RAWS_ALLOW_FRESH_SEED: 'false'
    steps:
      - checkout
      - run:
          name: Verify experiment context and install archive tools
          command: |
            set -eu
            test "$CIRCLE_BRANCH" = "experiment/raws-1538-ubo-apk"
            test "$(git rev-parse HEAD)" = "$CIRCLE_SHA1"
            if ! command -v zstd || ! python3 -c 'import yaml'; then
              sudo apt-get update -qq
              sudo apt-get install -y zstd python3-yaml
            fi
      - restore_cache:
          name: Restore exact read-only RawS baseline receipt
          keys:
            - raws-final-receipt-v1-1okrnzzf7a7dVnuYH3RZUQh3v8ABzZh4G4yc4YAiROY=
      - run:
          name: Validate the #1396 baseline receipt
          command: python3 -u ci/experiments/raws-1538-ubo-apk/build.py select
      - restore_cache:
          name: Restore exact read-only RawS baseline archive
          keys:
            - raws-final-base-v1-xLg0fZPI+fw9SpoFza6mLhAhAB2lVxH6jMOzj9OmBBU=
      - run:
          name: Extract and verify exact baseline
          command: |
            python3 -u ci/experiments/raws-1538-ubo-apk/build.py restore
            python3 -u ci/experiments/raws-1538-ubo-apk/build.py finish
      - run:
          name: Apply corrected #1538 and build isolated ARM64 APK
          command: python3 -u ci/experiments/raws-1538-ubo-apk/build.py compile
          no_output_timeout: 45m
      - store_artifacts:
          path: artifacts
          destination: raws-1538-ubo-experiment
workflows:
  RawS 1538 uBO experiment:
    jobs:
      - raws-1538-ubo-apk:
          filters:
            branches:
              only: experiment/raws-1538-ubo-apk
