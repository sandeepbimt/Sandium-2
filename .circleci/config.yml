              only:
                - sandfox/checkpoint-stage-v1
                - ss2-from-ss1 "$SRC_DIR/build/config/siso/.sisoenv"
            echo "BRAVE_REMOTE_EXECUTION_CONFIG_GATE=PASS"
            echo "RESTORED_CHECKPOINT=$RESTORED"
            echo "RESTORED_OBJECT_COUNT=$(find "$OUT_DIR/obj" -type f -name '*.o' 2>/dev/null | wc -l | tr -d ' ')"
            du -sh "$OUT_DIR"
            df -hT
            free -h

      - run:
          name: Build bounded Brave APK slice and save checkpoint
          no_output_timeout: 45m
          max_auto_reruns: 1
          auto_rerun_delay: 30s
          command: |
            set -eu
            ROOT="$CIRCLE_WORKING_DIRECTORY"
            SRC_DIR="$ROOT/brave-work/src"
            OUT_DIR="$SRC_DIR/out/android_Debug_arm64"
            BUILD_LOG="$ROOT/brave-build.log"
            DIAG="$ROOT/brave-stage-diag.txt"
            METRICS="$OUT_DIR/brave-stage-metrics.jsonl"
            MAX_STAGE_WALL_SECONDS=2820
            REMOTE_JOBS=80
            REMAINING=$((MAX_STAGE_WALL_SECONDS - ($(date +%s) - BRAVE_STAGE_START_TS)))
            [ "$REMAINING" -ge 0 ] || REMAINING=0
            RET=0
            REMOTE_GATE_PASSED=false
            SISO_FORCED_KILL=0
            : > "$BUILD_LOG"
            : > "$DIAG"
            rm -f "$METRICS"

            echo "stage=<< parameters.stage_index >>" | tee -a "$DIAG"
            echo "chromium_tag=156.0.8078.74" | tee -a "$DIAG"
            echo "brave_core_tag=v1.98.62" | tee -a "$DIAG"
            echo "remote_jobs=$REMOTE_JOBS" | tee -a "$DIAG"
            echo "remaining_stage_seconds=$REMAINING" | tee -a "$DIAG"
            echo "=== RESTORED STATE ===" | tee -a "$DIAG"
            ls -lh "$OUT_DIR"/.siso_fs_state* 2>&1 | tee -a "$DIAG" || true

            if find "$OUT_DIR/apks" -maxdepth 1 -type f -name '*.apk' -size +0c 2>/dev/null | grep -q .; then
              echo "APK_ALREADY_PRESENT=true; compile skipped." | tee -a "$DIAG"
              RET=0
            elif [ "$REMAINING" -le 180 ]; then
              echo "BUILD_SLICE=SKIPPED; setup used the stage wall budget; preserving current graph/checkpoint." | tee -a "$DIAG"
              RET=124
            else
              export SISO_LIMITS="local=8,remote=$REMOTE_JOBS"
              echo "Running strict-remote autoninja for up to $REMAINING seconds." | tee -a "$DIAG"
              setsid -w timeout --signal=INT --kill-after=90s "${REMAINING}s" \
                bash -c 'set -o pipefail; autoninja -strict_remote --reapi_keep_exec_stream -metrics_json brave-stage-metrics.jsonl -C "$1" -j"$2" brave 2>&1 | tee "$3"' \
                _ "$OUT_DIR" "$REMOTE_JOBS" "$BUILD_LOG" &
              BUILD_PID=$!
              REMOTE_GATE_SECONDS=180
              REMOTE_GATE_INTERVAL=15
              REMOTE_GATE_ELAPSED=0
              while [ "$REMOTE_GATE_ELAPSED" -lt "$REMOTE_GATE_SECONDS" ]; do
                if grep -Eiq 'is_local=false|step state: remote exec|exec remote execute|use reapi "remote\.buildbuddy\.io:443"' "$BUILD_LOG" 2>/dev/null; then
                  REMOTE_GATE_PASSED=true
                  echo "EARLY_REMOTE_EXECUTION_GATE=PASS elapsed_seconds=$REMOTE_GATE_ELAPSED" | tee -a "$DIAG"
                  break
                fi
                if ! kill -0 "$BUILD_PID" 2>/dev/null; then
                  break
                fi
                sleep "$REMOTE_GATE_INTERVAL"
                REMOTE_GATE_ELAPSED=$((REMOTE_GATE_ELAPSED + REMOTE_GATE_INTERVAL))
              done
              if [ "$REMOTE_GATE_PASSED" != true ] && kill -0 "$BUILD_PID" 2>/dev/null; then
                echo "EARLY_REMOTE_EXECUTION_GATE=FAIL; no REAPI evidence within $REMOTE_GATE_SECONDS seconds. Stopping to avoid expensive local compilation." | tee -a "$DIAG" >&2
                kill -INT -- "-$BUILD_PID" 2>/dev/null || true
                sleep 5
                kill -TERM -- "-$BUILD_PID" 2>/dev/null || true
                sleep 5
                kill -KILL -- "-$BUILD_PID" 2>/dev/null || true
                wait "$BUILD_PID" || true
                RET=125
              else
                if [ "$REMOTE_GATE_PASSED" != true ]; then
                  echo "EARLY_REMOTE_EXECUTION_GATE=FAIL; build ended before REAPI evidence." | tee -a "$DIAG" >&2
                  RET=125
                else
                  wait "$BUILD_PID"
                  RET=$?
                fi
              fi
            fi

            RAW_RET="$RET"
            if pgrep -x siso >/dev/null 2>&1; then
              for _ in $(seq 1 60); do
                pgrep -x siso >/dev/null 2>&1 || break
                sleep 2
              done
              if pgrep -x siso >/dev/null 2>&1; then
                echo "SISO_SHUTDOWN=FAILED; refusing to save a live state." | tee -a "$DIAG"
                pkill -KILL -x siso 2>/dev/null || true
                SISO_FORCED_KILL=1
              fi
            fi

            APK=""
            if [ -d "$OUT_DIR/apks" ]; then
              APK="$(find "$OUT_DIR/apks" -maxdepth 1 -type f -name '*.apk' -size +0c | sort | head -n 1)"
            fi
            APK_PRESENT=false
            if [ -n "$APK" ] && python3 - "$APK" <<'PY'
            import sys, zipfile
            with zipfile.ZipFile(sys.argv[1]) as archive:
                bad = archive.testzip()
                if bad:
                    raise SystemExit("corrupt APK archive member: " + bad)
            PY
            then
              APK_PRESENT=true
              mkdir -p "$ROOT/brave-apk"
              cp "$APK" "$ROOT/brave-apk/Sandium-Brave-test.apk"
              echo "APK_PRESENT_AFTER_BUILD=true path=$APK" | tee -a "$DIAG"
              RAW_RET=0
            else
              echo "APK_PRESENT_AFTER_BUILD=false" | tee -a "$DIAG"
            fi

            if [ "$SISO_FORCED_KILL" -ne 0 ]; then
              RET=1
            elif [ "$RAW_RET" -eq 124 ] && [ "$APK_PRESENT" != true ]; then
              RET=0
              echo "BUILD_SLICE=TIMEOUT_CHECKPOINTED; continue with next stage." | tee -a "$DIAG"
            elif [ "$RAW_RET" -eq 125 ] && [ "$APK_PRESENT" != true ]; then
              RET=1
            elif [ "$RAW_RET" -ne 0 ] && [ "$APK_PRESENT" != true ]; then
              RET="$RAW_RET"
            else
              RET=0
            fi

            if [ ! -s "$OUT_DIR/build.ninja" ] || [ ! -s "$OUT_DIR/args.gn" ] || [ ! -s "$OUT_DIR/args_generated.gni" ]; then
              echo "CHECKPOINT_SAVE=REJECTED; required build graph or GN args missing." | tee -a "$DIAG"
              cat "$DIAG"
              exit 1
            fi

            CORE_DIR="$SRC_DIR/brave"
            write_source_identity() {
              CORE_SHA="$(git -C "$CORE_DIR" rev-parse HEAD)"
              CHROMIUM_SHA="$(git -C "$SRC_DIR" rev-parse HEAD)"
              PACKAGE_SHA="$(cat "$CORE_DIR/package.json" "$CORE_DIR/pnpm-lock.yaml" "$CORE_DIR/DEPS" "$SRC_DIR/DEPS" | sha256sum | awk '{print $1}')"
              ENV_SHA="$(sha256sum "$CORE_DIR/.env" | awk '{print $1}')"
              SISO_ENV_SHA="$(sha256sum "$SRC_DIR/build/config/siso/.sisoenv" | awk '{print $1}')"
              SISO_RC_SHA="$(sha256sum "$SRC_DIR/build/config/siso/.sisorc" | awk '{print $1}')"
              SISO_BACKEND_SHA="$(sha256sum "$SRC_DIR/build/config/siso/backend_config/backend.star" | awk '{print $1}')"
              BRAVE_SISO_SHA="$(sha256sum "$SRC_DIR/build/config/siso/brave_siso_config.star" | awk '{print $1}')"
              CLANG_GNI_SHA="$(sha256sum "$SRC_DIR/build/config/compiler/compiler.gni" | awk '{print $1}')"
              printf '%s\n' \
                'schema=1' \
                'source_timestamp_policy=epoch_946684800_full_tree_v2_depth_first_dirs' \
                "brave_core_sha=$CORE_SHA" \
                "chromium_sha=$CHROMIUM_SHA" \
                "package_deps_sha=$PACKAGE_SHA" \
                "env_sha=$ENV_SHA" \
                "siso_env_sha=$SISO_ENV_SHA" \
                "siso_rc_sha=$SISO_RC_SHA" \
                "siso_backend_sha=$SISO_BACKEND_SHA" \
                "brave_siso_sha=$BRAVE_SISO_SHA" \
                "clang_compiler_gni_sha=$CLANG_GNI_SHA" \
                'build_config=Debug' \
                'target_os=android' \
                'target_cpu=arm64' \
                'target=brave' \
                'out=out/android_Debug_arm64' \
                > "$ROOT/brave-source-identity.txt"
            }
            write_source_identity
            ARGS_SHA="$(cat "$OUT_DIR/args.gn" "$OUT_DIR/args_generated.gni" | sha256sum | awk '{print $1}')"
            cat "$ROOT/brave-source-identity.txt" > "$ROOT/brave-checkpoint.meta"
            printf 'args_sha=%s\n' "$ARGS_SHA" >> "$ROOT/brave-checkpoint.meta"

            CHECKPOINT_STATE_MODE="GRAPH_ONLY"
            if [ -s "$OUT_DIR/.siso_fs_state" ]; then
              if [ -s "$OUT_DIR/.siso_fs_state.journal" ]; then
                CHECKPOINT_STATE_MODE="BASE_AND_JOURNAL"
              else
                CHECKPOINT_STATE_MODE="BASE_ONLY"
              fi
            elif [ -s "$OUT_DIR/.siso_fs_state.journal" ]; then
              CHECKPOINT_STATE_MODE="JOURNAL_ONLY"
            fi
            echo "CHECKPOINT_STATE_MODE=$CHECKPOINT_STATE_MODE" | tee -a "$DIAG"

            if [ "$SISO_FORCED_KILL" -ne 0 ]; then
              echo "CHECKPOINT_SAVE=REJECTED reason=siso_did_not_exit_cleanly" | tee -a "$DIAG"
              RET=1
            else
              PACK_START="$(date +%s)"
              rm -f "$ROOT/brave-checkpoint.tar.zst.tmp"
              tar -c -I 'zstd -T0 -3' --format=posix --pax-option='delete=atime,delete=ctime' \
                -f "$ROOT/brave-checkpoint.tar.zst.tmp" -C "$SRC_DIR" out/android_Debug_arm64
              mv "$ROOT/brave-checkpoint.tar.zst.tmp" "$ROOT/brave-checkpoint.tar.zst"
              PACK_END="$(date +%s)"
              echo "checkpoint_pack_seconds=$((PACK_END - PACK_START))" | tee -a "$DIAG"
              echo "checkpoint_size_bytes=$(stat -c '%s' "$ROOT/brave-checkpoint.tar.zst")" | tee -a "$DIAG"
              echo "CHECKPOINT_SAVE=PASS" | tee -a "$DIAG"
            fi

            OBJECT_COUNT="$(find "$OUT_DIR/obj" -type f -name '*.o' 2>/dev/null | wc -l | tr -d ' ')"
            OUTPUT_COUNT="$(find "$OUT_DIR/obj" "$OUT_DIR/gen" "$OUT_DIR/apks" -type f 2>/dev/null | wc -l | tr -d ' ')"
            echo "object_file_count=$OBJECT_COUNT" | tee -a "$DIAG"
            echo "build_output_count=$OUTPUT_COUNT" | tee -a "$DIAG"
            FRONTIER_CUM="$ROOT/brave-stage-frontier-cumulative.txt"
            FRONTIER_CUR="$ROOT/brave-stage-frontier-current.txt"
            FRONTIER_NEW="$ROOT/brave-stage-frontier-new.txt"
            sed -nE 's/^\[[0-9]+\/[0-9]+\][[:space:]]+[^[:space:]]+[[:space:]]+F[[:space:]]+(.*)$/\1/p' "$BUILD_LOG" | LC_ALL=C sort -u > "$FRONTIER_CUR"
            if [ -s "$FRONTIER_CUM" ]; then
              comm -23 "$FRONTIER_CUR" "$FRONTIER_CUM" > "$FRONTIER_NEW" || true
              cat "$FRONTIER_CUM" "$FRONTIER_CUR" | LC_ALL=C sort -u > "$FRONTIER_CUM.tmp"
              mv "$FRONTIER_CUM.tmp" "$FRONTIER_CUM"
            else
              cp "$FRONTIER_CUR" "$FRONTIER_CUM"
              cp "$FRONTIER_CUR" "$FRONTIER_NEW"
            fi
            echo "ACTION_FRONTIER_PRIOR_COUNT=$(wc -l < "$FRONTIER_CUM" | tr -d ' ')" | tee -a "$DIAG"
            echo "ACTION_FRONTIER_NEW_COUNT=$(wc -l < "$FRONTIER_NEW" | tr -d ' ')" | tee -a "$DIAG"
            echo "remote_exec_gate_passed=$REMOTE_GATE_PASSED" | tee -a "$DIAG"
            echo "raw_autoninja_exit_code=$RAW_RET" | tee -a "$DIAG"
            echo "effective_stage_exit_code=$RET" | tee -a "$DIAG"
            printf '%s\n' \
              "stage_index=<< parameters.stage_index >>" \
              "build_exit_code=$RET" \
              "raw_autoninja_exit_code=$RAW_RET" \
              "remote_exec_gate_passed=$REMOTE_GATE_PASSED" \
              "checkpoint_state_mode=$CHECKPOINT_STATE_MODE" \
              "object_count=$OBJECT_COUNT" \
              "output_count=$OUTPUT_COUNT" \
              "apk_present=$APK_PRESENT" \
              "checkpoint_save=PASS" \
              > "$ROOT/brave-stage-result.txt"
            cat "$DIAG"
            if [ "$RET" -ne 0 ]; then exit "$RET"; fi

      - save_cache:
          name: Save Brave checkpoint for the next stage and future runs
          key: sandium-brave-checkpoint-v1-{{ .Branch }}-{{ .Environment.CIRCLE_WORKFLOW_ID }}-stage-<< parameters.stage_index >>
          paths:
            - brave-checkpoint.tar.zst
            - brave-checkpoint.meta
            - brave-stage-frontier-cumulative.txt
          when: always

      - when:
          condition: always
          steps:
            - run:
                name: Record APK status and publish a testable Brave APK
                command: |
                    set -eu
                    ROOT="$CIRCLE_WORKING_DIRECTORY"
                    OUT_DIR="$ROOT/brave-work/src/out/android_Debug_arm64"
                    mkdir -p "$ROOT/.ssbrave-cache" "$ROOT/brave-apk"
                    APK=""
                    if [ -d "$OUT_DIR/apks" ]; then
                      APK="$(find "$OUT_DIR/apks" -maxdepth 1 -type f -name '*.apk' -size +0c | sort | head -n 1)"
                    fi
                    if [ -n "$APK" ] && python3 - "$APK" <<'PY'
                    import sys, zipfile
                    with zipfile.ZipFile(sys.argv[1]) as archive:
                        bad = archive.testzip()
                        if bad:
                            raise SystemExit("corrupt APK archive member: " + bad)
                    PY
                    then
                      cp "$APK" "$ROOT/brave-apk/Sandium-Brave-test.apk"
                      printf 'BUILD_FINISHED=true\nAPK_ARCHIVE_VALID=true\nAPK_SOURCE=%s\n' "$APK" > "$ROOT/.ssbrave-cache/apk-status.txt"
                      printf 'BUILD_FINISHED=true\nAPK_ARCHIVE_VALID=true\n' > "$ROOT/brave-apk/status.txt"
                    else
                      printf 'BUILD_FINISHED=false\nAPK_ARCHIVE_VALID=false\n' > "$ROOT/.ssbrave-cache/apk-status.txt"
                      printf 'BUILD_FINISHED=false\nAPK_ARCHIVE_VALID=false\n' > "$ROOT/brave-apk/status.txt"
                    fi
                    cat "$ROOT/.ssbrave-cache/apk-status.txt"

      - save_cache:
          name: Save stage-specific Brave APK completion marker
          key: sandium-brave-apk-v1-{{ .Branch }}-{{ .Revision }}-stage-<< parameters.stage_index >>
          paths:
            - .ssbrave-cache/apk-status.txt
          when: always

      - when:
          condition: always
          steps:
            - store_artifacts:
                path: brave-apk
                destination: brave-apk
      
            - store_artifacts:
                path: brave-stage-diag.txt
                destination: brave-diagnostics/stage-diag.txt
      
            - store_artifacts:
                path: brave-build.log
                destination: brave-diagnostics/brave-build.log
      
            - store_artifacts:
                path: brave-stage-result.txt
                destination: brave-diagnostics/stage-result.txt


workflows:
  c4-afterbird-staged-checkpoint-build:
    jobs:
      - c4-afterbird-staged-build:
          name: c4-afterbird-stage-1
          stage_index: 1
          filters:
            branches:
              only:
                - sandfox/checkpoint-stage-v1
                - ss2-from-ss1
      - c4-afterbird-staged-build:
          name: c4-afterbird-stage-2
          stage_index: 2
          requires:
            - c4-afterbird-stage-1
          filters:
            branches:
              only:
                - sandfox/checkpoint-stage-v1
                - ss2-from-ss1
      - c4-afterbird-staged-build:
          name: c4-afterbird-stage-3
          stage_index: 3
          requires:
            - c4-afterbird-stage-2
          filters:
            branches:
              only:
                - sandfox/checkpoint-stage-v1
                - ss2-from-ss1
      - c4-afterbird-staged-build:
          name: c4-afterbird-stage-4
          stage_index: 4
          requires:
            - c4-afterbird-stage-3
          filters:
            branches:
              only:
                - sandfox/checkpoint-stage-v1
                - ss2-from-ss1
      - c4-afterbird-staged-build:
          name: c4-afterbird-stage-5
          stage_index: 5
          requires:
            - c4-afterbird-stage-4
          filters:
            branches:
              only:
                - sandfox/checkpoint-stage-v1
                - ss2-from-ss1

  brave-android-staged-checkpoint-build:
    jobs:
      - brave-android-staged-build:
          name: brave-android-stage-1
          stage_index: 1
          filters:
            branches:
              only:
                - sandium/brave-android-poc
      - brave-android-staged-build:
          name: brave-android-stage-2
          stage_index: 2
          requires:
            - brave-android-stage-1
          filters:
            branches:
              only:
                - sandium/brave-android-poc
      - brave-android-staged-build:
          name: brave-android-stage-3
          stage_index: 3
          requires:
            - brave-android-stage-2
          filters:
            branches:
              only:
                - sandium/brave-android-poc
      - brave-android-staged-build:
          name: brave-android-stage-4
          stage_index: 4
          requires:
            - brave-android-stage-3
          filters:
            branches:
              only:
                - sandium/brave-android-poc
      - brave-android-staged-build:
          name: brave-android-stage-5
          stage_index: 5
          requires:
            - brave-android-stage-4
          filters:
            branches:
              only:
                - sandium/brave-android-poc
