        paths:
        - .checkpoint-incoming
    - save_cache:
        name: Refresh compressed base only when nearing expiry (otherwise existing immutable key skips)
        key: sandium-bridge-base-v1-{{ checksum ".checkpoint-state/base.key" }}
        paths:
