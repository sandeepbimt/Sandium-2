            test "$APK_TARGET" = "//brave/build/android:sign_app_convert_aab_to_apk" || { echo "BRAVE_BUILD_TARGET_GATE=FAIL official Universal APK conversion target missing" >&2; exit 1; }
            echo "BRAVE_BUILD_TARGET_GATE=PASS target=$APK_TARGET"
            if [ "<< parameters.stage_index >>" = "1" ]; then
              for required in build.ninja args.gn; do
                if [ ! -s "$OUT/$required" ]; then
                  echo "BRAVE_BUILD_GRAPH_GATE=FAIL missing=$OUT/$required" >&2
                  find "$ROOT/brave-work/src/out" -maxdepth 4 -type f \( -name build.ninja -o -name args.gn -o -name args_generated.gni \) -print 2>/dev/null | head -100 >&2 || true
                  exit 1
                fi
              done
              ARGS_GENERATED="$OUT/args_generated.gni"
              test -s "$ARGS_GENERATED" || { echo "BRAVE_REMOTE_EXECUTION_CONFIG_GATE=FAIL missing $ARGS_GENERATED" >&2; exit 1; }
              grep -F 'args_generated.gni' "$OUT/args.gn" >/dev/null || { echo "BRAVE_REMOTE_EXECUTION_CONFIG_GATE=FAIL args.gn does not import args_generated.gni" >&2; cat "$OUT/args.gn" >&2; exit 1; }
              echo "=== Actual generated GN args (args_generated.gni) ==="
              grep -nE 'use_remoteexec|use_siso|use_reclient' "$ARGS_GENERATED" || true
              require_arg() {
                local name="$1" expected="$2"
                if ! grep -Eq "^[[:space:]]*${name}[[:space:]]*=[[:space:]]*${expected}[[:space:]]*$" "$ARGS_GENERATED"; then
                  echo "BRAVE_REMOTE_EXECUTION_CONFIG_GATE=FAIL expected ${name}=${expected} in $ARGS_GENERATED" >&2
                  echo "=== Brave .env RBE setting ===" >&2
                  grep -nE '^(rbe_service|use_remoteexec)=' "$ROOT/brave-work/src/brave/.env" >&2 || true
                  echo "=== generated args file ===" >&2
                  grep -nE 'use_remoteexec|use_siso|use_reclient' "$ARGS_GENERATED" >&2 || true
                  echo "=== args.gn imports ===" >&2
                  grep -n 'args_generated.gni' "$OUT/args.gn" >&2 || true
                  echo "=== end diagnostics ===" >&2
                  exit 1
                fi
              }
              require_arg use_remoteexec true
              require_arg use_siso true
              require_arg use_reclient false
              require_arg is_official_build true
              require_arg android_aab_to_apk true
              require_arg target_android_output_format '"aab"'
              require_arg android_channel '"stable"'
              require_arg chrome_public_manifest_package '"com.brave.browser"'
              echo "BRAVE_BUILD_GRAPH_GATE=PASS"
              echo "BRAVE_REMOTE_EXECUTION_CONFIG_GATE=PASS"
            fi
      - run:
          name: Verify restored Brave APK before scheduling build work
          command: |
            set -euo pipefail
            ROOT="$CIRCLE_WORKING_DIRECTORY"
            OUT="$ROOT/brave-work/src/out/android_Release_arm64"
            APK="$OUT/apks/Bravearm64Universal.apk"
            TOOLS="$ROOT/brave-work/src/third_party/android_sdk/public/build-tools/37.0.0"
            mkdir -p "$ROOT/brave-work/.sandium"
            rm -f "$ROOT/brave-work/.sandium/restored-apk-valid"
            if [ ! -s "$APK" ]; then
              echo "BRAVE_RESTORED_APK=ABSENT"
              exit 0
            fi
            MANIFEST="$ROOT/brave-work/.sandium/checkpoint-manifest.txt"
            CURRENT_REVISION="${CIRCLE_SHA1:-{{ .Revision }}}"
            REFERENCE_REVISION="$(sed -n 's/^REFERENCE_SOURCE_REVISION=//p' "$MANIFEST" | head -n 1)"
            if [ -z "$REFERENCE_REVISION" ] || [ "$REFERENCE_REVISION" != "$CURRENT_REVISION" ]; then
              echo "BRAVE_RESTORED_APK=STALE_REFERENCE; reference_revision=${REFERENCE_REVISION:-missing} current_revision=$CURRENT_REVISION"
              rm -f "$APK"
              exit 0
            fi
            VALID=true
            if ! python3 -c 'import sys,zipfile; z=zipfile.ZipFile(sys.argv[1]); bad=z.testzip(); z.close(); sys.exit(1 if bad else 0)' "$APK"; then VALID=false; fi
            if [ "$VALID" = true ] && [ -x "$TOOLS/apksigner" ] && [ -x "$TOOLS/aapt" ]; then
              "$TOOLS/apksigner" verify "$APK" >/dev/null 2>&1 || VALID=false
              if [ "$VALID" = true ]; then
                "$TOOLS/aapt" dump badging "$APK" > "$ROOT/brave-work/.sandium/restored-apk-badging.txt" 2>/dev/null || VALID=false
              fi
              PACKAGE=""
              APP_LABEL=""
              if [ "$VALID" = true ]; then
                PACKAGE="$(sed -n "s/^package: name='\\([^']*\\)'.*/\\1/p" "$ROOT/brave-work/.sandium/restored-apk-badging.txt" 2>/dev/null | head -n 1)"
                APP_LABEL="$(sed -n "s/^application-label:'\\(.*\\)'$/\\1/p" "$ROOT/brave-work/.sandium/restored-apk-badging.txt" 2>/dev/null | head -n 1)"
                [ "$PACKAGE" = "com.brave.browser" ] || VALID=false
                [ "$APP_LABEL" = "Brave" ] || VALID=false
              fi
            else
              VALID=false
            fi
            if [ "$VALID" = true ]; then
              if python3 "$ROOT/.circleci/scripts/analyze-brave-apk-size.py" "$APK" --require-arm64-only --output "$ROOT/brave-work/.sandium/restored-apk-size-report.txt" >/dev/null; then
                echo "BRAVE_RESTORED_APK_ABI=PASS arm64-only"
              else
                VALID=false
              fi
            fi
            if [ "$VALID" = true ]; then
              touch "$ROOT/brave-work/.sandium/restored-apk-valid"
              echo "BRAVE_RESTORED_APK=VALID package=com.brave.browser label=Brave bytes=$(stat -c '%s' "$APK")"
            else
              echo "BRAVE_RESTORED_APK=INVALID; reopening only the APK output action."
              rm -f "$APK"
            fi
      - run:
          name: Verify BuildBuddy remote worker before Android compilation
          no_output_timeout: 15m
          command: |
            set -uo pipefail
            ROOT="$CIRCLE_WORKING_DIRECTORY"
            mkdir -p "$ROOT/brave-work/.sandium"
            STATUS="$ROOT/brave-work/.sandium/remote-smoke-status.txt"
            if [ -s "$ROOT/brave-work/.sandium/restored-apk-valid" ]; then
              printf 'REMOTE_SMOKE=SKIPPED_VALID_APK\n' > "$STATUS"
              echo "BRAVE_REMOTE_SMOKE=SKIPPED reason=already-verified-apk"
            else
              export BRAVE_STAGE_INDEX="<< parameters.stage_index >>"
              if bash .circleci/scripts/verify-brave-remote-smoke.sh; then
                printf 'REMOTE_SMOKE=PASS\n' > "$STATUS"
                echo "BRAVE_REMOTE_SMOKE_STATUS=PASS"
              else
                RC=$?
                printf 'REMOTE_SMOKE=WARNING\nREMOTE_SMOKE_EXIT_CODE=%s\n' "$RC" > "$STATUS"
                echo "BRAVE_REMOTE_SMOKE_STATUS=WARNING exit=$RC; continuing to the real APK build under -strict_remote. Main APK metrics are authoritative."
              fi
            fi
      - run:
          name: Build bounded Brave Android APK slice
          no_output_timeout: 50m
          command: |
            set -euo pipefail
            ROOT="$CIRCLE_WORKING_DIRECTORY"
            OUT="$ROOT/brave-work/src/out/android_Release_arm64"
            STATUS_DIR="$ROOT/brave-work/.sandium"
            mkdir -p "$STATUS_DIR"
            BUILD_STATUS="$STATUS_DIR/build-stage-status.txt"
            SMOKE_STATUS="$STATUS_DIR/remote-smoke-status.txt"
            if [ -s "$STATUS_DIR/restored-apk-valid" ]; then
              echo "BRAVE_APK=ALREADY_PRESENT_AND_VERIFIED"
              printf 'BUILD_EXIT_CODE=0\nBUILD_REASON=RESTORED_VALID_APK\n' > "$BUILD_STATUS"
              exit 0
            fi
            if [ ! -s "$OUT/build.ninja" ]; then
              echo "BRAVE_BUILD_GRAPH_GATE=FAIL missing $OUT/build.ninja" >&2
              exit 1
            fi
            if [ -z "$(printenv BUILDBUDDY_API_KEY 2>/dev/null || true)" ]; then
              echo "MISSING_REQUIRED_SECRET=BUILDBUDDY_API_KEY" >&2
              exit 1
            fi
            if ! grep -Eq '^REMOTE_SMOKE=(PASS|WARNING|SKIPPED_VALID_APK)$' "$SMOKE_STATUS" 2>/dev/null; then
              echo "BRAVE_REMOTE_SMOKE_STATUS=UNKNOWN; refusing to start a build without a recorded preflight outcome." >&2
              exit 2
            fi
            if grep -qx 'REMOTE_SMOKE=WARNING' "$SMOKE_STATUS"; then
              echo "BRAVE_REMOTE_SMOKE=WARNING; not blocking compilation. The Android APK build will run with -strict_remote and its own Siso metrics will be audited."
            fi
            ROOT_SRC="$ROOT/brave-work/src"
            BRAVE_DEPOT_TOOLS="$ROOT_SRC/brave/vendor/depot_tools"
            test -s "$ROOT/brave-work/.gclient" || { echo "BRAVE_GCLIENT_ROOT_GATE=FAIL missing .gclient" >&2; exit 1; }
            test -s "$ROOT/brave-work/.gclient_entries" || { echo "BRAVE_GCLIENT_ROOT_GATE=FAIL missing .gclient_entries" >&2; exit 1; }
            test -x "$BRAVE_DEPOT_TOOLS/autoninja" || { echo "BRAVE_GCLIENT_ROOT_GATE=FAIL Brave autoninja missing" >&2; exit 1; }
            export PATH="$BRAVE_DEPOT_TOOLS:$PATH"
            export DEPOT_TOOLS_UPDATE=0
            cd "$ROOT_SRC"
            export PYTHONPATH="$ROOT_SRC/brave/script:$ROOT_SRC/tools/grit/grit/extern:$ROOT_SRC/brave/vendor/requests:$ROOT_SRC/build:$BRAVE_DEPOT_TOOLS${PYTHONPATH:+:$PYTHONPATH}"
            "$ROOT_SRC/third_party/cpython3/host/bin/python3" -c 'from brave_version_utils import generate_base_version_code; assert generate_base_version_code(1, 2) > 0; print("BRAVE_PYTHONPATH_GATE=PASS")'
            python3 -c 'import os,sys,gclient_paths; expected=os.path.realpath(sys.argv[1]); actual=gclient_paths.GetPrimarySolutionPath(); assert actual is not None and os.path.realpath(actual)==expected, "BRAVE_GCLIENT_ROOT_GATE=FAIL expected=%s actual=%s" % (expected,actual); print("BRAVE_GCLIENT_ROOT_GATE=PASS src=%s" % actual)' "$ROOT_SRC"
            export BRAVE_STAGE_INDEX="<< parameters.stage_index >>"
            bash "$ROOT/.circleci/scripts/capture-brave-siso-checkpoint.sh" before-build
            BUILD_RC=0
            INITIAL_BUILD_RC=0
            CAS_RECOVERY_COUNT=0
            trap 'rc=$?; BRAVE_BUILD_EXIT_CODE="${BUILD_RC:-$rc}" BRAVE_BUILD_INITIAL_EXIT_CODE="${INITIAL_BUILD_RC:-not_set}" BRAVE_BUILD_INITIAL_TIMEOUT="$([ "${INITIAL_BUILD_RC:-0}" -eq 124 ] && echo true || ([ "${INITIAL_BUILD_RC:-0}" -eq 130 ] && echo true || echo false))" bash "$ROOT/.circleci/scripts/capture-brave-siso-checkpoint.sh" after-build || echo "BRAVE_SISO_DIAGNOSTICS=WARNING after-build capture failed"; exit "$rc"' EXIT
            export SISO_LIMITS="local=8,remote=80"
            METRICS_PREFIX="sandium-brave-siso-stage-<< parameters.stage_index >>-build-${CIRCLE_BUILD_NUM:-local}-attempt-"
            METRICS_FILE="${METRICS_PREFIX}0.jsonl"
            BUILD_MODE="<< pipeline.parameters.sandium_build_mode >>"
            if [ "${CIRCLE_BRANCH:-}" = "brave/vanilla-v1.99.54" ]; then BUILD_MODE=full; fi
            if [ "${CIRCLE_BRANCH:-}" = "brave/vanilla-v1.99.54" ]; then MODE=full; fi
            case "$BUILD_MODE" in
              full) STAGE_BUILD_BUDGET_SECONDS=1800 ;;
              fast) STAGE_BUILD_BUDGET_SECONDS=2700 ;;
              *) echo "BRAVE_BUILD_MODE_GATE=FAIL unsupported mode=$BUILD_MODE" >&2; exit 2 ;;
            esac
            STAGE_BUILD_DEADLINE=$((SECONDS + STAGE_BUILD_BUDGET_SECONDS))
            echo "BRAVE_BUILD_MODE=$BUILD_MODE"
            if [ "$BUILD_MODE" = "full" ]; then
              echo "SANDIUM_CI_NAME=SANDIUM-FULL-MODE"
            else
              echo "SANDIUM_CI_NAME=SANDIUM-FAST-MODE"
            fi
            echo "BRAVE_BUILD_SLICE_BUDGET_SECONDS=$STAGE_BUILD_BUDGET_SECONDS metrics=$METRICS_FILE"
            timeout --signal=INT --kill-after=60s "${STAGE_BUILD_BUDGET_SECONDS}s" autoninja -strict_remote -metrics_json "$METRICS_FILE" -C "$OUT" -j80 create_dist || BUILD_RC=$?
            INITIAL_BUILD_RC="$BUILD_RC"
            while [ "$BUILD_RC" -ne 0 ] && [ "$BUILD_RC" -ne 124 ] && [ "$BUILD_RC" -ne 130 ] \
              && [ "$CAS_RECOVERY_COUNT" -lt 2 ] \
              && [ -s "$OUT/siso_output" ] \
              && grep -Eq 'rpc error: code = FailedPrecondition desc = download inputs: could not (fetch inputs|get input tree): Digest hash:.*not found' "$OUT/siso_output"; do
              CAS_RECOVERY_COUNT=$((CAS_RECOVERY_COUNT + 1))
              echo "BRAVE_CAS_LOCAL_RECOVERY_ATTEMPT=$CAS_RECOVERY_COUNT"
              LOCAL_RECOVERY_METRICS_FILE="${METRICS_PREFIX}${CAS_RECOVERY_COUNT}-local-recovery.jsonl"
              REMAINING_STAGE_SECONDS=$((STAGE_BUILD_DEADLINE - SECONDS))
              if [ "$REMAINING_STAGE_SECONDS" -le 0 ]; then
                BUILD_RC=124
                echo "BRAVE_BUILD_RESUME=SKIPPED stage build budget exhausted before CAS recovery."
                break
              fi
              if timeout --signal=INT --kill-after=60s "${REMAINING_STAGE_SECONDS}s" bash "$ROOT/.circleci/scripts/recover-siso-missing-cas-inputs.sh" "$OUT" "$LOCAL_RECOVERY_METRICS_FILE"; then
                REMAINING_STAGE_SECONDS=$((STAGE_BUILD_DEADLINE - SECONDS))
                if [ "$REMAINING_STAGE_SECONDS" -le 0 ]; then
                  BUILD_RC=124
                  echo "BRAVE_BUILD_RESUME=SKIPPED stage build budget exhausted after CAS recovery."
                  break
                fi
                echo "BRAVE_BUILD_RESUME=START mode=strict-remote timeout_seconds=$REMAINING_STAGE_SECONDS (remaining stage budget)"
                RESUME_METRICS_FILE="${METRICS_PREFIX}${CAS_RECOVERY_COUNT}-resume.jsonl"
                BUILD_RC=0
                timeout --signal=INT --kill-after=60s "${REMAINING_STAGE_SECONDS}s" autoninja -strict_remote -metrics_json "$RESUME_METRICS_FILE" -C "$OUT" -j80 create_dist || BUILD_RC=$?
              else
                BUILD_RC=$?
                echo "BRAVE_CAS_LOCAL_RECOVERY=FAIL exit=$BUILD_RC; preserving outputs and metrics."
                break
              fi
            done
            REMOTE_EXECUTION_AUDIT=NOT_AVAILABLE
            if [ -s "$OUT/$METRICS_FILE" ]; then
              if python3 "$ROOT/.circleci/scripts/verify-brave-remote-metrics.py" --audit "$OUT/$METRICS_FILE"; then
                REMOTE_EXECUTION_AUDIT=PASS
              else
                REMOTE_AUDIT_RC=$?
                REMOTE_EXECUTION_AUDIT="WARNING_EXIT_$REMOTE_AUDIT_RC"
                echo "BRAVE_REMOTE_EXECUTION_AUDIT=WARNING exit=$REMOTE_AUDIT_RC; preserving build metrics and continuing stage handoff."
              fi
            else
              echo "BRAVE_REMOTE_EXECUTION_AUDIT=NOT_AVAILABLE main_metrics=$OUT/$METRICS_FILE"
            fi
            BUILD_TIME_SLICE_EXPIRED=false
            BUILD_COMMAND_SUCCEEDED=false
            BUILD_SLICE_INCOMPLETE=true
            # GNU timeout returns 124 when the stage budget expires. Signal-like
            # exit codes (130/137/143) alone are NOT proof of a time-slice expiry:
            # a local OOM killer or an externally killed compiler can return them
            # much earlier than the budget. Classify those as failed work instead.
            if [ "$BUILD_RC" -eq 0 ]; then
              BUILD_REASON="BUILD_COMMAND_SUCCESS"
              BUILD_COMMAND_SUCCEEDED=true
              BUILD_SLICE_INCOMPLETE=false
            elif [ "$BUILD_RC" -eq 124 ] || [ "$SECONDS" -ge "$STAGE_BUILD_DEADLINE" ]; then
              BUILD_TIME_SLICE_EXPIRED=true
              BUILD_REASON="TIME_SLICE_COMPLETE"
            else
              BUILD_REASON="ACTION_FAILED_HANDOFF"
              echo "BRAVE_BUILD_COMMAND=INCOMPLETE exit=$BUILD_RC; no APK success is claimed. "
              echo "Completed actions may be checkpointed; failed actions must remain pending for the next stage."
            fi
            {
              echo "BUILD_EXIT_CODE=$BUILD_RC"
              echo "BUILD_INITIAL_EXIT_CODE=$INITIAL_BUILD_RC"
              echo "BUILD_REASON=$BUILD_REASON"
              echo "BUILD_TIME_SLICE_EXPIRED=$BUILD_TIME_SLICE_EXPIRED"
              echo "BUILD_COMMAND_SUCCEEDED=$BUILD_COMMAND_SUCCEEDED"
              echo "BUILD_SLICE_INCOMPLETE=$BUILD_SLICE_INCOMPLETE"
              echo "BUILD_HANDOFF_ALLOWED=true"
              echo "STAGE_BUILD_BUDGET_SECONDS=$STAGE_BUILD_BUDGET_SECONDS"
              echo "REMOTE_EXECUTION_AUDIT=$REMOTE_EXECUTION_AUDIT"
              echo "CAS_RECOVERY_ATTEMPTS=$CAS_RECOVERY_COUNT"
              echo "BUILD_WINDOW_FINISHED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            } > "$BUILD_STATUS"
            if [ "$BUILD_COMMAND_SUCCEEDED" = true ]; then
              echo "BRAVE_BUILD_STAGE_STATUS=COMMAND_SUCCESS exit=$BUILD_RC reason=$BUILD_REASON remote_audit=$REMOTE_EXECUTION_AUDIT"
            else
              echo "BRAVE_BUILD_STAGE_STATUS=INCOMPLETE exit=$BUILD_RC reason=$BUILD_REASON "
              echo "build_budget_seconds=$STAGE_BUILD_BUDGET_SECONDS; time_slice_expired=$BUILD_TIME_SLICE_EXPIRED; "
              echo "The build did not finish in this slice; the next stage will resume using Ninja/Siso native state."
            fi
      - run:
          name: Export APK status and artifacts
          when: always
          command: |
            set -uo pipefail
            ROOT="$CIRCLE_WORKING_DIRECTORY"
            SRC="$ROOT/brave-work/src"
            OUT="$SRC/out/android_Release_arm64"
            APK="$OUT/apks/Bravearm64Universal.apk"
            TOOLS="$SRC/third_party/android_sdk/public/build-tools/37.0.0"
            DIAGNOSTICS="$ROOT/brave-apk/siso-diagnostics"
            mkdir -p "$ROOT/brave-apk" "$DIAGNOSTICS"
            for file in siso.INFO siso_output siso_failed_commands.sh; do
              if [ -e "$OUT/$file" ]; then cp -a "$OUT/$file" "$DIAGNOSTICS/"; fi
            done
            for file in "$OUT"/sandium-brave-siso-metrics*.json "$OUT"/sandium-brave-siso-stage-*.jsonl; do
              if [ -f "$file" ]; then cp -a "$file" "$DIAGNOSTICS/"; fi
            done
            CHECKPOINT_DIAGNOSTICS="$ROOT/brave-work/.sandium/checkpoint-diagnostics"
            if [ -d "$CHECKPOINT_DIAGNOSTICS" ]; then cp -a "$CHECKPOINT_DIAGNOSTICS" "$ROOT/brave-apk/"; fi
            ARCHIVE_VALID=false
            SIGNATURE_VALID=not_checked
            PACKAGE_VALID=false
            APP_IDENTITY_VALID=false
            APK_ERROR=""
            if [ -s "$APK" ]; then
              if python3 -c 'import sys,zipfile; z=zipfile.ZipFile(sys.argv[1]); bad=z.testzip(); z.close(); sys.exit(1 if bad else 0)' "$APK"; then
                ARCHIVE_VALID=true
              else
                APK_ERROR="ZIP integrity check failed"
              fi
              if [ "$ARCHIVE_VALID" = true ]; then
                if [ ! -x "$TOOLS/apksigner" ] || [ ! -x "$TOOLS/aapt" ]; then
                  APK_ERROR="pinned Android apksigner/aapt tools are missing"
                elif "$TOOLS/apksigner" verify --verbose --print-certs "$APK" > "$ROOT/brave-apk/apk-signature.txt" 2>&1; then
                  SIGNATURE_VALID=true
                  if "$TOOLS/aapt" dump badging "$APK" > "$ROOT/brave-apk/apk-badging.txt" 2>&1; then
                    PACKAGE="$(sed -n "s/^package: name='\\([^']*\\)'.*/\\1/p" "$ROOT/brave-apk/apk-badging.txt" | head -n 1)"
                    APP_LABEL="$(sed -n "s/^application-label:'\\(.*\\)'$/\\1/p" "$ROOT/brave-apk/apk-badging.txt" | head -n 1)"
                    if [ "$PACKAGE" = "com.brave.browser" ]; then
                      PACKAGE_VALID=true
                    else
                      APK_ERROR="expected package com.brave.browser; got ${PACKAGE:-<missing>}"
                    fi
                    if [ "$APP_LABEL" = "Brave" ]; then
                      APP_IDENTITY_VALID=true
                      echo "BRAVE_APP_LABEL_GATE=PASS label=$APP_LABEL"
                    else
                      APK_ERROR="expected app label Brave; got ${APP_LABEL:-<missing>}"
                      echo "BRAVE_APP_LABEL_GATE=FAIL $APK_ERROR"
                    fi
                  else
                    APK_ERROR="aapt could not read the APK manifest"
                  fi
                else
                  APK_ERROR="APK signature verification failed"
                fi
              fi
            fi
            if [ -s "$APK" ] && [ "$ARCHIVE_VALID" = true ] && [ "$SIGNATURE_VALID" = true ] && [ "$PACKAGE_VALID" = true ] && [ "$APP_IDENTITY_VALID" = true ]; then
              cp "$APK" "$ROOT/brave-apk/Bravearm64Universal.apk"
              python3 "$ROOT/.circleci/scripts/analyze-brave-apk-size.py" "$APK" --require-arm64-only --output "$ROOT/brave-apk/apk-size-report.txt"
              {
                echo "BUILD_FINISHED=true"
                echo "APK_ABI_VALID=true"
                echo "APK_ABI_SET=arm64-v8a"
                echo "APK_ARCHIVE_VALID=true"
                echo "APK_SIGNATURE_VALID=true"
                echo "APK_PACKAGE_ID_VALID=true"
                echo "APK_APP_IDENTITY_VALID=true"
                echo "APK_PACKAGE_ID=com.brave.browser"
                echo "APK_APP_LABEL=Brave"
                echo "APK_FILENAME=Bravearm64Universal.apk"
                echo "APK_SIZE_BYTES=$(stat -c '%s' "$APK")"
              } > "$ROOT/brave-apk/status.txt"
              echo "BRAVE_APK_VALIDATION=PASS"
            else
              {
                echo "BUILD_FINISHED=false"
                echo "APK_ARCHIVE_VALID=$ARCHIVE_VALID"
                echo "APK_SIGNATURE_VALID=$SIGNATURE_VALID"
                echo "APK_PACKAGE_ID_VALID=$PACKAGE_VALID"
                echo "APK_APP_IDENTITY_VALID=$APP_IDENTITY_VALID"
                echo "APK_VALIDATION_ERROR=${APK_ERROR:-APK not produced}"
              } > "$ROOT/brave-apk/status.txt"
              echo "BRAVE_APK_VALIDATION=FAIL ${APK_ERROR:-APK not produced}"
            fi
      - store_artifacts:
          path: brave-apk
          destination: brave-apk
      - run:
          name: Record APK completion marker
          when: always
          command: |
            set -euo pipefail
            ROOT="$CIRCLE_WORKING_DIRECTORY"
            mkdir -p "$ROOT/brave-work/.sandium"
            STATUS="$ROOT/brave-apk/status.txt"
            MARKER="$ROOT/brave-work/.sandium/apk-completion-status.txt"
            if [ -s "$STATUS" ]; then
              cp "$STATUS" "$MARKER"
            else
              printf 'BUILD_FINISHED=false\nAPK_ARCHIVE_VALID=false\nAPK_SIGNATURE_VALID=not_yet_built\nAPK_PACKAGE_ID_VALID=false\nAPK_APP_IDENTITY_VALID=false\n' > "$MARKER"
            fi
            echo "BRAVE_APK_COMPLETION_MARKER=$(grep -qx 'BUILD_FINISHED=true' "$MARKER" && echo VERIFIED || echo INCOMPLETE)"
      - save_cache:
          name: Save small revision-scoped verified APK marker
          key: sandium-brave-apk-complete-v2-{{ .Branch }}-{{ .Revision }}-{{ .Environment.CIRCLE_WORKFLOW_ID }}-stage-<< parameters.stage_index >>
          paths:
            - brave-work/.sandium/apk-completion-status.txt
          when: always
      - when:
          condition:
            or:
              - equal: [full, << pipeline.parameters.sandium_build_mode >>]
              - equal: [brave/vanilla-v1.99.54, << pipeline.git.branch >>]
          steps:
            - run:
                name: Validate Brave checkpoint before saving
                command: |
                  set -euo pipefail
                  ROOT="$CIRCLE_WORKING_DIRECTORY"
                  SRC="$ROOT/brave-work/src"
                  CORE="$SRC/brave"
                  OUT="$SRC/out/android_Release_arm64"
                  test -e "$SRC/.git" || { echo "CHECKPOINT_SAVE=REFUSED missing Chromium Git checkout" >&2; exit 1; }
                  test -e "$CORE/.git" || { echo "CHECKPOINT_SAVE=REFUSED missing Brave Git checkout" >&2; exit 1; }
                  test -s "$ROOT/brave-work/.gclient" || { echo "CHECKPOINT_SAVE=REFUSED missing .gclient" >&2; exit 1; }
                  PYTHON_REMOTE_WRAPPER="$SRC/buildtools/reclient_cfgs/python/python_remote_wrapper"
                  test -x "$PYTHON_REMOTE_WRAPPER" || { echo "CHECKPOINT_SAVE=REFUSED Brave Python remote wrapper is not executable" >&2; exit 1; }
                  test -s "$OUT/build.ninja" || { echo "CHECKPOINT_SAVE=REFUSED missing build.ninja" >&2; exit 1; }
                  test -s "$OUT/args.gn" || { echo "CHECKPOINT_SAVE=REFUSED missing args.gn" >&2; exit 1; }
                  ARGS_GENERATED="$OUT/args_generated.gni"
                  SISO_ENV="$SRC/build/config/siso/.sisoenv"
                  SISO_RC="$SRC/build/config/siso/.sisorc"
                  SISO_BACKEND="$SRC/build/config/siso/backend_config/backend.star"
                  test -s "$ARGS_GENERATED" || { echo "CHECKPOINT_SAVE=REFUSED missing args_generated.gni" >&2; exit 1; }
                  grep -F 'args_generated.gni' "$OUT/args.gn" >/dev/null || { echo "CHECKPOINT_SAVE=REFUSED args.gn import missing" >&2; exit 1; }
                  grep -Fx 'use_remoteexec=true' "$ARGS_GENERATED" >/dev/null || { echo "CHECKPOINT_SAVE=REFUSED generated use_remoteexec missing" >&2; exit 1; }
                  grep -Fx 'use_siso=true' "$ARGS_GENERATED" >/dev/null || { echo "CHECKPOINT_SAVE=REFUSED generated use_siso missing" >&2; exit 1; }
                  grep -Fx 'use_reclient=false' "$ARGS_GENERATED" >/dev/null || { echo "CHECKPOINT_SAVE=REFUSED generated use_reclient missing" >&2; exit 1; }
                  test -s "$SISO_ENV" && test -s "$SISO_RC" && test -s "$SISO_BACKEND" || { echo "CHECKPOINT_SAVE=REFUSED Siso configuration incomplete" >&2; exit 1; }
                  SISO_BRAVE_CONFIG="$SRC/build/config/siso/brave_siso_config.star"
                  test -s "$SISO_BRAVE_CONFIG" || { echo "CHECKPOINT_SAVE=REFUSED missing Brave Siso configuration" >&2; exit 1; }
                  grep -Fq 'rule["canonicalize_dir"] = True' "$SISO_BRAVE_CONFIG" || { echo "CHECKPOINT_SAVE=REFUSED Siso canonical workdir must remain enabled" >&2; exit 1; }
                  grep -Fq '"./args.gn"' "$SISO_BRAVE_CONFIG" || { echo "CHECKPOINT_SAVE=REFUSED Siso remote rules lack explicit ./args.gn workdir anchor" >&2; exit 1; }
                  bash "$ROOT/.circleci/scripts/verify-clang-diagnostics-gn.sh"
                  echo "CHECKPOINT_CLANG_DIAGNOSTIC_PATH_GATE=PASS"
                  grep -Fx "SISO_CREDENTIAL_HELPER=/tmp/sandium-buildbuddy-credential-helper.py" "$SISO_ENV" >/dev/null || { echo "CHECKPOINT_SAVE=REFUSED Siso credential helper not configured" >&2; exit 1; }
                  for REQUIRED_SISO_FLAG in \
                    '-reapi_keep_exec_stream' \
                    '-fs_min_flush_timeout 300s' \
                    '-reapi_byte_stream_read_threshold 1024' \
                    '-config googlechrome,remote-link' \
                    '-re_cache_enable_write=true'; do
                    grep -Fq -- "$REQUIRED_SISO_FLAG" "$SISO_RC" || {
                      echo "CHECKPOINT_SAVE=REFUSED missing Siso flag: $REQUIRED_SISO_FLAG" >&2
                      exit 1
                    }
                  done
                  test -x /tmp/sandium-buildbuddy-credential-helper.py || { echo "CHECKPOINT_SAVE=REFUSED credential helper not executable" >&2; exit 1; }
                  test -s "$ROOT/brave-work/.sandium/source-pins.env" || { echo "CHECKPOINT_SAVE=REFUSED source-pins.env missing" >&2; exit 1; }
                  source "$ROOT/brave-work/.sandium/source-pins.env"
                  ACTUAL_CHROMIUM_SHA="$(git -C "$SRC" rev-parse HEAD)"
                  BRAVE_TAG="$(git -C "$CORE" describe --tags --exact-match 2>/dev/null || true)"
                  test "$BRAVE_CORE_TAG" = "v1.99.54" || { echo "CHECKPOINT_SAVE=REFUSED Brave pin mismatch: $BRAVE_CORE_TAG" >&2; exit 1; }
                  test "$CHROMIUM_TAG" = "157.0.8103.30" || { echo "CHECKPOINT_SAVE=REFUSED Chromium tag mismatch: $CHROMIUM_TAG" >&2; exit 1; }
                  test "$ACTUAL_CHROMIUM_SHA" = "$CHROMIUM_SHA" || { echo "CHECKPOINT_SAVE=REFUSED Chromium SHA mismatch: $ACTUAL_CHROMIUM_SHA expected $CHROMIUM_SHA" >&2; exit 1; }
                  test "$BRAVE_TAG" = "$BRAVE_CORE_TAG" || { echo "CHECKPOINT_SAVE=REFUSED Brave tag mismatch: $BRAVE_TAG" >&2; exit 1; }
                  CHROMIUM_SHA="$ACTUAL_CHROMIUM_SHA"
                  mkdir -p "$ROOT/brave-work/.sandium"
                  APK_VALIDATED=false
                  APK_MARKER="$ROOT/brave-work/.sandium/apk-completion-status.txt"
                  if python3 "$ROOT/.circleci/scripts/check-apk-completion-marker.py" "$APK_MARKER"; then
                    APK_VALIDATED=true
                  fi
                  {
                    echo "CHECKPOINT_VALID=true"
                    echo "REFERENCE_MODE=reference"
                    echo "APK_VALIDATED=$APK_VALIDATED"
                    echo "REFERENCE_READY=$APK_VALIDATED"
                    echo "REFERENCE_SOURCE_REVISION={{ .Revision }}"
                    echo "BRAVE_CORE_TAG=$BRAVE_TAG"
                    echo "CHROMIUM_TAG=$CHROMIUM_TAG"
                    echo "CHROMIUM_SHA=$CHROMIUM_SHA"
                    echo "TARGET=android-arm64"
                    echo "BUILD_TYPE=Release"
                    echo "OFFICIAL_BUILD=true"
                    echo "TARGET_ANDROID_OUTPUT_FORMAT=aab"
                    echo "ANDROID_AAB_TO_APK=true"
                    echo "PACKAGE_ID=com.brave.browser"
                    echo "APP_LABEL=Brave"
                    echo "APK_FILENAME=Bravearm64Universal.apk"
                    echo "STAGE=<< parameters.stage_index >>"
                    echo "ARGS_GENERATED_SHA256=$(sha256sum "$ARGS_GENERATED" | awk '{print $1}')"
                    echo "SISO_ENV_SHA256=$(sha256sum "$SISO_ENV" | awk '{print $1}')"
                    echo "SISO_RC_SHA256=$(sha256sum "$SISO_RC" | awk '{print $1}')"
                    echo "SISO_BACKEND_SHA256=$(sha256sum "$SISO_BACKEND" | awk '{print $1}')"
                    OBJECT_COUNT=0
                    if [ -d "$OUT/obj" ]; then
                      OBJECT_COUNT="$(find "$OUT/obj" -type f -name '*.o' | wc -l | tr -d ' ')"
                    fi
                    echo "COMPILED_OBJECT_COUNT=$OBJECT_COUNT"
                    date -u +"SAVED_AT=%Y-%m-%dT%H:%M:%SZ"
                    du -sh "$ROOT/brave-work"
                    du -sh "$OUT"
                  } > "$ROOT/brave-work/.sandium/checkpoint-manifest.txt"
                  echo "CHECKPOINT_SAVE=PASS"
                  cat "$ROOT/brave-work/.sandium/checkpoint-manifest.txt"
            - run:
                name: Capture final Siso checkpoint state before cache save
                command: |
                  set -euo pipefail
                  export BRAVE_STAGE_INDEX="<< parameters.stage_index >>"
                  bash .circleci/scripts/capture-brave-siso-checkpoint.sh checkpoint-ready
            - run:
                name: SANDIUM-FULL-MODE - Create 8 parallel checkpoint shards
                no_output_timeout: 45m
                command: |
                  set -euo pipefail
                  export BRAVE_STAGE_INDEX="<< parameters.stage_index >>"
                  export SANDIUM_ARCHIVE_WORKERS=8
                  bash .circleci/scripts/archive-brave-workspace.sh archive
            - save_cache:
                name: Save FULL MODE parallel stage handoff shards
                key: sandium-brave-handoff-v2-{{ .Branch }}-{{ .Environment.CIRCLE_WORKFLOW_ID }}-stage-<< parameters.stage_index >>
                paths:
                  - brave-workspace-checkpoint.shards
                  - brave-workspace-checkpoint.manifest.json
      - run:
          name: Final five-stage completion gate
          command: |
            set -euo pipefail
            ROOT="$CIRCLE_WORKING_DIRECTORY"
            STAGE="<< parameters.stage_index >>"
            APK_STATUS="$ROOT/brave-work/.sandium/apk-completion-status.txt"
            MODE="<< pipeline.parameters.sandium_build_mode >>"
            if [ "${CIRCLE_BRANCH:-}" = "brave/vanilla-v1.99.54" ]; then MODE=full; fi
            if [ "$MODE" = "full" ]; then
              python3 "$ROOT/.circleci/scripts/checkpoint-stage-receipt.py" verify \
                --root "$ROOT" \
                --stage "$STAGE" \
                --workflow-id "$CIRCLE_WORKFLOW_ID"
            elif [ "$MODE" = "fast" ]; then
              test ! -e "$ROOT/brave-work/.sandium/workspace-archive-created-this-run" || { echo "FINAL_STAGE_GATE=FAIL FAST MODE unexpectedly created a workspace archive" >&2; exit 1; }
            else
              echo "FINAL_STAGE_GATE=FAIL unknown mode=$MODE" >&2
              exit 1
            fi
            if python3 "$ROOT/.circleci/scripts/check-apk-completion-marker.py" "$APK_STATUS"; then
              if [ "$MODE" = "full" ]; then
                grep -qx "REFERENCE_READY=true" "$ROOT/brave-work/.sandium/checkpoint-manifest.txt" || { echo "FINAL_STAGE_GATE=FAIL APK passed but reference manifest is not ready" >&2; exit 1; }
                echo "FINAL_STAGE_GATE=PASS FULL MODE APK validated; handoff archive saved; reference promotion follows."
              else
                echo "FINAL_STAGE_GATE=PASS FAST MODE APK validated; full archive correctly skipped."
              fi
              exit 0
            fi
            if [ "$STAGE" -lt 5 ]; then
              if [ "$MODE" = "full" ]; then
                echo "FINAL_STAGE_GATE=PASS FULL MODE handoff saved; next stage resumes from the native Ninja/Siso build state."
              else
                echo "FINAL_STAGE_GATE=PASS FAST MODE; immutable reference restored and BuildBuddy remote action cache remains available."
              fi
              exit 0
            fi
            echo "FINAL_STAGE_GATE=FAIL five stages exhausted without a verified Brave APK." >&2
            exit 1

  promote-brave-reference:
    machine:
      image: ubuntu-2404:current
    resource_class: medium
    steps:
      - run:
          name: Skip reference promotion in FAST MODE
          command: |
            set -euo pipefail
            MODE="<< pipeline.parameters.sandium_build_mode >>"
            if [ "${CIRCLE_BRANCH:-}" = "brave/vanilla-v1.99.54" ]; then MODE=full; fi
            if [ "$MODE" != "full" ]; then
              echo "SANDIUM_REFERENCE_PROMOTION=SKIPPED mode=$MODE"
              circleci-agent step halt
            fi
            echo "SANDIUM_FULL_MODE_REFERENCE_PROMOTION=START"
      - checkout
      - restore_cache:
          name: Restore APK-producing FULL MODE shard handoff
          keys:
            - sandium-brave-handoff-v2-{{ .Branch }}-{{ .Environment.CIRCLE_WORKFLOW_ID }}-
      - restore_cache:
          name: Restore verified APK marker from reference-build stages
          keys:
            - sandium-brave-apk-complete-v2-{{ .Branch }}-{{ .Revision }}-{{ .Environment.CIRCLE_WORKFLOW_ID }}-
      - run:
          name: Verify all FULL MODE shards and prepare immutable reference
          command: |
            set -euo pipefail
            ROOT="$CIRCLE_WORKING_DIRECTORY"
            APK_MARKER="$ROOT/brave-work/.sandium/apk-completion-status.txt"
            SHARD_MANIFEST="$ROOT/brave-workspace-checkpoint.manifest.json"
            fail() { echo "REFERENCE_PROMOTION=FAIL $*" >&2; exit 1; }
            [ -s "$APK_MARKER" ] || fail "APK completion marker missing"
            for pair in \
              "BUILD_FINISHED=true" \
              "APK_ARCHIVE_VALID=true" \
              "APK_SIGNATURE_VALID=true" \
              "APK_PACKAGE_ID_VALID=true" \
              "APK_APP_IDENTITY_VALID=true"; do
              grep -Fx "$pair" "$APK_MARKER" >/dev/null || fail "APK marker lacks $pair"
            done
            export SANDIUM_ARCHIVE_WORKERS=8
            bash .circleci/scripts/archive-brave-workspace.sh verify
            python3 -c 'import json,sys; from pathlib import Path; d=json.loads(Path(sys.argv[1]).read_text(encoding="utf-8")); c=d.get("checkpoint_manifest",{}); req={"CHECKPOINT_VALID":"true","REFERENCE_MODE":"reference","APK_VALIDATED":"true","REFERENCE_READY":"true","CHROMIUM_TAG":"157.0.8103.30","BRAVE_CORE_TAG":"v1.99.54","TARGET":"android-arm64","BUILD_TYPE":"Release","OFFICIAL_BUILD":"true","TARGET_ANDROID_OUTPUT_FORMAT":"aab","ANDROID_AAB_TO_APK":"true","PACKAGE_ID":"com.brave.browser","APP_LABEL":"Brave","APK_FILENAME":"Bravearm64Universal.apk"}; bad=[k for k,v in req.items() if c.get(k)!=v]; sha=c.get("CHROMIUM_SHA",""); import re; assert re.fullmatch(r"[0-9a-f]{40}",sha), "REFERENCE_PROMOTION=FAIL invalid Chromium SHA"; assert not bad, "REFERENCE_PROMOTION=FAIL missing or incorrect keys: "+",".join(bad); Path(sys.argv[2]).write_text("\\n".join("%s=%s" % (k,v) for k,v in sorted(c.items()))+"\\n",encoding="utf-8"); print("REFERENCE_PROMOTION=PASS workers=%s shards=%s source_bytes=%s archive_bytes=%s" % (d.get("workers"),len(d.get("shards",[])),d.get("source_bytes"),d.get("archive_bytes")))' "$SHARD_MANIFEST" "$ROOT/reference-candidate-manifest.txt"
            echo "REFERENCE_PROMOTION=CANDIDATE_VERIFIED"
      - save_cache:
          name: Promote immutable latest Sandium parallel-shard reference
          key: sandium-brave-reference-v3-{{ .Branch }}-{{ .Environment.CIRCLE_WORKFLOW_ID }}
          paths:
            - brave-workspace-checkpoint.shards
            - brave-workspace-checkpoint.manifest.json
            - reference-candidate-manifest.txt
      - run:
          name: Confirm parallel-shard reference promotion
          command: |
            set -euo pipefail
            test -d "$CIRCLE_WORKING_DIRECTORY/brave-workspace-checkpoint.shards"
            test -s "$CIRCLE_WORKING_DIRECTORY/brave-workspace-checkpoint.manifest.json"
            test -s "$CIRCLE_WORKING_DIRECTORY/reference-candidate-manifest.txt"
            echo "SANDIUM_LATEST_REFERENCE=PROMOTED format=parallel-shards workers=8"
            cat "$CIRCLE_WORKING_DIRECTORY/reference-candidate-manifest.txt"

workflows:
  sandium-source-prep-validation:
    jobs:
      - sandium-source-prep-validation:
          filters:
            branches:
              only:
                - optimization/incremental-brave-source-sync
                - fix/source-prep-nonresumable-git-fetch
                - fix/chromium-partial-fetch-and-source-shards
  c4-afterbird-staged-checkpoint-build:
    jobs:
      - c4-afterbird-staged-build:
          name: c4-afterbird-stage-1
          stage_index: 1
          filters:
            branches:
              only:
                - sandfox/checkpoint-stage-v1
                - ss2-from-ss1
      - c4-afterbird-staged-build:
          name: c4-afterbird-stage-2
          stage_index: 2
          requires:
            - c4-afterbird-stage-1
          filters:
            branches:
              only:
                - sandfox/checkpoint-stage-v1
                - ss2-from-ss1
      - c4-afterbird-staged-build:
          name: c4-afterbird-stage-3
          stage_index: 3
          requires:
            - c4-afterbird-stage-2
          filters:
            branches:
              only:
                - sandfox/checkpoint-stage-v1
                - ss2-from-ss1
      - c4-afterbird-staged-build:
          name: c4-afterbird-stage-4
          stage_index: 4
          requires:
            - c4-afterbird-stage-3
          filters:
            branches:
              only:
                - sandfox/checkpoint-stage-v1
                - ss2-from-ss1
      - c4-afterbird-staged-build:
          name: c4-afterbird-stage-5
          stage_index: 5
          requires:
            - c4-afterbird-stage-4
          filters:
            branches:
              only:
                - sandfox/checkpoint-stage-v1
                - ss2-from-ss1
  sandium-source-preparation:
    # Automatically run source preparation on this dedicated branch after a push.
    # Manual source-prep parameter remains supported on the pinned Brave branch.
    when:
      or:
        - equal: [source-prep, << pipeline.parameters.sandium_build_mode >>]
        - equal: [architecture/separate-brave-source-preparation, << pipeline.git.branch >>]
        - equal: [architecture/sandium-pinning-v2-build, << pipeline.git.branch >>]
        - equal: [work/pinned-data-save-hardening, << pipeline.git.branch >>]
        - equal: [fix/source-prep-nonresumable-git-fetch, << pipeline.git.branch >>]
    jobs:
      - brave-source-preparation-stage:
          name: SANDIUM-SOURCE-PREP-stage-1
          stage_index: 1
          filters:
            branches:
              only:
                - brave/vanilla-v1.99.54
                - architecture/separate-brave-source-preparation
                - architecture/sandium-pinning-v2-build
                - work/pinned-data-save-hardening
                - fix/chromium-partial-fetch-and-source-shards
                - fix/source-prep-nonresumable-git-fetch
                - fix/chromium-partial-fetch-and-source-shards
      - brave-source-preparation-stage:
          name: SANDIUM-SOURCE-PREP-stage-2
          stage_index: 2
          requires: [SANDIUM-SOURCE-PREP-stage-1]
          filters:
            branches:
              only:
                - brave/vanilla-v1.99.54
                - architecture/separate-brave-source-preparation
                - architecture/sandium-pinning-v2-build
                - work/pinned-data-save-hardening
                - fix/source-prep-nonresumable-git-fetch
                - fix/chromium-partial-fetch-and-source-shards
      - brave-source-preparation-stage:
          name: SANDIUM-SOURCE-PREP-stage-3
          stage_index: 3
          requires: [SANDIUM-SOURCE-PREP-stage-2]
          filters:
            branches:
              only:
                - brave/vanilla-v1.99.54
                - architecture/separate-brave-source-preparation
                - architecture/sandium-pinning-v2-build
                - work/pinned-data-save-hardening
                - fix/source-prep-nonresumable-git-fetch
                - fix/chromium-partial-fetch-and-source-shards
      - brave-source-preparation-stage:
          name: SANDIUM-SOURCE-PREP-stage-4
          stage_index: 4
          requires: [SANDIUM-SOURCE-PREP-stage-3]
          filters:
            branches:
              only:
                - brave/vanilla-v1.99.54
                - architecture/separate-brave-source-preparation
                - architecture/sandium-pinning-v2-build
                - work/pinned-data-save-hardening
                - fix/source-prep-nonresumable-git-fetch
                - fix/chromium-partial-fetch-and-source-shards
      - brave-source-preparation-stage:
          name: SANDIUM-SOURCE-PREP-stage-5
          stage_index: 5
          requires: [SANDIUM-SOURCE-PREP-stage-4]
          filters:
            branches:
              only:
                - brave/vanilla-v1.99.54
                - architecture/separate-brave-source-preparation
                - architecture/sandium-pinning-v2-build
                - work/pinned-data-save-hardening
                - fix/source-prep-nonresumable-git-fetch
                - fix/chromium-partial-fetch-and-source-shards
      - promote-brave-pinned-source-reference:
          name: SANDIUM-SOURCE-PREP-reference-promotion
          requires: [SANDIUM-SOURCE-PREP-stage-5]
          filters:
            branches:
              only:
                - brave/vanilla-v1.99.54
                - architecture/separate-brave-source-preparation
                - architecture/sandium-pinning-v2-build
                - work/pinned-data-save-hardening
  sandium-full-mode:
    when:
      and:
        - not:
            equal: [source-prep, << pipeline.parameters.sandium_build_mode >>]
        - or:
            - equal: [full, << pipeline.parameters.sandium_build_mode >>]
            - equal: [brave/vanilla-v1.99.54, << pipeline.git.branch >>]
    jobs:
      - brave-android-staged-build:
          name: SANDIUM-FULL-MODE-stage-1
          stage_index: 1
          filters:
            branches:
              only:
                - sandium/brave-android-poc
                - sandium/archive-zstd-fast5
                - sandium/fix-archive-completion-gate
                - brave/vanilla-v1.99.54
      - brave-android-staged-build:
          name: SANDIUM-FULL-MODE-stage-2
          stage_index: 2
          requires: [SANDIUM-FULL-MODE-stage-1]
          filters:
            branches:
              only:
                - sandium/brave-android-poc
                - sandium/archive-zstd-fast5
                - sandium/fix-archive-completion-gate
                - brave/vanilla-v1.99.54
      - brave-android-staged-build:
          name: SANDIUM-FULL-MODE-stage-3
          stage_index: 3
          requires: [SANDIUM-FULL-MODE-stage-2]
          filters:
            branches:
              only:
                - sandium/brave-android-poc
                - sandium/archive-zstd-fast5
                - sandium/fix-archive-completion-gate
                - brave/vanilla-v1.99.54
      - brave-android-staged-build:
          name: SANDIUM-FULL-MODE-stage-4
          stage_index: 4
          requires: [SANDIUM-FULL-MODE-stage-3]
          filters:
            branches:
              only:
                - sandium/brave-android-poc
                - sandium/archive-zstd-fast5
                - sandium/fix-archive-completion-gate
                - brave/vanilla-v1.99.54
      - brave-android-staged-build:
          name: SANDIUM-FULL-MODE-stage-5
          stage_index: 5
          requires: [SANDIUM-FULL-MODE-stage-4]
          filters:
            branches:
              only:
                - sandium/brave-android-poc
                - sandium/archive-zstd-fast5
                - sandium/fix-archive-completion-gate
                - brave/vanilla-v1.99.54
      - promote-brave-reference:
          name: SANDIUM-FULL-MODE-reference-promotion
          requires: [SANDIUM-FULL-MODE-stage-5]
          filters:
            branches:
              only:
                - sandium/brave-android-poc
                - brave/vanilla-v1.99.54
  sandium-fast-mode:
    when:
      equal: [fast, << pipeline.parameters.sandium_build_mode >>]
    jobs:
      - brave-android-staged-build:
          name: SANDIUM-FAST-MODE-stage-1
          stage_index: 1
          filters:
            branches:
              only:
                - sandium/brave-android-poc
                - sandium/archive-zstd-fast5
                - sandium/branding-stage
                - sandium/ublock-filter-lists
      - brave-android-staged-build:
          name: SANDIUM-FAST-MODE-stage-2
          stage_index: 2
          requires: [SANDIUM-FAST-MODE-stage-1]
          filters:
            branches:
              only:
                - sandium/brave-android-poc
                - sandium/archive-zstd-fast5
                - sandium/branding-stage
                - sandium/ublock-filter-lists
      - brave-android-staged-build:
          name: SANDIUM-FAST-MODE-stage-3
          stage_index: 3
          requires: [SANDIUM-FAST-MODE-stage-2]
          filters:
            branches:
              only:
                - sandium/brave-android-poc
                - sandium/archive-zstd-fast5
                - sandium/branding-stage
                - sandium/ublock-filter-lists
      - brave-android-staged-build:
          name: SANDIUM-FAST-MODE-stage-4
          stage_index: 4
          requires: [SANDIUM-FAST-MODE-stage-3]
          filters:
            branches:
              only:
                - sandium/brave-android-poc
                - sandium/archive-zstd-fast5
                - sandium/branding-stage
                - sandium/ublock-filter-lists
      - brave-android-staged-build:
          name: SANDIUM-FAST-MODE-stage-5
          stage_index: 5
          requires: [SANDIUM-FAST-MODE-stage-4]
          filters:
            branches:
              only:
                - sandium/brave-android-poc
                - sandium/archive-zstd-fast5
                - sandium/branding-stage
                - sandium/ublock-filter-lists
