version: 2.1
parameters:
  run_sanb:
    type: boolean
    default: false
  sanb_mode:
    type: enum
    enum: [preflight, build, source-audit]
    default: preflight

jobs:
  sanb-source-audit:
    machine:
      image: ubuntu-2404:current
    resource_class: medium
    environment:
      PYTHONUNBUFFERED: "1"
    steps:
      - checkout
      - run:
          name: Verify source-audit-only request and exact branch
          command: |
            set -euo pipefail
            test "$CIRCLE_BRANCH" = "sanb/official158"
            test "$(git rev-parse HEAD)" = "$CIRCLE_SHA1"
            test "<< pipeline.parameters.run_sanb >>" = "true"
            test "<< pipeline.parameters.sanb_mode >>" = "source-audit"
      - run:
          name: Test SanB source-audit limits and isolation
          command: python3 -m unittest discover -s tests/sanb -v
      - run:
          name: Fetch pinned source preimages and replay chronology offline
          command: timeout --kill-after=10s 23m python3 -u tools/sanb_source_audit_ci.py
          no_output_timeout: 7m
      - store_artifacts:
          path: .sanb-source-audit-artifacts
          destination: sanb-source-audit

  sanb-android-arm64:
    machine:
      image: ubuntu-2404:current
    resource_class: large
    environment:
      PYTHONUNBUFFERED: "1"
    steps:
      - checkout
      - run:
          name: Verify SanB identity and start bounded worker budget
          command: |
            set -euo pipefail
            test "$CIRCLE_BRANCH" = "sanb/official158"
            test "$(git rev-parse HEAD)" = "$CIRCLE_SHA1"
            mkdir -m 700 .sanb-artifacts
            python3 -c 'import time; from pathlib import Path; Path(".sanb-artifacts/epoch").write_text(str(time.time()))'
      - run:
          name: Test isolated SanB admission and APK proof
          command: python3 -m unittest discover -s tests/sanb -v
      - run:
          name: Verify source and run requested SanB phase
          command: python3 -u tools/sanb_ci.py --mode "<< pipeline.parameters.sanb_mode >>"
          no_output_timeout: 10m
      - store_artifacts:
          path: .sanb-artifacts
          destination: sanb

workflows:
  SanB:
    when:
      and:
        - << pipeline.parameters.run_sanb >>
        - equal: [sanb/official158, << pipeline.git.branch >>]
    jobs:
      - sanb-source-audit:
          filters: pipeline.parameters.sanb_mode == "source-audit" and pipeline.git.branch == "sanb/official158"
      - sanb-android-arm64:
          filters: pipeline.parameters.sanb_mode != "source-audit" and pipeline.git.branch == "sanb/official158"
