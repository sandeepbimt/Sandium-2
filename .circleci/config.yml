              SISO_RC_SHA="$(sha256sum "$SRC_DIR/build/config/siso/.sisorc" | awk '{print $1}')"
              SISO_BACKEND_SHA="$(sha256sum "$SRC_DIR/build/config/siso/backend_config/backend.star" | awk '{print $1}')"
              BRAVE_SISO_SHA="$(sha256sum "$SRC_DIR/build/config/siso/brave_siso_config.star" | awk '{print $1}')"
              CLANG_GNI_SHA="$(sha256sum "$SRC_DIR/build/config/compiler/compiler.gni" | awk '{print $1}')"
              printf '%s\n' \
                'schema=1' \
                'source_timestamp_policy=epoch_946684800_full_tree_v2_depth_first_dirs' \
                "brave_core_sha=$CORE_SHA" \
                "chromium_sha=$CHROMIUM_SHA" \
                "package_deps_sha=$PACKAGE_SHA" \
                "env_sha=$ENV_SHA" \
                "siso_env_sha=$SISO_ENV_SHA" \
                "siso_rc_sha=$SISO_RC_SHA" \
                "siso_backend_sha=$SISO_BACKEND_SHA" \
                "brave_siso_sha=$BRAVE_SISO_SHA" \
                "clang_compiler_gni_sha=$CLANG_GNI_SHA" \
                'build_config=Debug' \
                'target_os=android' \
                'target_cpu=arm64' \
                'target=brave' \
                'out=out/android_Debug_arm64' \
                > "$ROOT/brave-source-identity.txt"
            }

            if [ -s "$CHECKPOINT" ] && [ -s "$CHECKPOINT_META" ]; then
              echo "CHECKPOINT_CANDIDATE=FOUND"
              if tar -x -I 'zstd -T0 -d' -f "$CHECKPOINT" -C "$SRC_DIR"; then
                if [ -s "$OUT_DIR/build.ninja" ] && [ -s "$OUT_DIR/args.gn" ] && [ -s "$OUT_DIR/args_generated.gni" ]; then
                  write_source_identity
                  ARGS_SHA="$(cat "$OUT_DIR/args.gn" "$OUT_DIR/args_generated.gni" | sha256sum | awk '{print $1}')"
                  cat "$ROOT/brave-source-identity.txt" > "$CURRENT_META"
                  printf 'args_sha=%s\n' "$ARGS_SHA" >> "$CURRENT_META"
                  if cmp -s "$CURRENT_META" "$CHECKPOINT_META" && { [ -s "$OUT_DIR/.siso_fs_state" ] || [ -s "$OUT_DIR/.siso_fs_state.journal" ] || [ -e "$OUT_DIR/build.ninja.stamp" ]; }; then
                    RESTORED=true
