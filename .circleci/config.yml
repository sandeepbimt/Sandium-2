        name: Save independent completed full archive
        key: raws-final-base-v1-{{ checksum ".raws-final-archive/base.key" }}
        paths:
        - raw-workspace-checkpoint.manifest.json
        - raw-workspace-checkpoint.shards
    - run:
        name: Final archive clear
        command: python3 -u tools/ci_final_archive.py clear
        no_output_timeout: 55m
    - restore_cache:
        name: Read back exact completed full archive
        keys:
        - raws-final-base-v1-{{ checksum ".raws-final-archive/base.key" }}
    - run:
        name: Final archive verify-publish
        command: python3 -u tools/ci_final_archive.py verify-publish
        no_output_timeout: 55m
    - save_cache:
        name: Save independent verified final receipt
        key: raws-final-receipt-v1-{{ checksum ".raws-final-archive/receipt.json" }}
        paths:
        - .raws-final-archive
    - store_artifacts:
        path: .raws-final-archive
        destination: raws-final-archive-evidence
job-groups:
  raws-full-chain:
    jobs:
    - raws-full-stage-1:
        filters:
          branches:
            only: raw-sandium/bootstrap
    - raws-full-stage-2:
        filters:
          branches:
            only: raw-sandium/bootstrap
        requires:
        - raws-full-stage-1
    - raws-full-stage-3:
        filters:
          branches:
            only: raw-sandium/bootstrap
        requires:
        - raws-full-stage-2
    - raws-full-stage-4:
        filters:
          branches:
            only: raw-sandium/bootstrap
        requires:
        - raws-full-stage-3
    - raws-full-stage-5:
        filters:
          branches:
            only: raw-sandium/bootstrap
        requires:
        - raws-full-stage-4
  raws-final-chain:
    jobs:
    - raws-final-compile:
        filters:
          branches:
            only: raw-sandium/bootstrap
    - raws-final-pack:
        requires:
        - raws-final-compile
        filters:
          branches:
            only: raw-sandium/bootstrap
workflows:
  raw-sandium-feasibility:
    when: << pipeline.parameters.run_raw_preflight >>
    jobs:
    - raw-preflight:
        filters:
          branches:
            only: raw-sandium/bootstrap
  raw-sandium-bootstrap:
    when: << pipeline.parameters.run_raw_bootstrap >>
    jobs:
    - raw-bootstrap:
        filters:
          branches:
            only: raw-sandium/bootstrap
  RawS full:
    when: << pipeline.parameters.run_raw_full >>
    jobs:
    - raws-full-chain:
        serial-group: << pipeline.project.slug >>/raws-full
  RawS checkpoint maintenance:
    when: << pipeline.parameters.run_raw_maintenance >>
    jobs:
    - raws-maintenance:
        serial-group: << pipeline.project.slug >>/raws-full
        filters:
          branches:
            only: raw-sandium/bootstrap
  RawS one-off final archive:
    when: << pipeline.parameters.run_raw_final_archive >>
    jobs:
    - raws-final-chain:
        serial-group: << pipeline.project.slug >>/raws-full
