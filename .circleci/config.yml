    - run:
        name: Clear incoming payload 5
        command: rm -rf .checkpoint-incoming
    - restore_cache:
        name: Restore exact required layer 5
        keys:
        - sandium-bridge-delta-v1-{{ checksum ".checkpoint-state/slot-5.key" }}
    - run:
        name: Verify and ingest required layer 5
        command: python3 -u .circleci/bridge/driver.py ingest --slot 5
    - run:
        name: Clear incoming payload 6
        command: rm -rf .checkpoint-incoming
    - restore_cache:
        name: Restore exact required layer 6
        keys:
        - sandium-bridge-delta-v1-{{ checksum ".checkpoint-state/slot-6.key" }}
    - run:
        name: Verify and ingest required layer 6
        command: python3 -u .circleci/bridge/driver.py ingest --slot 6
    - run:
        name: Clear incoming payload 7
        command: rm -rf .checkpoint-incoming
    - restore_cache:
        name: Restore exact required layer 7
        keys:
        - sandium-bridge-delta-v1-{{ checksum ".checkpoint-state/slot-7.key" }}
    - run:
        name: Verify and ingest required layer 7
        command: python3 -u .circleci/bridge/driver.py ingest --slot 7
    - run:
        name: Reconstruct complete base plus all accepted deltas
        command: python3 -u .circleci/bridge/driver.py restore
        no_output_timeout: 35m
    - run:
        name: Inventory complete restored state before any preparation/build
        command: python3 -u .circleci/bridge/driver.py begin
    - run:
        name: Configure Siso BuildBuddy API-key credential helper
        command: bash .circleci/experimental-steps/credential-helper.sh
    - run:
        name: Check crash-fix composition before real build
        command: python3 tests/test_composition.py
    - run:
        name: Validate pinned reference and prepare single product recipe
        command: 'export BRAVE_STAGE_INDEX="${SANDIUM_STAGE}"

          bash .circleci/scripts/verify-flow-state.sh

          bash .circleci/scripts/prepare-brave-source.sh'
    - run:
        name: Apply and verify Sandium branding refresh
        command: bash .circleci/experimental-steps/product-overlay-24-0.sh
    - run:
        name: Apply Sandium first-launch native filter bootstrap
        command: bash .circleci/experimental-steps/product-overlay-25-0.sh
    - run:
        name: Apply Sandium native page-transition controls and Appearance icons
        command: bash .circleci/experimental-steps/product-overlay-26-0.sh
    - run:
        name: Apply Sandium welcome setup and first-successful-list adblock activation
        command: bash .circleci/experimental-steps/product-overlay-27-0.sh
    - run:
        name: Apply Sandium two-state Shields controls and verify filter retirement
        command: bash .circleci/experimental-steps/product-overlay-28-0.sh
    - run:
        name: Apply and verify Sandium UI pruning and preference defaults
        command: bash .circleci/experimental-steps/product-overlay-29-0.sh
    - run:
        name: Compile-exclude and audit all thirteen Sandium removal groups
        command: bash .circleci/experimental-steps/product-overlay-30-0.sh
    - run:
