        command: |
          set -euo pipefail
          ROOT="$CIRCLE_WORKING_DIRECTORY"
          SRC="$ROOT/brave-work/src"
          CORE="$SRC/brave"
          OUT="$SRC/out/android_Release_arm64"
          test -e "$SRC/.git" || { echo "CHECKPOINT_SAVE=REFUSED missing Chromium Git checkout" >&2; exit 1; }
          test -e "$CORE/.git" || { echo "CHECKPOINT_SAVE=REFUSED missing Brave Git checkout" >&2; exit 1; }
          test -s "$ROOT/brave-work/.gclient" || { echo "CHECKPOINT_SAVE=REFUSED missing .gclient" >&2; exit 1; }
          PYTHON_REMOTE_WRAPPER="$SRC/buildtools/reclient_cfgs/python/python_remote_wrapper"
          test -x "$PYTHON_REMOTE_WRAPPER" || { echo "CHECKPOINT_SAVE=REFUSED Brave Python remote wrapper is not executable" >&2; exit 1; }
          test -s "$OUT/build.ninja" || { echo "CHECKPOINT_SAVE=REFUSED missing build.ninja" >&2; exit 1; }
          test -s "$OUT/args.gn" || { echo "CHECKPOINT_SAVE=REFUSED missing args.gn" >&2; exit 1; }
          ARGS_GENERATED="$OUT/args_generated.gni"
          SISO_ENV="$SRC/build/config/siso/.sisoenv"
          SISO_RC="$SRC/build/config/siso/.sisorc"
          SISO_BACKEND="$SRC/build/config/siso/backend_config/backend.star"
          test -s "$ARGS_GENERATED" || { echo "CHECKPOINT_SAVE=REFUSED missing args_generated.gni" >&2; exit 1; }
          grep -F 'args_generated.gni' "$OUT/args.gn" >/dev/null || { echo "CHECKPOINT_SAVE=REFUSED args.gn import missing" >&2; exit 1; }
          grep -Fx 'use_remoteexec=true' "$ARGS_GENERATED" >/dev/null || { echo "CHECKPOINT_SAVE=REFUSED generated use_remoteexec missing" >&2; exit 1; }
          grep -Fx 'use_siso=true' "$ARGS_GENERATED" >/dev/null || { echo "CHECKPOINT_SAVE=REFUSED generated use_siso missing" >&2; exit 1; }
          grep -Fx 'use_reclient=false' "$ARGS_GENERATED" >/dev/null || { echo "CHECKPOINT_SAVE=REFUSED generated use_reclient missing" >&2; exit 1; }
          test -s "$SISO_ENV" && test -s "$SISO_RC" && test -s "$SISO_BACKEND" || { echo "CHECKPOINT_SAVE=REFUSED Siso configuration incomplete" >&2; exit 1; }
          SISO_BRAVE_CONFIG="$SRC/build/config/siso/brave_siso_config.star"
          test -s "$SISO_BRAVE_CONFIG" || { echo "CHECKPOINT_SAVE=REFUSED missing Brave Siso configuration" >&2; exit 1; }
          grep -Fq 'rule["canonicalize_dir"] = True' "$SISO_BRAVE_CONFIG" || { echo "CHECKPOINT_SAVE=REFUSED Siso canonical workdir must remain enabled" >&2; exit 1; }
          grep -Fq '"./args.gn"' "$SISO_BRAVE_CONFIG" || { echo "CHECKPOINT_SAVE=REFUSED Siso remote rules lack explicit ./args.gn workdir anchor" >&2; exit 1; }
          bash "$ROOT/.circleci/scripts/verify-clang-diagnostics-gn.sh"
          echo "CHECKPOINT_CLANG_DIAGNOSTIC_PATH_GATE=PASS"
          grep -Fx "SISO_CREDENTIAL_HELPER=/tmp/sandium-buildbuddy-credential-helper.py" "$SISO_ENV" >/dev/null || { echo "CHECKPOINT_SAVE=REFUSED Siso credential helper not configured" >&2; exit 1; }
          for REQUIRED_SISO_FLAG in \
            '-reapi_keep_exec_stream' \
            '-fs_min_flush_timeout 300s' \
            '-reapi_byte_stream_read_threshold 1024' \
            '-config googlechrome,remote-link' \
            '-re_cache_enable_write=true'; do
            grep -Fq -- "$REQUIRED_SISO_FLAG" "$SISO_RC" || {
              echo "CHECKPOINT_SAVE=REFUSED missing Siso flag: $REQUIRED_SISO_FLAG" >&2
              exit 1
            }
          done
          test -x /tmp/sandium-buildbuddy-credential-helper.py || { echo "CHECKPOINT_SAVE=REFUSED credential helper not executable" >&2; exit 1; }
          CHROMIUM_SHA="$(git -C "$SRC" rev-parse HEAD)"
          BRAVE_TAG="$(git -C "$CORE" describe --tags --exact-match 2>/dev/null || true)"
          test "$CHROMIUM_SHA" = "d331de35ca8ab1358c7a17e4bd41627d55eaef51" || { echo "CHECKPOINT_SAVE=REFUSED Chromium SHA mismatch: $CHROMIUM_SHA" >&2; exit 1; }
          test "$BRAVE_TAG" = "v1.98.62" || { echo "CHECKPOINT_SAVE=REFUSED Brave tag mismatch: $BRAVE_TAG" >&2; exit 1; }
          mkdir -p "$ROOT/brave-work/.sandium"
          APK_VALIDATED=false
          APK_MARKER="$ROOT/brave-work/.sandium/apk-completion-status.txt"
          if python3 "$ROOT/.circleci/scripts/check-apk-completion-marker.py" "$APK_MARKER"; then
            APK_VALIDATED=true
          fi
          {
            echo "CHECKPOINT_VALID=true"
            echo "REFERENCE_MODE=reference"
            echo "APK_VALIDATED=$APK_VALIDATED"
            echo "REFERENCE_READY=$APK_VALIDATED"
            echo "REFERENCE_SOURCE_REVISION=${CIRCLE_SHA1}"
            echo "BRAVE_CORE_TAG=$BRAVE_TAG"
            echo "CHROMIUM_SHA=$CHROMIUM_SHA"
            echo "TARGET=android-arm64"
            echo "BUILD_TYPE=Release"
            echo "STAGE=${SANDIUM_STAGE}"
            echo "ARGS_GENERATED_SHA256=$(sha256sum "$ARGS_GENERATED" | awk '{print $1}')"
            echo "SISO_ENV_SHA256=$(sha256sum "$SISO_ENV" | awk '{print $1}')"
            echo "SISO_RC_SHA256=$(sha256sum "$SISO_RC" | awk '{print $1}')"
            echo "SISO_BACKEND_SHA256=$(sha256sum "$SISO_BACKEND" | awk '{print $1}')"
            OBJECT_COUNT=0
            if [ -d "$OUT/obj" ]; then
              OBJECT_COUNT="$(find "$OUT/obj" -type f -name '*.o' | wc -l | tr -d ' ')"
            fi
            echo "COMPILED_OBJECT_COUNT=$OBJECT_COUNT"
            date -u +"SAVED_AT=%Y-%m-%dT%H:%M:%SZ"
            du -sh "$ROOT/brave-work"
            du -sh "$OUT"
          } > "$ROOT/brave-work/.sandium/checkpoint-manifest.txt"
          echo "CHECKPOINT_SAVE=PASS"
          cat "$ROOT/brave-work/.sandium/checkpoint-manifest.txt"
