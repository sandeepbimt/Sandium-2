version: 2.1
parameters:
  run_build:
    type: boolean
    default: false
  sandium_build_mode:
    type: enum
    enum:
    - full
    default: full
  run_maintenance:
    type: boolean
    default: false
jobs:
  brave-android-staged-build:
    parameters:
      stage_index:
        type: integer
    machine:
      image: ubuntu-2404:current
    resource_class: large
    steps:
    - checkout
    - run:
        name: Guard isolated uBO EXT0 compile-only branch
        command: |
          set -euo pipefail
          test "$CIRCLE_BRANCH" = "experiment/ubo-runtime"
          python3 experiments/ubo-runtime/test_preflight.py
          python3 experiments/ubo-runtime/test_wiring.py
          python3 experiments/ubo-runtime/test_gn.py
          python3 -m venv /tmp/sandium-ext0-preflight
          /tmp/sandium-ext0-preflight/bin/pip install --disable-pip-version-check PyYAML==6.0.2
          /tmp/sandium-ext0-preflight/bin/python experiments/ubo-runtime/test_ci_isolation.py
          /tmp/sandium-ext0-preflight/bin/python .circleci/tests/test_ubo_runtime_lifecycle.py
          echo "EXT0=runtime_infrastructure_only; uBO not loaded; existing blocker retained"
    - when:
        condition:
          equal:
          - 2
          - << parameters.stage_index >>
        steps:
        - restore_cache:
            name: Restore verified APK marker for stage 2
            keys:
            - sandium-ubo-ext0-apk-v1-{{ .Branch }}-{{ .Revision }}-{{ .Environment.CIRCLE_WORKFLOW_ID }}-stage-1
        - run:
            name: Stop stage 2 when a prior stage published a verified APK
            command: "set -euo pipefail\nSTATUS=\"$CIRCLE_WORKING_DIRECTORY/brave-work/.sandium/apk-completion-status.txt\"\
              \nif python3 \"$CIRCLE_WORKING_DIRECTORY/.circleci/scripts/check-apk-completion-marker.py\" \"$STATUS\"; then\n\
              \  echo \"BRAVE_APK=ALREADY_PUBLISHED\"\n  cat \"$STATUS\"\n  circleci-agent step halt\nfi\necho \"BRAVE_APK=NOT_YET_PUBLISHED\"\
              \n"
    - when:
        condition:
          equal:
          - 3
          - << parameters.stage_index >>
        steps:
        - restore_cache:
            name: Restore verified APK marker for stage 3
            keys:
            - sandium-ubo-ext0-apk-v1-{{ .Branch }}-{{ .Revision }}-{{ .Environment.CIRCLE_WORKFLOW_ID }}-stage-2
            - sandium-ubo-ext0-apk-v1-{{ .Branch }}-{{ .Revision }}-{{ .Environment.CIRCLE_WORKFLOW_ID }}-stage-1
        - run:
            name: Stop stage 3 when a prior stage published a verified APK
            command: "set -euo pipefail\nSTATUS=\"$CIRCLE_WORKING_DIRECTORY/brave-work/.sandium/apk-completion-status.txt\"\
              \nif python3 \"$CIRCLE_WORKING_DIRECTORY/.circleci/scripts/check-apk-completion-marker.py\" \"$STATUS\"; then\n\
              \  echo \"BRAVE_APK=ALREADY_PUBLISHED\"\n  cat \"$STATUS\"\n  circleci-agent step halt\nfi\necho \"BRAVE_APK=NOT_YET_PUBLISHED\"\
              \n"
    - when:
        condition:
          equal:
          - 4
          - << parameters.stage_index >>
        steps:
        - restore_cache:
            name: Restore verified APK marker for stage 4
            keys:
            - sandium-ubo-ext0-apk-v1-{{ .Branch }}-{{ .Revision }}-{{ .Environment.CIRCLE_WORKFLOW_ID }}-stage-3
            - sandium-ubo-ext0-apk-v1-{{ .Branch }}-{{ .Revision }}-{{ .Environment.CIRCLE_WORKFLOW_ID }}-stage-2
            - sandium-ubo-ext0-apk-v1-{{ .Branch }}-{{ .Revision }}-{{ .Environment.CIRCLE_WORKFLOW_ID }}-stage-1
        - run:
            name: Stop stage 4 when a prior stage published a verified APK
            command: "set -euo pipefail\nSTATUS=\"$CIRCLE_WORKING_DIRECTORY/brave-work/.sandium/apk-completion-status.txt\"\
              \nif python3 \"$CIRCLE_WORKING_DIRECTORY/.circleci/scripts/check-apk-completion-marker.py\" \"$STATUS\"; then\n\
              \  echo \"BRAVE_APK=ALREADY_PUBLISHED\"\n  cat \"$STATUS\"\n  circleci-agent step halt\nfi\necho \"BRAVE_APK=NOT_YET_PUBLISHED\"\
              \n"
    - when:
        condition:
          equal:
          - 5
          - << parameters.stage_index >>
        steps:
        - restore_cache:
            name: Restore verified APK marker for stage 5
            keys:
            - sandium-ubo-ext0-apk-v1-{{ .Branch }}-{{ .Revision }}-{{ .Environment.CIRCLE_WORKFLOW_ID }}-stage-4
            - sandium-ubo-ext0-apk-v1-{{ .Branch }}-{{ .Revision }}-{{ .Environment.CIRCLE_WORKFLOW_ID }}-stage-3
            - sandium-ubo-ext0-apk-v1-{{ .Branch }}-{{ .Revision }}-{{ .Environment.CIRCLE_WORKFLOW_ID }}-stage-2
            - sandium-ubo-ext0-apk-v1-{{ .Branch }}-{{ .Revision }}-{{ .Environment.CIRCLE_WORKFLOW_ID }}-stage-1
        - run:
            name: Stop stage 5 when a prior stage published a verified APK
            command: "set -euo pipefail\nSTATUS=\"$CIRCLE_WORKING_DIRECTORY/brave-work/.sandium/apk-completion-status.txt\"\
              \nif python3 \"$CIRCLE_WORKING_DIRECTORY/.circleci/scripts/check-apk-completion-marker.py\" \"$STATUS\"; then\n\
              \  echo \"BRAVE_APK=ALREADY_PUBLISHED\"\n  cat \"$STATUS\"\n  circleci-agent step halt\nfi\necho \"BRAVE_APK=NOT_YET_PUBLISHED\"\
              \n"
    - run:
        name: Configure Siso BuildBuddy API-key credential helper
        command: "# Siso requires an explicit credential helper in non-Google CI.\n# Never enable xtrace here: BUILDBUDDY_API_KEY\
          \ is a secret.\nset -eu\nif [ -z \"$(printenv BUILDBUDDY_API_KEY 2>/dev/null || true)\" ]; then\n  echo \"MISSING_REQUIRED_SECRET=BUILDBUDDY_API_KEY\"\
          \ >&2\n  echo \"Set BUILDBUDDY_API_KEY in CircleCI project environment variables.\" >&2\n  exit 1\nfi\nHELPER=/tmp/sandium-buildbuddy-credential-helper.py\n\
          printf '%s\\n' \\\n  '#!/usr/bin/env python3' \\\n  'import json' \\\n  'import os' \\\n  'import sys' \\\n  ''\
          \ \\\n  'if len(sys.argv) < 2 or sys.argv[1] != \"get\":' \\\n  '    raise SystemExit(1)' \\\n  'sys.stdin.read()'\
          \ \\\n  'key = os.environ[\"BUILDBUDDY_API_KEY\"]' \\\n  'print(json.dumps({\"headers\": {\"x-buildbuddy-api-key\"\
          : [key]}}))' \\\n  > \"$HELPER\"\nchmod 700 \"$HELPER\"\necho 'export SISO_CREDENTIAL_HELPER=/tmp/sandium-buildbuddy-credential-helper.py'\
          \ >> \"$BASH_ENV\"\n# Brave v1.98.62 installs depot_tools at vendor/depot_tools relative to src/brave.\n# Keep this\
          \ separate from the Afterbird sibling checkout layout.\necho 'export PATH=\"$CIRCLE_WORKING_DIRECTORY/brave-work/src/brave/vendor/depot_tools:$PATH\"\
          ' >> \"$BASH_ENV\"\necho 'export DEPOT_TOOLS_UPDATE=0' >> \"$BASH_ENV\"\necho 'export SISO_LIMITS=local=8,remote=80'\
          \ >> \"$BASH_ENV\"\necho \"SISO_CREDENTIAL_HELPER=CONFIGURED (secret value not printed)\"\n"
    - run:
        name: Run lightweight Brave continuation self-test
        command: 'set -euo pipefail

          python3 -m py_compile .circleci/scripts/sandium-checkpoint-shards.py .circleci/scripts/test-sandium-checkpoint-shards.py
          .circleci/scripts/checkpoint-stage-receipt.py .circleci/scripts/test-checkpoint-stage-receipt.py .circleci/scripts/check-apk-completion-marker.py
          .circleci/scripts/test-apk-completion-marker.py

          python3 .circleci/scripts/test-sandium-checkpoint-shards.py

          python3 .circleci/scripts/test-checkpoint-stage-receipt.py

          python3 .circleci/scripts/test-apk-completion-marker.py

          python3 -m py_compile .circleci/scripts/apply-sandium-blur-transition.py .circleci/scripts/test-sandium-blur-transition.py

          python3 .circleci/scripts/test-sandium-blur-transition.py

          python3 -m py_compile .circleci/scripts/apply-sandium-blur-transition.py .circleci/scripts/test-sandium-blur-transition.py

          python3 .circleci/scripts/test-sandium-blur-transition.py

          python3 -m py_compile .circleci/scripts/verify-brave-remote-metrics.py

          python3 -m py_compile .circleci/scripts/apply-sandium-page-transition-full.py .circleci/scripts/test-sandium-page-transition-full.py

          python3 .circleci/scripts/test-sandium-page-transition-full.py

          python3 .circleci/scripts/test-brave-remote-metrics.py

          bash -n .circleci/scripts/archive-brave-workspace.sh

          bash -n .circleci/scripts/verify-brave-reference.sh

          bash -n .circleci/scripts/verify-brave-remote-smoke.sh

          bash -n .circleci/scripts/capture-brave-siso-checkpoint.sh

          bash -n .circleci/scripts/prepare-brave-source.sh

          python3 -m py_compile .circleci/scripts/verify-sandium-vanilla-brave.py .circleci/scripts/test-sandium-vanilla-brave.py

          bash -n .circleci/scripts/apply-sandium-branding.sh

          python3 -m py_compile .circleci/scripts/generate-sandium-density-assets.py

          python3 -m py_compile .circleci/scripts/apply-sandium-full-overlays.py .circleci/scripts/test-sandium-feature-policies.py

          python3 .circleci/scripts/test-sandium-feature-policies.py

          python3 -m py_compile .circleci/scripts/apply-sandium-filter-subscriptions.py .circleci/scripts/test-sandium-filter-subscriptions.py

          python3 .circleci/scripts/test-sandium-filter-subscriptions.py

          python3 -m py_compile .circleci/scripts/apply-sandium-filter-bootstrap.py .circleci/scripts/test-sandium-filter-bootstrap.py

          python3 .circleci/scripts/test-sandium-filter-bootstrap.py

          python3 -m py_compile .circleci/scripts/apply-sandium-homepage-adblock-warmup.py .circleci/scripts/test-sandium-homepage-adblock-warmup.py

          python3 .circleci/scripts/test-sandium-homepage-adblock-warmup.py

          python3 -m py_compile .circleci/scripts/apply-sandium-download-concurrency.py .circleci/scripts/test-sandium-download-concurrency.py

          python3 .circleci/scripts/test-sandium-download-concurrency.py

          python3 -m py_compile .circleci/scripts/apply-sandium-welcome-setup.py .circleci/scripts/test-sandium-welcome-setup.py

          python3 .circleci/scripts/test-sandium-welcome-setup.py

          python3 -m py_compile .circleci/scripts/verify-sandium-vanilla-brave.py .circleci/scripts/test-sandium-vanilla-brave.py

          python3 .circleci/scripts/test-sandium-vanilla-brave.py

          python3 -m py_compile .circleci/scripts/apply-sandium-shields-two-state.py .circleci/scripts/test-sandium-shields-two-state.py

          python3 .circleci/scripts/test-sandium-shields-two-state.py

          python3 -m py_compile .circleci/scripts/apply-sandium-adblock-engine-race.py .circleci/scripts/test-sandium-adblock-engine-race.py

          python3 .circleci/scripts/test-sandium-adblock-engine-race.py

          bash -n .circleci/scripts/recover-siso-missing-cas-inputs.sh

          echo "BRAVE_PIPELINE_SELF_TEST=PASS"

          '
    - when:
        condition:
          equal:
          - 1
          - << parameters.stage_index >>
        steps:
        - restore_cache:
            name: Restore verified APK marker from the same source revision
            keys:
            - sandium-ubo-ext0-apk-v1-{{ .Branch }}-{{ .Revision }}-
        - run:
            name: Stop when this revision already has a published APK
            command: "set -euo pipefail\nSTATUS=\"$CIRCLE_WORKING_DIRECTORY/brave-work/.sandium/apk-completion-status.txt\"\
              \nif python3 \"$CIRCLE_WORKING_DIRECTORY/.circleci/scripts/check-apk-completion-marker.py\" \"$STATUS\"; then\n\
              \  echo \"BRAVE_APK=ALREADY_PUBLISHED for revision {{ .Revision }}\"\n  cat \"$STATUS\"\n  circleci-agent step\
              \ halt\nfi\necho \"BRAVE_APK=NOT_YET_PUBLISHED\"\n"
    - when:
        condition:
          and:
          - equal:
            - 1
            - << parameters.stage_index >>
          - or:
            - equal:
              - full
              - << pipeline.parameters.sandium_build_mode >>
            - equal:
              - feature/sandium-disable-13-brave-features
              - << pipeline.git.branch >>
            - equal:
              - feature/sandium-page-transition-full
              - << pipeline.git.branch >>
            - equal:
              - feature/sandium-filter-bootstrap-full
              - << pipeline.git.branch >>
            - equal:
              - feature/sandium-vanilla-welcome
              - << pipeline.git.branch >>
        steps:
        - restore_cache:
            name: Read accepted fixed-reference metadata only
            keys:
            - fixed-sandium-reference-v1-backpreview01-
        - restore_cache:
            name: Read legacy accepted receipt only for initial fixed-base metadata bootstrap
            keys:
            - sandium-experimental-head-v1-fSJgSbKhoW8y5Z2yXRIK+o_g6oruZ_+JUYmKGb3vgt4=-
        - run:
            name: Select exact fixed base without consuming legacy increments
            command: python3 .circleci/original-full/fixed_reference.py select --root "$CIRCLE_WORKING_DIRECTORY" --legacy-script
              .circleci/scripts/sandium-checkpoint-shards.py --legacy-receipt "$CIRCLE_WORKING_DIRECTORY/.checkpoint-head/receipt.json"
        - restore_cache:
            name: Restore only exact selected fixed complete reference
            keys:
            - sandium-bridge-base-v1-{{ checksum ".fixed-reference/cache.key" }}
        - run:
            name: Verify fixed reference manifest identity and all eight shard hashes
            command: python3 .circleci/original-full/fixed_reference.py preverify --root "$CIRCLE_WORKING_DIRECTORY" --legacy-script
              .circleci/scripts/sandium-checkpoint-shards.py
    - when:
        condition:
          and:
          - equal:
            - 1
            - << parameters.stage_index >>
          - equal:
            - fast
            - << pipeline.parameters.sandium_build_mode >>
          - not:
              equal:
              - feature/sandium-disable-13-brave-features
              - << pipeline.git.branch >>
          - not:
              equal:
              - feature/sandium-page-transition-full
              - << pipeline.git.branch >>
          - not:
              equal:
              - feature/sandium-filter-bootstrap-full
              - << pipeline.git.branch >>
        steps:
        - restore_cache:
            name: Restore canonical 26 GiB reference (3c8004b / cache job 949)
            keys:
            - sandium-ubo-ext0-handoff-v1-sandium/fix-archive-completion-gate-d0bc6af6-e2a7-451e-8561-3c90eb48c2e1-stage-1
    - when:
        condition:
          and:
          - equal:
            - 2
            - << parameters.stage_index >>
          - or:
            - equal:
              - full
              - << pipeline.parameters.sandium_build_mode >>
            - equal:
              - feature/sandium-disable-13-brave-features
              - << pipeline.git.branch >>
            - equal:
              - feature/sandium-page-transition-full
              - << pipeline.git.branch >>
            - equal:
              - feature/sandium-filter-bootstrap-full
              - << pipeline.git.branch >>
            - equal:
              - feature/sandium-vanilla-welcome
              - << pipeline.git.branch >>
        steps:
        - restore_cache:
            name: Restore reference Stage 1 handoff
            keys:
            - sandium-ubo-ext0-handoff-v1-{{ .Branch }}-{{ .Environment.CIRCLE_WORKFLOW_ID }}-stage-1
            - sandium-brave-handoff-v1-{{ .Branch }}-{{ .Environment.CIRCLE_WORKFLOW_ID }}-stage-1
    - when:
        condition:
          and:
          - equal:
            - 3
            - << parameters.stage_index >>
          - or:
            - equal:
              - full
              - << pipeline.parameters.sandium_build_mode >>
            - equal:
              - feature/sandium-disable-13-brave-features
              - << pipeline.git.branch >>
            - equal:
              - feature/sandium-page-transition-full
              - << pipeline.git.branch >>
            - equal:
              - feature/sandium-filter-bootstrap-full
              - << pipeline.git.branch >>
            - equal:
              - feature/sandium-vanilla-welcome
              - << pipeline.git.branch >>
        steps:
        - restore_cache:
            name: Restore reference Stage 2 handoff
            keys:
            - sandium-ubo-ext0-handoff-v1-{{ .Branch }}-{{ .Environment.CIRCLE_WORKFLOW_ID }}-stage-2
            - sandium-brave-handoff-v1-{{ .Branch }}-{{ .Environment.CIRCLE_WORKFLOW_ID }}-stage-2
    - when:
        condition:
          and:
          - equal:
            - 4
            - << parameters.stage_index >>
          - or:
            - equal:
              - full
              - << pipeline.parameters.sandium_build_mode >>
            - equal:
              - feature/sandium-disable-13-brave-features
              - << pipeline.git.branch >>
            - equal:
              - feature/sandium-page-transition-full
              - << pipeline.git.branch >>
            - equal:
              - feature/sandium-filter-bootstrap-full
              - << pipeline.git.branch >>
            - equal:
              - feature/sandium-vanilla-welcome
              - << pipeline.git.branch >>
        steps:
        - restore_cache:
            name: Restore reference Stage 3 handoff
            keys:
            - sandium-ubo-ext0-handoff-v1-{{ .Branch }}-{{ .Environment.CIRCLE_WORKFLOW_ID }}-stage-3
            - sandium-brave-handoff-v1-{{ .Branch }}-{{ .Environment.CIRCLE_WORKFLOW_ID }}-stage-3
    - when:
        condition:
          and:
          - equal:
            - 5
            - << parameters.stage_index >>
          - or:
            - equal:
              - full
              - << pipeline.parameters.sandium_build_mode >>
            - equal:
              - feature/sandium-disable-13-brave-features
              - << pipeline.git.branch >>
            - equal:
              - feature/sandium-page-transition-full
              - << pipeline.git.branch >>
            - equal:
              - feature/sandium-filter-bootstrap-full
              - << pipeline.git.branch >>
            - equal:
              - feature/sandium-vanilla-welcome
              - << pipeline.git.branch >>
        steps:
        - restore_cache:
            name: Restore reference Stage 4 handoff
            keys:
            - sandium-ubo-ext0-handoff-v1-{{ .Branch }}-{{ .Environment.CIRCLE_WORKFLOW_ID }}-stage-4
            - sandium-brave-handoff-v1-{{ .Branch }}-{{ .Environment.CIRCLE_WORKFLOW_ID }}-stage-4
    - when:
        condition:
          and:
          - equal:
            - 2
            - << parameters.stage_index >>
          - equal:
            - fast
            - << pipeline.parameters.sandium_build_mode >>
          - not:
              equal:
              - feature/sandium-disable-13-brave-features
              - << pipeline.git.branch >>
          - not:
              equal:
              - feature/sandium-page-transition-full
              - << pipeline.git.branch >>
          - not:
              equal:
              - feature/sandium-filter-bootstrap-full
              - << pipeline.git.branch >>
        steps:
        - restore_cache:
            name: Restore canonical 26 GiB reference for FAST MODE Stage 2
            keys:
            - sandium-ubo-ext0-handoff-v1-sandium/fix-archive-completion-gate-d0bc6af6-e2a7-451e-8561-3c90eb48c2e1-stage-1
    - when:
        condition:
          and:
          - equal:
            - 3
            - << parameters.stage_index >>
          - equal:
            - fast
            - << pipeline.parameters.sandium_build_mode >>
          - not:
              equal:
              - feature/sandium-disable-13-brave-features
              - << pipeline.git.branch >>
          - not:
              equal:
              - feature/sandium-page-transition-full
              - << pipeline.git.branch >>
          - not:
              equal:
              - feature/sandium-filter-bootstrap-full
              - << pipeline.git.branch >>
        steps:
        - restore_cache:
            name: Restore canonical 26 GiB reference for FAST MODE Stage 3
            keys:
            - sandium-ubo-ext0-handoff-v1-sandium/fix-archive-completion-gate-d0bc6af6-e2a7-451e-8561-3c90eb48c2e1-stage-1
    - when:
        condition:
          and:
          - equal:
            - 4
            - << parameters.stage_index >>
          - equal:
            - fast
            - << pipeline.parameters.sandium_build_mode >>
          - not:
              equal:
              - feature/sandium-disable-13-brave-features
              - << pipeline.git.branch >>
          - not:
              equal:
              - feature/sandium-page-transition-full
              - << pipeline.git.branch >>
          - not:
              equal:
              - feature/sandium-filter-bootstrap-full
              - << pipeline.git.branch >>
        steps:
        - restore_cache:
            name: Restore canonical 26 GiB reference for FAST MODE Stage 4
            keys:
            - sandium-ubo-ext0-handoff-v1-sandium/fix-archive-completion-gate-d0bc6af6-e2a7-451e-8561-3c90eb48c2e1-stage-1
    - when:
        condition:
          and:
          - equal:
            - 5
            - << parameters.stage_index >>
          - equal:
            - fast
            - << pipeline.parameters.sandium_build_mode >>
          - not:
              equal:
              - feature/sandium-disable-13-brave-features
              - << pipeline.git.branch >>
          - not:
              equal:
              - feature/sandium-page-transition-full
              - << pipeline.git.branch >>
          - not:
              equal:
              - feature/sandium-filter-bootstrap-full
              - << pipeline.git.branch >>
        steps:
        - restore_cache:
            name: Restore canonical 26 GiB reference for FAST MODE Stage 5
            keys:
            - sandium-ubo-ext0-handoff-v1-sandium/fix-archive-completion-gate-d0bc6af6-e2a7-451e-8561-3c90eb48c2e1-stage-1
    - restore_cache:
        keys:
        - sandium-brave-node-v1-24.16.0
    - restore_cache:
        name: Restore Ubuntu Android build-dependency package cache
        keys:
        - sandium-brave-apt-v1-ubuntu2404-
    - run:
        name: SANDIUM FULL/FAST MODE - Restore checkpoint with up to 8 parallel workers
        no_output_timeout: 30m
        command: 'set -euo pipefail

          export BRAVE_STAGE_INDEX="<< parameters.stage_index >>"

          export SANDIUM_ARCHIVE_WORKERS=8

          bash .circleci/scripts/archive-brave-workspace.sh restore

          '
    - when:
        condition:
          equal:
          - 1
          - << parameters.stage_index >>
        steps:
        - run:
            name: Verify restored fixed-reference source pins and accept bootstrap metadata
            command: python3 .circleci/original-full/fixed_reference.py postrestore --root "$CIRCLE_WORKING_DIRECTORY" --legacy-script
              .circleci/scripts/sandium-checkpoint-shards.py
    - run:
        name: Select Sandium build mode and validate reference
        command: "set -euo pipefail\nif [ \"${CIRCLE_BRANCH:-}\" = \"feature/sandium-disable-13-brave-features\" ] || [ \"\
          ${CIRCLE_BRANCH:-}\" = \"feature/sandium-page-transition-full\" ] || [ \"${CIRCLE_BRANCH:-}\" = \"feature/sandium-filter-bootstrap-full\"\
          \ ] || [ \"${CIRCLE_BRANCH:-}\" = \"feature/sandium-vanilla-welcome\" ]; then\n  MODE=\"full\"\nelse\n  MODE=\"\
          << pipeline.parameters.sandium_build_mode >>\"\nfi\nROOT=\"$CIRCLE_WORKING_DIRECTORY\"\nmkdir -p \"$ROOT/brave-work/.sandium\"\
          \n# This marker distinguishes an archive created by this run from the\n# immutable reference archive restored at\
          \ the start of FAST MODE.\nrm -f \"$ROOT/brave-work/.sandium/workspace-archive-created-this-run\"\nprintf 'SANDIUM_BUILD_MODE=%s\\\
          n' \"$MODE\" > \"$ROOT/brave-work/.sandium/build-mode.txt\"\necho \"SANDIUM_BUILD_MODE=$MODE\"\nif [ \"$MODE\" =\
          \ \"fast\" ]; then\n  echo \"SANDIUM_CI_NAME=SANDIUM-FAST-MODE\"\n  bash \"$ROOT/.circleci/scripts/verify-brave-reference.sh\"\
          \nelif [ \"$MODE\" = \"full\" ]; then\n  echo \"SANDIUM_CI_NAME=SANDIUM-FULL-MODE\"\n  echo \"SANDIUM_FULL_MODE=FORCED;\
          \ stage budget=20 minutes; canonical checkpoint validation required.\"\n  if [ \"<< parameters.stage_index >>\"\
          \ -eq 1 ]; then\n    bash \"$ROOT/.circleci/scripts/verify-brave-reference.sh\"\n  else\n    bash \"$ROOT/.circleci/scripts/verify-brave-reference.sh\"\
