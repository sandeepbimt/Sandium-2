    - restore_cache:
        name: Read back exact completed full archive
        keys:
        - raws-final-base-v1-{{ checksum ".raws-final-archive/base.key" }}
    - run:
        name: Final archive verify-publish
        command: python3 -u tools/ci_final_archive.py verify-publish
        no_output_timeout: 55m
    - save_cache:
        name: Save independent verified final receipt
        key: raws-final-receipt-v1-{{ checksum ".raws-final-archive/receipt.json" }}
        paths:
        - .raws-final-archive
    - save_cache:
        name: Publish exact final receipt for fresh-worker probe
        key: raws-final-verified-v1-<< pipeline.id >>
        paths:
        - .raws-final-archive
    - store_artifacts:
        path: .raws-final-archive
        destination: raws-final-archive-evidence
  raws-final-probe:
    machine:
      image: ubuntu-2404:current
    resource_class: large
    retention:
      caches: 15d
    environment:
      RAWS_STAGE: '1'
      RAWS_PIPELINE_NUMBER: << pipeline.number >>
      RAWS_CHECKPOINT_REVIEWED: 'true'
      RAWS_ALLOW_FRESH_SEED: 'false'
      SISO_LIMITS: local=8,remote=80
      RAWS_FINAL_ARCHIVE: 'true'
      RAWS_FINAL_PACK_ONLY: 'true'
    steps:
    - checkout
    - run:
        name: Start one-off job budget before setup
        command: 'mkdir -p .checkpoint-state

          python3 -c ''import json,time;json.dump({"epoch":time.time()},open(".checkpoint-state/job-start.json","w"))'''
        no_output_timeout: 55m
    - run:
        name: Install CI validation and checkpoint tools
        command: sudo apt-get update -qq && sudo apt-get install -y zstd python3-yaml
        no_output_timeout: 55m
    - run:
        name: Guard isolated RawS checkout
        command: 'test "$CIRCLE_BRANCH" = "raw-sandium/official158"

          /usr/bin/python3 -m unittest discover -s tests -v'
        no_output_timeout: 55m
    - run:
        name: RawS Full gate
        command: python3 -u tools/ci_full.py gate
        no_output_timeout: 55m
    - run:
        name: Ensure verified shard tools
        command: command -v zstd >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y zstd)
        no_output_timeout: 55m
    - restore_cache:
        name: Restore exact same-workflow verified final receipt
        keys:
        - raws-final-verified-v1-<< pipeline.id >>
    - run:
        name: Final archive prepare-probe
        command: python3 -u tools/ci_final_archive.py prepare-probe
        no_output_timeout: 55m
    - restore_cache:
        name: Restore completed full base only
        keys:
        - raws-final-base-v1-{{ checksum ".checkpoint-state/base.key" }}
    - run:
        name: Verify and extract full base on fresh worker
        command: python3 -u tools/ci_full.py restore-base
        no_output_timeout: 55m
    - run:
        name: Certify full base restore without deltas
        command: python3 -u tools/ci_full.py restore-finish
        no_output_timeout: 55m
    - run:
        name: Probe unchanged target on restored completed workspace
        command: python3 -u tools/ci_restore_probe.py
        no_output_timeout: 55m
    - store_artifacts:
        path: artifacts
        destination: raws-fresh-restore-probe
    - store_artifacts:
        path: .checkpoint-state
        destination: raws-fresh-restore-evidence
  raws-test-identity-compile:
    machine:
      image: ubuntu-2404:current
    resource_class: large
    retention:
      caches: 15d
    environment:
      RAWS_STAGE: '1'
      RAWS_PIPELINE_NUMBER: << pipeline.number >>
      RAWS_CHECKPOINT_REVIEWED: 'true'
      RAWS_ALLOW_FRESH_SEED: 'false'
      SISO_LIMITS: local=8,remote=80
    steps:
    - checkout
    - run:
        name: Verify exact checkout, request, and no signing material
        command: 'set -euo pipefail

          test "$CIRCLE_BRANCH" = "raw-sandium/official158"

          test "$(git rev-parse HEAD)" = "$CIRCLE_SHA1"

          test "<< pipeline.parameters.run_raw_full >>" = true || { echo "Request run_raw_full=true for a RawS build"; exit 2; }

          test "<< pipeline.parameters.run_raw_preflight >>" = false || { echo "RawS full cannot combine with run_raw_preflight"; exit 2; }

          test "<< pipeline.parameters.run_raw_bootstrap >>" = false || { echo "RawS full cannot combine with run_raw_bootstrap"; exit 2; }

          test "<< pipeline.parameters.run_raw_maintenance >>" = false || { echo "RawS full cannot combine with run_raw_maintenance"; exit 2; }

          test "<< pipeline.parameters.run_raw_final_archive >>" = false || { echo "RawS full cannot combine with run_raw_final_archive"; exit 2; }

          test "<< pipeline.parameters.run_raw_signing_probe >>" = false || { echo "RawS full cannot combine with run_raw_signing_probe"; exit 2; }

          set +x

          test -z "${RAWS_TEST_KEYSTORE_B64+x}"

          test -z "${RAWS_KEYSTORE_PASSWORD+x}"

          test -z "${RAWS_KEY_PASSWORD+x}"

          '
        no_output_timeout: 55m
    - restore_cache:
        name: 'PPBAS: restore RawS host package downloads'
        keys:
        - raws-signed-apt-v1-ubuntu2404-amd64-{{ checksum "upstream.lock.json" }}-{{ checksum "tools/prepare_apt_cache.sh" }}
    - run:
        name: 'PPBAS: configure RawS host package cache'
        command: bash tools/prepare_apt_cache.sh
        no_output_timeout: 55m
    - run:
        name: 'PPBAS: verify CI tools, install if missing'
        command: "set -euo pipefail\nif ! command -v zstd >/dev/null || ! /usr/bin/python3 -c 'import yaml'; then\n  sudo apt-get update -qq\n  sudo apt-get\
          \ install -y zstd python3-yaml\nfi\ncommand -v zstd >/dev/null\n/usr/bin/python3 -c 'import yaml'\necho RAWS_PPBAS_CI_TOOLS=PASS\n"
        no_output_timeout: 55m
    - run:
        name: Guard isolated RawS checkout
        command: 'test "$CIRCLE_BRANCH" = "raw-sandium/official158"

          /usr/bin/python3 -m unittest discover -s tests -v'
        no_output_timeout: 55m
    - run:
        name: RawS Full gate
        command: python3 -u tools/ci_full.py gate
        no_output_timeout: 55m
    - restore_cache:
        name: 'Restore exact verified RawS #1396 receipt'
        keys:
        - raws-final-receipt-v1-1okrnzzf7a7dVnuYH3RZUQh3v8ABzZh4G4yc4YAiROY=
    - run:
        name: RawS restore-only select
        command: RAWS_CODEC_TRIAL=<< pipeline.parameters.raws_h264_aac >> RAWS_UNSIGNED_TEST_APK=true RAWS_DISTINCT_TEST_IDENTITY=true RAWS_ALLOW_FRESH_SEED=false
          python3 -u tools/ci_restore_only.py select
        no_output_timeout: 55m
    - restore_cache:
        name: 'Restore exact verified RawS #1396 final archive'
        keys:
        - raws-final-base-v1-xLg0fZPI+fw9SpoFza6mLhAhAB2lVxH6jMOzj9OmBBU=
    - run:
        name: RawS Full restore-base
        command: python3 -u tools/ci_full.py restore-base
        no_output_timeout: 55m
    - run:
        name: RawS Full restore-finish
        command: python3 -u tools/ci_full.py restore-finish
        no_output_timeout: 55m
    - run:
        name: 'PPBAS: verify source, install host dependencies and run hooks'
        command: RAWS_CODEC_TRIAL=<< pipeline.parameters.raws_h264_aac >> RAWS_UNSIGNED_TEST_APK=true RAWS_DISTINCT_TEST_IDENTITY=true RAWS_ALLOW_FRESH_SEED=false
          python3 -u tools/ci_restore_only.py prepare-signed
        no_output_timeout: 55m
    - save_cache:
        name: 'PPBAS: save verified-scope RawS host package downloads'
        key: raws-signed-apt-v1-ubuntu2404-amd64-{{ checksum "upstream.lock.json" }}-{{ checksum "tools/prepare_apt_cache.sh" }}
        paths:
        - .raws-apt-cache/archives
    - run:
        name: 'Build slice: GN and verified ARM64 APK'
        command: RAWS_CODEC_TRIAL=<< pipeline.parameters.raws_h264_aac >> RAWS_UNSIGNED_TEST_APK=true RAWS_DISTINCT_TEST_IDENTITY=true RAWS_ALLOW_FRESH_SEED=false
          python3 -u tools/ci_restore_only.py compile-prepared
        no_output_timeout: 55m
    - run:
        name: Verify unsigned APK and stage private signing input
        command: RAWS_CODEC_TRIAL=<< pipeline.parameters.raws_h264_aac >> RAWS_UNSIGNED_TEST_APK=true RAWS_DISTINCT_TEST_IDENTITY=true RAWS_ALLOW_FRESH_SEED=false
          python3 -u tools/ci_restore_only.py completed
        no_output_timeout: 55m
    - persist_to_workspace:
        root: .raws-signing-input
        paths:
        - candidate.apk
        - receipt.json
  raws-test-identity-sign:
    machine:
      image: ubuntu-2404:current
    resource_class: medium
    steps:
    - checkout
    - run:
        name: Verify exact signer source commit
        command: 'set -euo pipefail

          test "$CIRCLE_BRANCH" = "raw-sandium/official158"

          test "$(git rev-parse HEAD)" = "$CIRCLE_SHA1"'
        no_output_timeout: 55m
    - run:
        name: Install hash-pinned official Android Build Tools 36.0.0
        command: "set +x\nset -euo pipefail\numask 077\nexpected=5d9ac77fb6ff43d9da518a337b4fcf8f9097113df531d99ccefe80ef7ce8250b\nsdk=/tmp/raws-signer-sdk\n\
          mkdir -m 700 \"$sdk\"\narchive=$(mktemp /tmp/raws-build-tools.XXXXXX)\ntrap 'rm -f \"$archive\"' EXIT\ncurl --fail --silent --show-error --location\
          \ --proto '=https' --proto-redir '=https' \\\n  --tlsv1.2 --retry 2 --connect-timeout 15 --max-time 180 \\\n  --output \"$archive\" https://dl.google.com/android/repository/build-tools_r36_linux.zip\n\
          test \"$(wc -c < \"$archive\")\" -eq 63737259\nprintf '%s  %s\\n' \"$expected\" \"$archive\" | sha256sum --check --status\nunzip -q \"$archive\"\
          \ -d \"$sdk\"\ntest -x \"$sdk/android-16/apksigner\"\ntest -x \"$sdk/android-16/zipalign\"\ntest -x \"$sdk/android-16/aapt2\"\ngrep -Eq '^[[:space:]]*Pkg.Revision[[:space:]]*=[[:space:]]*36\\\
          .0\\.0[[:space:]]*$' \"$sdk/android-16/source.properties\"\nprintf 'RAWS_SIGNING_SDK_VERIFIED sha256=%s prefix=android-16 revision=36.0.0\\n'\
          \ \"$expected\"\n"
        no_output_timeout: 55m
    - attach_workspace:
        at: .raws-signing-input
    - run:
        name: Verify inputs, sign, and admit the final directory atomically
        command: "set +x\nset -euo pipefail\numask 077\ntest ! -e .raws-signing-verified\ntest ! -L .raws-signing-verified\ntest ! -e artifacts/raws-signed\n\
          test ! -L artifacts/raws-signed\ntest ! -L artifacts\nRAWS_CODEC_TRIAL=<< pipeline.parameters.raws_h264_aac >> RAWS_UNSIGNED_TEST_APK=true python3\
          \ -u tools/ci_sign_raws_test.py --input .raws-signing-input \\\n  --sdk /tmp/raws-signer-sdk/android-16 --output-dir .raws-signing-verified\n\
          mkdir -p artifacts\nmv -T .raws-signing-verified artifacts/raws-signed\n"
        no_output_timeout: 55m
    - store_artifacts:
        path: artifacts/raws-signed
        destination: raws-signed
  raws-test-signing-context-probe:
    machine:
      image: ubuntu-2404:current
    resource_class: medium
    steps:
    - run:
        name: Verify only restricted nonsecret signing canary
        command: 'set +x

          set -euo pipefail

          test "$CIRCLE_BRANCH" = "raw-sandium/official158"

          set +x

          test -z "${RAWS_TEST_KEYSTORE_B64+x}"

          test -z "${RAWS_KEYSTORE_PASSWORD+x}"

          test -z "${RAWS_KEY_PASSWORD+x}"

          test "${RAWS_SIGNING_CONTEXT_CANARY:-}" = "raws-test-signing-probe-v1"'
        no_output_timeout: 55m
    - run:
        name: Verify the official signer tools with no credentials present
        command: "set +x\nset -euo pipefail\numask 077\nexpected=5d9ac77fb6ff43d9da518a337b4fcf8f9097113df531d99ccefe80ef7ce8250b\nsdk=/tmp/raws-signer-sdk\n\
          mkdir -m 700 \"$sdk\"\narchive=$(mktemp /tmp/raws-build-tools.XXXXXX)\ntrap 'rm -f \"$archive\"' EXIT\ncurl --fail --silent --show-error --location\
          \ --proto '=https' --proto-redir '=https' \\\n  --tlsv1.2 --retry 2 --connect-timeout 15 --max-time 180 \\\n  --output \"$archive\" https://dl.google.com/android/repository/build-tools_r36_linux.zip\n\
          test \"$(wc -c < \"$archive\")\" -eq 63737259\nprintf '%s  %s\\n' \"$expected\" \"$archive\" | sha256sum --check --status\nunzip -q \"$archive\"\
          \ -d \"$sdk\"\ntest -x \"$sdk/android-16/apksigner\"\ntest -x \"$sdk/android-16/zipalign\"\ntest -x \"$sdk/android-16/aapt2\"\ngrep -Eq '^[[:space:]]*Pkg.Revision[[:space:]]*=[[:space:]]*36\\\
          .0\\.0[[:space:]]*$' \"$sdk/android-16/source.properties\"\nprintf 'RAWS_SIGNING_SDK_VERIFIED sha256=%s prefix=android-16 revision=36.0.0\\n'\
          \ \"$expected\"\n"
        no_output_timeout: 55m
job-groups:
  raws-full-chain:
    jobs:
    - raws-full-stage-1:
        filters:
          branches:
            only: raw-sandium/official158
    - raws-full-stage-2:
        filters:
          branches:
            only: raw-sandium/official158
        requires:
        - raws-full-stage-1
    - raws-full-stage-3:
        filters:
          branches:
            only: raw-sandium/official158
        requires:
        - raws-full-stage-2
    - raws-full-stage-4:
        filters:
          branches:
            only: raw-sandium/official158
        requires:
        - raws-full-stage-3
    - raws-full-stage-5:
        filters:
          branches:
            only: raw-sandium/official158
        requires:
        - raws-full-stage-4
  raws-final-chain:
    jobs:
    - raws-final-compile:
        filters:
          branches:
            only: raw-sandium/official158
    - raws-final-pack:
        requires:
        - raws-final-compile
        filters:
          branches:
            only: raw-sandium/official158
    - raws-final-probe:
        requires:
        - raws-final-pack
        filters:
          branches:
            only: raw-sandium/official158
  raws-signed-test-chain:
    jobs:
    - raws-test-identity-compile:
        filters: &id002
          branches:
            only: raw-sandium/official158
    - raws-test-identity-sign:
        requires:
        - raws-test-identity-compile
        filters:
          branches:
            only: raw-sandium/official158
        context: RawS-Test-Signing
workflows:
  raw-sandium-feasibility:
    when:
      and:
      - << pipeline.parameters.run_raw_preflight >>
      - not: << pipeline.parameters.run_raw_full >>
      - not: << pipeline.parameters.run_raw_signing_probe >>
      - not: << pipeline.parameters.raws_h264_aac >>
    jobs:
    - raw-preflight:
        filters:
          branches:
            only: raw-sandium/official158
  raw-sandium-bootstrap:
    when:
      and:
      - << pipeline.parameters.run_raw_bootstrap >>
      - not: << pipeline.parameters.run_raw_full >>
      - not: << pipeline.parameters.run_raw_signing_probe >>
      - not: << pipeline.parameters.raws_h264_aac >>
    jobs:
    - raw-bootstrap:
        filters:
          branches:
            only: raw-sandium/official158
  RawS full:
    when:
      and:
      - or:
        - << pipeline.parameters.run_raw_full >>
        - << pipeline.parameters.raws_h264_aac >>
      - equal:
        - raw-sandium/official158
        - << pipeline.git.branch >>
    jobs:
    - raws-signed-test-chain:
        serial-group: << pipeline.project.slug >>/raws-full
  RawS checkpoint maintenance:
    when:
      and:
      - << pipeline.parameters.run_raw_maintenance >>
      - not: << pipeline.parameters.run_raw_full >>
      - not: << pipeline.parameters.run_raw_signing_probe >>
      - not: << pipeline.parameters.raws_h264_aac >>
    jobs:
    - raws-maintenance:
        serial-group: << pipeline.project.slug >>/raws-full
        filters:
          branches:
            only: raw-sandium/official158
  RawS one-off final archive:
    when:
      and:
      - << pipeline.parameters.run_raw_final_archive >>
      - not: << pipeline.parameters.run_raw_full >>
      - not: << pipeline.parameters.run_raw_signing_probe >>
      - not: << pipeline.parameters.raws_h264_aac >>
    jobs:
    - raws-final-chain:
        serial-group: << pipeline.project.slug >>/raws-full
  RawS signing context probe:
    when:
      and:
      - << pipeline.parameters.run_raw_signing_probe >>
      - equal:
        - raw-sandium/official158
        - << pipeline.git.branch >>
      - not: << pipeline.parameters.run_raw_preflight >>
      - not: << pipeline.parameters.run_raw_bootstrap >>
      - not: << pipeline.parameters.run_raw_full >>
      - not: << pipeline.parameters.run_raw_maintenance >>
      - not: << pipeline.parameters.run_raw_final_archive >>
      - not: << pipeline.parameters.raws_h264_aac >>
    jobs:
    - raws-test-signing-context-probe:
        filters: *id002
        context: RawS-Test-Signing
