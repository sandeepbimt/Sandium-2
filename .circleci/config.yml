version: 2.1
parameters:
  run_readback:
    type: boolean
    default: false
jobs:
  verify-1402-archive:
    machine:
      image: ubuntu-2404:current
    resource_class: large
    steps:
      - checkout
      - restore_cache:
          name: Restore exact completed 1402 stage 2 archive
          keys:
            - sandium-official-handoff-v1-fix/1394-official-lint-07214cac-daf8-47f1-a9dd-b48d229e934f-stage-2
      - run:
          name: Verify manifest identity and all eight compressed shards
          command: |
            set -euo pipefail
            command -v zstd
            timeout 900 python3 .circleci/scripts/readback-1402.py preverify --root "$CIRCLE_WORKING_DIRECTORY"
          no_output_timeout: 20m
      - run:
          name: Fresh restore without build or cache mutation
          command: |
            set -euo pipefail
            timeout 1200 python3 .circleci/scripts/sandium-checkpoint-shards.py restore --root "$CIRCLE_WORKING_DIRECTORY" --workers 8
          no_output_timeout: 25m
      - run:
          name: Verify restored official source GN and exact APK
          command: |
            set -euo pipefail
            timeout 300 python3 .circleci/scripts/readback-1402.py postrestore --root "$CIRCLE_WORKING_DIRECTORY"
      - store_artifacts:
          path: readback-evidence
workflows:
  verify-completed-Full-1402:
    when: << pipeline.parameters.run_readback >>
    jobs:
      - verify-1402-archive:
          filters:
            branches:
              only: verify/1402-archive
