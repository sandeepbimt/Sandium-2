version: 2.1
parameters:
  raws_ubo_completed_seed:
    type: string
    default: "5f3587d65a1b7f25d191f9e6cbe7be708f41d1d0"
jobs:
  raws-1538-ubo-apk:
    parameters:
      slice:
        type: integer
    machine:
      image: ubuntu-2404:current
    resource_class: large
    environment:
      RAWS_STAGE: '1'
      RAWS_UBO_SLICE: '<< parameters.slice >>'
      RAWS_UBO_COMPLETED_SEED: '<< pipeline.parameters.raws_ubo_completed_seed >>'
      RAWS_PIPELINE_NUMBER: << pipeline.number >>
      RAWS_CHECKPOINT_REVIEWED: 'true'
      RAWS_ALLOW_FRESH_SEED: 'false'
    steps:
      - checkout
      - run:
          name: Verify experiment context and install archive tools
          command: |
            set -eu
            test "$CIRCLE_BRANCH" = "experiment/raws-1538-ubo-apk"
            test "$(git rev-parse HEAD)" = "$CIRCLE_SHA1"
            test "$RAWS_UBO_COMPLETED_SEED" = "5f3587d65a1b7f25d191f9e6cbe7be708f41d1d0" || { echo "Required #1555 completed seed was not selected"; exit 1; }
            if ! command -v zstd || ! python3 -c 'import yaml'; then
              sudo apt-get update -qq
              sudo apt-get install -y zstd python3-yaml
            fi
      - when:
          condition:
            not:
              equal: [1, << parameters.slice >>]
          steps:
            - attach_workspace:
                at: .ubo-slices
            - run:
                name: Stop cleanly if the APK already exists
                command: python3 -u ci/experiments/raws-1538-ubo-apk/build.py skip-if-done
      - restore_cache:
          name: Restore exact read-only RawS baseline receipt
          keys:
            - raws-final-receipt-v1-1okrnzzf7a7dVnuYH3RZUQh3v8ABzZh4G4yc4YAiROY=
      - run:
          name: Validate the #1396 baseline receipt
          command: python3 -u ci/experiments/raws-1538-ubo-apk/build.py select
      - restore_cache:
          name: Restore exact read-only RawS baseline archive
          keys:
            - raws-final-base-v1-xLg0fZPI+fw9SpoFza6mLhAhAB2lVxH6jMOzj9OmBBU=
      - run:
          name: Extract and verify exact #1396 baseline
          command: |
            python3 -u ci/experiments/raws-1538-ubo-apk/build.py restore
            python3 -u ci/experiments/raws-1538-ubo-apk/build.py finish
            echo "RESTORED_RAWS_BASELINE=#1396"
      - when:
          condition:
            equal: [1, << parameters.slice >>]
          steps:
            - run:
                name: Validate requested completed checkpoint producer
                command: python3 -u ci/experiments/raws-1538-ubo-apk/build.py verify-completed-seed
            - restore_cache:
                name: Restore the named completed experiment checkpoint
                keys:
                  - raws-ubo-completed-v1-<< pipeline.parameters.raws_ubo_completed_seed >>
      - run:
          name: Apply corrected #1538 and build isolated ARM64 APK
          command: python3 -u ci/experiments/raws-1538-ubo-apk/build.py compile
          no_output_timeout: 45m
      - when:
          condition:
            not:
              equal: [4, << parameters.slice >>]
          steps:
            - persist_to_workspace:
                root: .ubo-slices
                paths:
                  - stage-<< parameters.slice >>
      - store_artifacts:
          path: artifacts
          destination: raws-1538-ubo-experiment
      - run:
          name: Archive completed compile after publishing the verified APK
          command: python3 -u ci/experiments/raws-1538-ubo-apk/build.py save-completed
          no_output_timeout: 15m
      - save_cache:
          name: Save completed experiment checkpoint across workflows
          key: raws-ubo-completed-v1-{{ .Revision }}
          paths:
            - .ubo-completed
      - store_artifacts:
          path: .ubo-completed/receipt.json
          destination: raws-1538-ubo-experiment/completed-checkpoint.json
workflows:
  RawS 1538 uBO experiment:
    jobs:
      - raws-1538-ubo-apk:
          name: raws-1538-ubo-apk-1
          slice: 1
          filters:
            branches:
              only: experiment/raws-1538-ubo-apk
      - raws-1538-ubo-apk:
          name: raws-1538-ubo-apk-2
          slice: 2
          filters:
            branches:
              only: experiment/raws-1538-ubo-apk
          requires:
            - raws-1538-ubo-apk-1
      - raws-1538-ubo-apk:
          name: raws-1538-ubo-apk-3
          slice: 3
          filters:
            branches:
              only: experiment/raws-1538-ubo-apk
          requires:
            - raws-1538-ubo-apk-2
      - raws-1538-ubo-apk:
          name: raws-1538-ubo-apk-4
          slice: 4
          filters:
            branches:
              only: experiment/raws-1538-ubo-apk
          requires:
            - raws-1538-ubo-apk-3
