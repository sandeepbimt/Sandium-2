# Full-only: fc220e7f build baseline; incremental saves, optional post-APK and scheduled verified refresh.
version: 2.1
parameters:
  run_build:
    type: boolean
    default: false
  publication_reviewed:
    type: boolean
    default: true
  allow_seed_import:
    type: boolean
    default: false
  checkpoint_namespace:
    type: string
    default: sandium-exp-single-v1-bridge-ui1088
  run_maintenance:
    type: boolean
    default: false
jobs:
  initialize-full-checkpoint:
    machine:
      image: ubuntu-2404:current
    resource_class: large
    retention:
      caches: 15d
    environment:
      SANDIUM_STAGE: '0'
      SANDIUM_PIPELINE_NUMBER: << pipeline.number >>
      SANDIUM_EXPERIMENT_SCOPE: << pipeline.parameters.checkpoint_namespace >>
      SANDIUM_EXPERIMENT_REVIEWED: << pipeline.parameters.publication_reviewed >>
      SANDIUM_ALLOW_SEED_IMPORT: << pipeline.parameters.allow_seed_import >>
      SISO_LIMITS: local=8,remote=80
    steps:
    - checkout
    - run:
        name: Require authorized checkpoint scope
        command: |
          python3 .circleci/scripts/verify-ui-only-scope.py
          python3 -u .circleci/bridge/full_driver.py gate
          python3 tests/test_browser_crash_regressions.py
          python3 tests/test_settings_origin_crash.py
    - run:
        name: Ensure legacy shard extraction tools on each fresh machine
        command: bash .circleci/scripts/ensure-flow-tools.sh --with-test-tools
    - restore_cache:
        name: Restore latest accepted experimental head only
        keys:
        - sandium-experimental-head-v1-{{ checksum ".checkpoint-state/scope-key" }}-
    - run:
        name: Select exact checkpoint and honor verified APK completion
        command: python3 -u .circleci/bridge/full_driver.py seed-select
    - restore_cache:
        name: Read-only import of the original verified 26 GiB base
        keys:
        - sandium-brave-handoff-v2-sandium/fix-archive-completion-gate-d0bc6af6-e2a7-451e-8561-3c90eb48c2e1-stage-1
    - run:
        name: Verify original compressed base; no decompressed conversion
        command: python3 -u .circleci/bridge/full_driver.py seed-capture
        no_output_timeout: 35m
    - save_cache:
        name: Retain identical original compressed base in isolated namespace
        key: sandium-bridge-base-v1-{{ checksum ".checkpoint-state/base.key" }}
        paths:
        - brave-workspace-checkpoint.shards
        - brave-workspace-checkpoint.manifest.json
    - run:
        name: Prepare experimental head after payload save
        command: python3 -u .circleci/bridge/full_driver.py publish
    - save_cache:
        name: Publish complete checkpoint receipt only after payload save
        key: sandium-experimental-head-v1-{{ checksum ".checkpoint-state/scope-key" }}-{{ checksum ".checkpoint-head/receipt.json"
          }}
        paths:
        - .checkpoint-head/receipt.json
  full-stage-1:
    machine:
      image: ubuntu-2404:current
    resource_class: large
    retention:
      caches: 15d
    environment:
      SANDIUM_STAGE: '1'
      SANDIUM_PIPELINE_NUMBER: << pipeline.number >>
      SANDIUM_EXPERIMENT_SCOPE: << pipeline.parameters.checkpoint_namespace >>
      SANDIUM_EXPERIMENT_REVIEWED: << pipeline.parameters.publication_reviewed >>
      SANDIUM_ALLOW_SEED_IMPORT: << pipeline.parameters.allow_seed_import >>
      SISO_LIMITS: local=8,remote=80
    steps:
    - checkout
    - run:
        name: Require authorized checkpoint scope
        command: |
          python3 .circleci/scripts/verify-ui-only-scope.py
          python3 -u .circleci/bridge/full_driver.py gate
    - run:
        name: Ensure legacy shard extraction tools on each fresh machine
        command: bash .circleci/scripts/ensure-flow-tools.sh
    - restore_cache:
        name: Restore latest accepted experimental head only
        keys:
        - sandium-experimental-head-v1-{{ checksum ".checkpoint-state/scope-key" }}-
    - run:
        name: Select exact checkpoint and honor verified APK completion
        command: python3 -u .circleci/bridge/full_driver.py select
    - restore_cache:
        name: Restore exact unchanged legacy base
        keys:
        - sandium-bridge-base-v1-{{ checksum ".checkpoint-state/base.key" }}
    - run:
        name: Clear incoming payload 0
        command: rm -rf .checkpoint-incoming
    - restore_cache:
        name: Restore exact required layer 0
        keys:
        - sandium-bridge-delta-v1-{{ checksum ".checkpoint-state/slot-0.key" }}
    - run:
        name: Verify and ingest required layer 0
        command: python3 -u .circleci/bridge/full_driver.py ingest --slot 0
    - run:
        name: Clear incoming payload 1
        command: rm -rf .checkpoint-incoming
    - restore_cache:
        name: Restore exact required layer 1
        keys:
        - sandium-bridge-delta-v1-{{ checksum ".checkpoint-state/slot-1.key" }}
    - run:
        name: Verify and ingest required layer 1
        command: python3 -u .circleci/bridge/full_driver.py ingest --slot 1
    - run:
        name: Clear incoming payload 2
        command: rm -rf .checkpoint-incoming
    - restore_cache:
        name: Restore exact required layer 2
        keys:
        - sandium-bridge-delta-v1-{{ checksum ".checkpoint-state/slot-2.key" }}
    - run:
        name: Verify and ingest required layer 2
        command: python3 -u .circleci/bridge/full_driver.py ingest --slot 2
    - run:
        name: Clear incoming payload 3
        command: rm -rf .checkpoint-incoming
    - restore_cache:
        name: Restore exact required layer 3
        keys:
        - sandium-bridge-delta-v1-{{ checksum ".checkpoint-state/slot-3.key" }}
    - run:
        name: Verify and ingest required layer 3
        command: python3 -u .circleci/bridge/full_driver.py ingest --slot 3
    - run:
        name: Clear incoming payload 4
        command: rm -rf .checkpoint-incoming
    - restore_cache:
        name: Restore exact required layer 4
        keys:
        - sandium-bridge-delta-v1-{{ checksum ".checkpoint-state/slot-4.key" }}
    - run:
        name: Verify and ingest required layer 4
        command: python3 -u .circleci/bridge/full_driver.py ingest --slot 4
    - run:
        name: Clear incoming payload 5
        command: rm -rf .checkpoint-incoming
    - restore_cache:
        name: Restore exact required layer 5
        keys:
        - sandium-bridge-delta-v1-{{ checksum ".checkpoint-state/slot-5.key" }}
    - run:
        name: Verify and ingest required layer 5
        command: python3 -u .circleci/bridge/full_driver.py ingest --slot 5
    - run:
        name: Clear incoming payload 6
        command: rm -rf .checkpoint-incoming
    - restore_cache:
        name: Restore exact required layer 6
        keys:
        - sandium-bridge-delta-v1-{{ checksum ".checkpoint-state/slot-6.key" }}
    - run:
        name: Verify and ingest required layer 6
        command: python3 -u .circleci/bridge/full_driver.py ingest --slot 6
    - run:
        name: Clear incoming payload 7
        command: rm -rf .checkpoint-incoming
    - restore_cache:
        name: Restore exact required layer 7
        keys:
        - sandium-bridge-delta-v1-{{ checksum ".checkpoint-state/slot-7.key" }}
    - run:
        name: Verify and ingest required layer 7
        command: python3 -u .circleci/bridge/full_driver.py ingest --slot 7
    - run:
        command: rm -rf .checkpoint-incoming
        name: Clear incoming payload 8
    - restore_cache:
        keys:
        - sandium-bridge-delta-v1-{{ checksum ".checkpoint-state/slot-8.key" }}
        name: Restore exact required layer 8
    - run:
