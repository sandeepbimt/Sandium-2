          \ than the budget. Classify those as failed work instead.\nif [ \"$BUILD_RC\" -eq 0 ]; then\n  BUILD_REASON=\"BUILD_COMMAND_SUCCESS\"\
          \n  BUILD_COMMAND_SUCCEEDED=true\n  BUILD_SLICE_INCOMPLETE=false\nelif [ \"$BUILD_RC\" -eq 124 ] && [ \"$BUILD_BUDGET_ATTESTED\"\
          \ = true ]; then\n  BUILD_TIME_SLICE_EXPIRED=true\n  BUILD_REASON=\"TIME_SLICE_COMPLETE\"\nelse\n  BUILD_REASON=\"\
          ACTION_FAILED\"\n  echo \"BRAVE_BUILD_COMMAND=FAIL exit=$BUILD_RC; stopping without archive or stage handoff.\"\n\
          fi\n{\n  echo \"BUILD_EXIT_CODE=$BUILD_RC\"\n  echo \"BUILD_INITIAL_EXIT_CODE=$INITIAL_BUILD_RC\"\n  echo \"BUILD_REASON=$BUILD_REASON\"\
          \n  echo \"BUILD_TIME_SLICE_EXPIRED=$BUILD_TIME_SLICE_EXPIRED\"\n  echo \"BUILD_COMMAND_SUCCEEDED=$BUILD_COMMAND_SUCCEEDED\"\
          \n  echo \"BUILD_SLICE_INCOMPLETE=$BUILD_SLICE_INCOMPLETE\"\n  echo \"BUILD_HANDOFF_ALLOWED=$([ \"$BUILD_COMMAND_SUCCEEDED\"\
          \ = true ] || [ \"$BUILD_TIME_SLICE_EXPIRED\" = true ] && echo true || echo false)\"\n  echo \"STAGE_BUILD_BUDGET_SECONDS=$STAGE_BUILD_BUDGET_SECONDS\"\
          \n  echo \"REMOTE_EXECUTION_AUDIT=$REMOTE_EXECUTION_AUDIT\"\n  echo \"CAS_RECOVERY_ATTEMPTS=$CAS_RECOVERY_COUNT\"\
          \n  echo \"BUILD_WINDOW_FINISHED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)\"\n} > \"$BUILD_STATUS\"\nif [ \"$BUILD_COMMAND_SUCCEEDED\"\
          \ = true ]; then\n  echo \"BRAVE_BUILD_STAGE_STATUS=COMMAND_SUCCESS exit=$BUILD_RC reason=$BUILD_REASON remote_audit=$REMOTE_EXECUTION_AUDIT\"\
          \nelif [ \"$BUILD_TIME_SLICE_EXPIRED\" = true ]; then\n  echo \"BRAVE_BUILD_STAGE_STATUS=INCOMPLETE exit=$BUILD_RC\
          \ reason=$BUILD_REASON \"\n  echo \"build_budget_seconds=$STAGE_BUILD_BUDGET_SECONDS; time_slice_expired=$BUILD_TIME_SLICE_EXPIRED;\
          \ \"\n  echo \"The build did not finish in this slice; the next stage will resume using Ninja/Siso native state.\"\
          \nfi\n\nif [ \"$BUILD_REASON\" = ACTION_FAILED ]; then exit \"$BUILD_RC\"; fi\n"
    - run:
        name: Export APK status and artifacts
        command: bash .circleci/experimental-steps/export-apk.sh
        when: on_success
    - store_artifacts:
        path: brave-apk
        destination: brave-apk
    - run:
        name: Record APK completion marker
        when: on_success
        command: "set -euo pipefail\nROOT=\"$CIRCLE_WORKING_DIRECTORY\"\nmkdir -p \"$ROOT/brave-work/.sandium\"\nSTATUS=\"\
          $ROOT/brave-apk/status.txt\"\nMARKER=\"$ROOT/brave-work/.sandium/apk-completion-status.txt\"\nif [ -s \"$STATUS\"\
          \ ]; then\n  cp \"$STATUS\" \"$MARKER\"\nelse\n  printf 'BUILD_FINISHED=false\\nAPK_ARCHIVE_VALID=false\\nAPK_SIGNATURE_VALID=not_yet_built\\\
          nAPK_PACKAGE_ID_VALID=false\\nAPK_BRANDING_VALID=false\\n' > \"$MARKER\"\nfi\necho \"BRAVE_APK_COMPLETION_MARKER=$(grep\
          \ -qx 'BUILD_FINISHED=true' \"$MARKER\" && echo VERIFIED || echo INCOMPLETE)\"\n"
    - save_cache:
        name: Save small revision-scoped verified APK marker
        key: sandium-ubo-ext0-apk-v1-{{ .Branch }}-{{ .Revision }}-{{ .Environment.CIRCLE_WORKFLOW_ID }}-stage-<< parameters.stage_index
          >>
        paths:
        - brave-work/.sandium/apk-completion-status.txt
        when: on_success
    - run:
        name: Skip large handoff after verified APK publication
        command: "set -euo pipefail\nROOT=\"$CIRCLE_WORKING_DIRECTORY\"\nSTATUS_DIR=\"$ROOT/brave-work/.sandium\"\nAPK_STATUS=\"\
          $STATUS_DIR/apk-completion-status.txt\"\nif python3 \"$ROOT/.circleci/scripts/check-apk-completion-marker.py\" \"\
          $APK_STATUS\" && grep -qx 'APK_REMOVALS_VALID=true' \"$APK_STATUS\"; then\n  echo \"FINAL_STAGE_GATE=PASS APK validated\
          \ and artifacts published; large handoff archive skipped.\"\n  circleci-agent step halt\n  exit 0\nfi\nBUILD_STATUS=\"\
          $STATUS_DIR/build-stage-status.txt\"\nif grep -qx 'BUILD_REASON=TIME_SLICE_COMPLETE' \"$BUILD_STATUS\" && grep -qx\
          \ 'BUILD_TIME_SLICE_EXPIRED=true' \"$BUILD_STATUS\" && grep -qx 'BUILD_HANDOFF_ALLOWED=true' \"$BUILD_STATUS\";\
          \ then\n  echo \"CHECKPOINT_HANDOFF=REQUIRED unfinished attested time-slice; preserving native build state.\"\n\
          \  exit 0\nfi\necho \"FINAL_STAGE_GATE=FAIL APK validation incomplete without an attested time-slice; refusing archive.\"\
          \ >&2\nexit 1\n"
    - when:
        condition:
          or:
          - equal:
            - full
            - << pipeline.parameters.sandium_build_mode >>
          - equal:
            - feature/sandium-disable-13-brave-features
            - << pipeline.git.branch >>
          - equal:
            - feature/sandium-page-transition-full
            - << pipeline.git.branch >>
          - equal:
            - feature/sandium-filter-bootstrap-full
            - << pipeline.git.branch >>
          - equal:
            - feature/sandium-vanilla-welcome
            - << pipeline.git.branch >>
        steps:
        - run:
            name: Validate Brave checkpoint before saving
            command: "set -euo pipefail\nROOT=\"$CIRCLE_WORKING_DIRECTORY\"\nSRC=\"$ROOT/brave-work/src\"\nCORE=\"$SRC/brave\"\
              \nOUT=\"$SRC/out/android_Release_arm64\"\ntest -e \"$SRC/.git\" || { echo \"CHECKPOINT_SAVE=REFUSED missing\
              \ Chromium Git checkout\" >&2; exit 1; }\ntest -e \"$CORE/.git\" || { echo \"CHECKPOINT_SAVE=REFUSED missing\
              \ Brave Git checkout\" >&2; exit 1; }\ntest -s \"$ROOT/brave-work/.gclient\" || { echo \"CHECKPOINT_SAVE=REFUSED\
              \ missing .gclient\" >&2; exit 1; }\nPYTHON_REMOTE_WRAPPER=\"$SRC/buildtools/reclient_cfgs/python/python_remote_wrapper\"\
              \ntest -x \"$PYTHON_REMOTE_WRAPPER\" || { echo \"CHECKPOINT_SAVE=REFUSED Brave Python remote wrapper is not\
              \ executable\" >&2; exit 1; }\ntest -s \"$OUT/build.ninja\" || { echo \"CHECKPOINT_SAVE=REFUSED missing build.ninja\"\
              \ >&2; exit 1; }\ntest -s \"$OUT/args.gn\" || { echo \"CHECKPOINT_SAVE=REFUSED missing args.gn\" >&2; exit 1;\
              \ }\nARGS_GENERATED=\"$OUT/args_generated.gni\"\nSISO_ENV=\"$SRC/build/config/siso/.sisoenv\"\nSISO_RC=\"$SRC/build/config/siso/.sisorc\"\
              \nSISO_BACKEND=\"$SRC/build/config/siso/backend_config/backend.star\"\ntest -s \"$ARGS_GENERATED\" || { echo\
              \ \"CHECKPOINT_SAVE=REFUSED missing args_generated.gni\" >&2; exit 1; }\ngrep -F 'args_generated.gni' \"$OUT/args.gn\"\
              \ >/dev/null || { echo \"CHECKPOINT_SAVE=REFUSED args.gn import missing\" >&2; exit 1; }\ngrep -Fx 'use_remoteexec=true'\
              \ \"$ARGS_GENERATED\" >/dev/null || { echo \"CHECKPOINT_SAVE=REFUSED generated use_remoteexec missing\" >&2;\
              \ exit 1; }\ngrep -Fx 'use_siso=true' \"$ARGS_GENERATED\" >/dev/null || { echo \"CHECKPOINT_SAVE=REFUSED generated\
              \ use_siso missing\" >&2; exit 1; }\ngrep -Fx 'use_reclient=false' \"$ARGS_GENERATED\" >/dev/null || { echo\
              \ \"CHECKPOINT_SAVE=REFUSED generated use_reclient missing\" >&2; exit 1; }\ntest -s \"$SISO_ENV\" && test -s\
              \ \"$SISO_RC\" && test -s \"$SISO_BACKEND\" || { echo \"CHECKPOINT_SAVE=REFUSED Siso configuration incomplete\"\
              \ >&2; exit 1; }\nSISO_BRAVE_CONFIG=\"$SRC/build/config/siso/brave_siso_config.star\"\ntest -s \"$SISO_BRAVE_CONFIG\"\
              \ || { echo \"CHECKPOINT_SAVE=REFUSED missing Brave Siso configuration\" >&2; exit 1; }\ngrep -Fq 'rule[\"canonicalize_dir\"\
              ] = True' \"$SISO_BRAVE_CONFIG\" || { echo \"CHECKPOINT_SAVE=REFUSED Siso canonical workdir must remain enabled\"\
              \ >&2; exit 1; }\ngrep -Fq '\"./args.gn\"' \"$SISO_BRAVE_CONFIG\" || { echo \"CHECKPOINT_SAVE=REFUSED Siso remote\
              \ rules lack explicit ./args.gn workdir anchor\" >&2; exit 1; }\nbash \"$ROOT/.circleci/scripts/verify-clang-diagnostics-gn.sh\"\
              \necho \"CHECKPOINT_CLANG_DIAGNOSTIC_PATH_GATE=PASS\"\ngrep -Fx \"SISO_CREDENTIAL_HELPER=/tmp/sandium-buildbuddy-credential-helper.py\"\
              \ \"$SISO_ENV\" >/dev/null || { echo \"CHECKPOINT_SAVE=REFUSED Siso credential helper not configured\" >&2;\
              \ exit 1; }\nfor REQUIRED_SISO_FLAG in \\\n  '-reapi_keep_exec_stream' \\\n  '-fs_min_flush_timeout 300s' \\\
              \n  '-reapi_byte_stream_read_threshold 1024' \\\n  '-config googlechrome,remote-link' \\\n  '-re_cache_enable_write=true';\
              \ do\n  grep -Fq -- \"$REQUIRED_SISO_FLAG\" \"$SISO_RC\" || {\n    echo \"CHECKPOINT_SAVE=REFUSED missing Siso\
              \ flag: $REQUIRED_SISO_FLAG\" >&2\n    exit 1\n  }\ndone\ntest -x /tmp/sandium-buildbuddy-credential-helper.py\
              \ || { echo \"CHECKPOINT_SAVE=REFUSED credential helper not executable\" >&2; exit 1; }\nCHROMIUM_SHA=\"$(git\
              \ -C \"$SRC\" rev-parse HEAD)\"\nBRAVE_TAG=\"$(git -C \"$CORE\" describe --tags --exact-match 2>/dev/null ||\
              \ true)\"\ntest \"$CHROMIUM_SHA\" = \"d331de35ca8ab1358c7a17e4bd41627d55eaef51\" || { echo \"CHECKPOINT_SAVE=REFUSED\
              \ Chromium SHA mismatch: $CHROMIUM_SHA\" >&2; exit 1; }\ntest \"$BRAVE_TAG\" = \"v1.98.62\" || { echo \"CHECKPOINT_SAVE=REFUSED\
              \ Brave tag mismatch: $BRAVE_TAG\" >&2; exit 1; }\nmkdir -p \"$ROOT/brave-work/.sandium\"\nAPK_VALIDATED=false\n\
              APK_MARKER=\"$ROOT/brave-work/.sandium/apk-completion-status.txt\"\nif python3 \"$ROOT/.circleci/scripts/check-apk-completion-marker.py\"\
              \ \"$APK_MARKER\"; then\n  APK_VALIDATED=true\nfi\n{\n  echo \"CHECKPOINT_VALID=true\"\n  echo \"REFERENCE_MODE=reference\"\
              \n  echo \"APK_VALIDATED=$APK_VALIDATED\"\n  echo \"REFERENCE_READY=$APK_VALIDATED\"\n  echo \"REFERENCE_SOURCE_REVISION=$CIRCLE_SHA1\"\
              \n  echo \"BRAVE_CORE_TAG=$BRAVE_TAG\"\n  echo \"CHROMIUM_SHA=$CHROMIUM_SHA\"\n  echo \"TARGET=android-arm64\"\
              \n  echo \"BUILD_TYPE=Release\"\n  echo \"STAGE=<< parameters.stage_index >>\"\n  echo \"WORKFLOW_ID=$CIRCLE_WORKFLOW_ID\"\
              \n  echo \"ARGS_GENERATED_SHA256=$(sha256sum \"$ARGS_GENERATED\" | awk '{print $1}')\"\n  echo \"SISO_ENV_SHA256=$(sha256sum\
              \ \"$SISO_ENV\" | awk '{print $1}')\"\n  echo \"SISO_RC_SHA256=$(sha256sum \"$SISO_RC\" | awk '{print $1}')\"\
              \n  echo \"SISO_BACKEND_SHA256=$(sha256sum \"$SISO_BACKEND\" | awk '{print $1}')\"\n  OBJECT_COUNT=0\n  if [\
              \ -d \"$OUT/obj\" ]; then\n    OBJECT_COUNT=\"$(find \"$OUT/obj\" -type f -name '*.o' | wc -l | tr -d ' ')\"\
              \n  fi\n  echo \"COMPILED_OBJECT_COUNT=$OBJECT_COUNT\"\n  date -u +\"SAVED_AT=%Y-%m-%dT%H:%M:%SZ\"\n  du -sh\
              \ \"$ROOT/brave-work\"\n  du -sh \"$OUT\"\n} > \"$ROOT/brave-work/.sandium/checkpoint-manifest.txt\"\necho \"\
              CHECKPOINT_SAVE=PASS\"\ncat \"$ROOT/brave-work/.sandium/checkpoint-manifest.txt\"\n"
        - run:
            name: Capture final Siso checkpoint state before cache save
            command: 'set -euo pipefail

              export BRAVE_STAGE_INDEX="<< parameters.stage_index >>"

              bash .circleci/scripts/capture-brave-siso-checkpoint.sh checkpoint-ready

              '
        - run:
            name: SANDIUM-FULL-MODE - Create 8 parallel checkpoint shards
            no_output_timeout: 45m
            command: 'set -euo pipefail

              export BRAVE_STAGE_INDEX="<< parameters.stage_index >>"

              export SANDIUM_ARCHIVE_WORKERS=8

              bash .circleci/scripts/archive-brave-workspace.sh archive

              '
        - save_cache:
            name: Save FULL MODE parallel stage handoff shards
            key: sandium-ubo-ext0-handoff-v1-{{ .Branch }}-{{ .Environment.CIRCLE_WORKFLOW_ID }}-stage-<< parameters.stage_index
              >>
            paths:
            - brave-workspace-checkpoint.shards
            - brave-workspace-checkpoint.manifest.json
    - run:
        name: Final five-stage completion gate
        command: "set -euo pipefail\nROOT=\"$CIRCLE_WORKING_DIRECTORY\"\nSTAGE=\"<< parameters.stage_index >>\"\nAPK_STATUS=\"\
          $ROOT/brave-work/.sandium/apk-completion-status.txt\"\nif [ \"${CIRCLE_BRANCH:-}\" = \"feature/sandium-disable-13-brave-features\"\
          \ ] || [ \"${CIRCLE_BRANCH:-}\" = \"feature/sandium-page-transition-full\" ] || [ \"${CIRCLE_BRANCH:-}\" = \"feature/sandium-filter-bootstrap-full\"\
          \ ] || [ \"${CIRCLE_BRANCH:-}\" = \"feature/sandium-vanilla-welcome\" ]; then\n  MODE=\"full\"\nelse\n  MODE=\"\
          << pipeline.parameters.sandium_build_mode >>\"\nfi\nif [ \"$MODE\" = \"full\" ]; then\n  python3 \"$ROOT/.circleci/scripts/checkpoint-stage-receipt.py\"\
          \ verify \\\n    --root \"$ROOT\" \\\n    --stage \"$STAGE\" \\\n    --workflow-id \"$CIRCLE_WORKFLOW_ID\"\nelif\
          \ [ \"$MODE\" = \"fast\" ]; then\n  test ! -e \"$ROOT/brave-work/.sandium/workspace-archive-created-this-run\" ||\
          \ { echo \"FINAL_STAGE_GATE=FAIL FAST MODE unexpectedly created a workspace archive\" >&2; exit 1; }\nelse\n  echo\
          \ \"FINAL_STAGE_GATE=FAIL unknown mode=$MODE\" >&2\n  exit 1\nfi\nif python3 \"$ROOT/.circleci/scripts/check-apk-completion-marker.py\"\
          \ \"$APK_STATUS\"; then\n  if [ \"$MODE\" = \"full\" ]; then\n    grep -qx \"REFERENCE_READY=true\" \"$ROOT/brave-work/.sandium/checkpoint-manifest.txt\"\
          \ || { echo \"FINAL_STAGE_GATE=FAIL APK passed but reference manifest is not ready\" >&2; exit 1; }\n    echo \"\
          FINAL_STAGE_GATE=PASS FULL MODE APK validated; handoff archive saved; reference promotion follows.\"\n  else\n \
          \   echo \"FINAL_STAGE_GATE=PASS FAST MODE APK validated; full archive correctly skipped.\"\n  fi\n  exit 0\nfi\n\
          if [ \"$STAGE\" -lt 5 ]; then\n  if [ \"$MODE\" = \"full\" ]; then\n    echo \"FINAL_STAGE_GATE=PASS FULL MODE handoff\
          \ saved; next stage resumes from the native Ninja/Siso build state.\"\n  else\n    echo \"FINAL_STAGE_GATE=PASS\
          \ FAST MODE; immutable reference restored and BuildBuddy remote action cache remains available.\"\n  fi\n  exit\
          \ 0\nfi\necho \"FINAL_STAGE_GATE=FAIL five stages exhausted without a verified Brave APK.\" >&2\nexit 1\n"
    environment:
      SANDIUM_STAGE: << parameters.stage_index >>
      SISO_LIMITS: local=8,remote=80
    retention:
      caches: 15d
workflows:
  sandium-full-mode:
    when:
      and:
      - << pipeline.parameters.run_build >>
      - not: << pipeline.parameters.run_maintenance >>
    jobs:
    - brave-android-staged-build:
        name: SANDIUM-FULL-MODE-stage-1
        stage_index: 1
        filters:
          branches:
            only: experiment/ubo-runtime
    - brave-android-staged-build:
        name: SANDIUM-FULL-MODE-stage-2
        stage_index: 2
        requires:
        - SANDIUM-FULL-MODE-stage-1
        filters:
          branches:
            only: experiment/ubo-runtime
    - brave-android-staged-build:
        name: SANDIUM-FULL-MODE-stage-3
        stage_index: 3
        requires:
        - SANDIUM-FULL-MODE-stage-2
        filters:
          branches:
            only: experiment/ubo-runtime
    - brave-android-staged-build:
        name: SANDIUM-FULL-MODE-stage-4
        stage_index: 4
        requires:
        - SANDIUM-FULL-MODE-stage-3
        filters:
          branches:
            only: experiment/ubo-runtime
    - brave-android-staged-build:
        name: SANDIUM-FULL-MODE-stage-5
        stage_index: 5
        requires:
        - SANDIUM-FULL-MODE-stage-4
        filters:
          branches:
            only: experiment/ubo-runtime
