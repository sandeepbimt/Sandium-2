version: 2.1
parameters:
  run_raw_preflight:
    type: boolean
    default: false
  run_raw_bootstrap:
    type: boolean
    default: false
  run_raw_source:
    type: boolean
    default: false
  run_raw_full:
    type: boolean
    default: false
jobs:
  raw-first:
    machine:
      image: ubuntu-2404:current
    resource_class: large
    steps:
      - checkout
      - run: date +%s > .raw-job-start
      - restore_cache:
          keys:
            - raws-source-v2-{{ checksum "ci/cache-identity.txt" }}
      - restore_cache:
          keys:
            - raws-output-v2-{{ checksum "ci/cache-identity.txt" }}-
      - run:
          name: RawS full - guard first APK worker
          command: |
            test "$CIRCLE_BRANCH" = "raw-sandium/bootstrap"
            python3 -m unittest discover -s tests -v
            python3 -u tools/ci_bootstrap.py
      - run:
          name: Sync source without an intermediate archive
          command: |
            if test -f handoff/source/receipt.json; then
              command -v zstd || (sudo apt-get update -qq && sudo apt-get install -y zstd)
              python3 tools/ci_handoff.py restore
            fi
            python3 -u tools/ci_source.py
          no_output_timeout: 27m
      - run:
          name: Prepare and compile first 25-minute slice on same worker
          command: python3 -u tools/ci_compile.py --stage 1
          no_output_timeout: 52m
      - store_artifacts:
          path: artifacts
          destination: raw-build-results
      - save_cache:
          key: raw-done-v1-<< pipeline.id >>-1
          paths: [handoff/stage1/state.json]
      - run:
          name: Skip checkpoints once APK exists
          command: |
            python3 - <<'CHECK'
            import json,subprocess
            if json.load(open('handoff/stage1/state.json'))['status']=='done':
                subprocess.run(['circleci-agent','step','halt'],check=True)
            CHECK
      - run:
          name: Fast independent source checkpoint
          command: |
            command -v zstd || (sudo apt-get update -qq && sudo apt-get install -y zstd)
            python3 tools/ci_handoff.py pack
          no_output_timeout: 11m
      - run: python3 tools/ci_handoff.py cache-output
      - save_cache:
          key: raws-source-v2-{{ checksum "ci/cache-identity.txt" }}
          paths: [handoff/source]
      - save_cache:
          key: raws-output-v2-{{ checksum "ci/cache-identity.txt" }}-{{ .BuildNum }}
          paths: [resume]
      - persist_to_workspace:
          root: .
          paths: [handoff/source, handoff/stage1]
  raw-compile:
    parameters:
      stage:
        type: integer
    machine:
      image: ubuntu-2404:current
    resource_class: large
    steps:
      - checkout
      - run: date +%s > .raw-job-start
      - restore_cache:
          keys:
            - raw-done-v1-<< pipeline.id >>-2
            - raw-done-v1-<< pipeline.id >>-1
      - run:
          name: Skip before large restore when earlier APK is done
          command: |
            python3 - <<'CHECK'
            import json,pathlib,subprocess
            for p in pathlib.Path('handoff').glob('stage*/state.json'):
                if json.load(open(p)).get('status') in ('done','skipped_done'):
                    subprocess.run(['circleci-agent','step','halt'],check=True)
                    break
            CHECK
      - attach_workspace:
          at: .
      - run:
          name: Restore verified independent source checkpoint
          command: |
            command -v zstd || (sudo apt-get update -qq && sudo apt-get install -y zstd)
            python3 tools/ci_handoff.py restore
          no_output_timeout: 11m
      - run:
          name: Guard and compile isolated 25-minute slice
          command: |
            test "$CIRCLE_BRANCH" = "raw-sandium/bootstrap"
            python3 -m unittest discover -s tests -v
            timeout --kill-after=30s 56m python3 -u tools/ci_compile.py --stage << parameters.stage >>
          no_output_timeout: 57m
      - store_artifacts:
          path: artifacts
          destination: raw-build-results
      - save_cache:
          key: raw-done-v1-<< pipeline.id >>-<< parameters.stage >>
          paths:
            - handoff/stage<< parameters.stage >>/state.json
      - run:
          name: Save resumable output reference
          command: python3 tools/ci_handoff.py cache-output
      - save_cache:
          key: raws-output-v2-{{ checksum "ci/cache-identity.txt" }}-{{ .BuildNum }}
          paths: [resume]
      - persist_to_workspace:
          root: .
          paths:
            - handoff/stage<< parameters.stage >>
      - run:
          name: Final-slice completion check
          command: |
            python3 - <<'CHECK'
            import json
            stage = << parameters.stage >>
            state=json.load(open(f'handoff/stage{stage}/state.json'))
            if stage==3 and state['status']=='slice_expired':
                raise SystemExit('Three slices exhausted; checkpoint retained, no APK claimed')
            CHECK
  raw-source:
    machine:
      image: ubuntu-2404:current
    resource_class: large
    steps:
      - checkout
      - run:
          name: Guard clean source bootstrap
          command: |
            test "$CIRCLE_BRANCH" = "raw-sandium/bootstrap"
            python3 -m unittest discover -s tests -v
            python3 -u tools/ci_bootstrap.py
          no_output_timeout: 19m
      - run:
          name: Fresh pinned Chromium Android source and dependencies
          command: python3 -u tools/ci_source.py
          no_output_timeout: 27m
      - store_artifacts:
          path: artifacts
          destination: raw-source-diagnostics
      - persist_to_workspace:
          root: .
          paths:
            - work/source
  raw-bootstrap:
    machine:
      image: ubuntu-2404:current
    resource_class: large
    steps:
      - checkout
      - run:
          name: Verify isolated branch and tests
          command: |
            test "$CIRCLE_BRANCH" = "raw-sandium/bootstrap"
            python3 -m unittest discover -s tests -v
      - run:
          name: Bounded canonical Git provenance and bootstrap
          command: timeout 18m python3 -u tools/ci_bootstrap.py
          no_output_timeout: 19m
      - store_artifacts:
          path: artifacts
          destination: raw-sandium-bootstrap
  raw-preflight:
    machine:
      image: ubuntu-2404:current
    resource_class: large
    steps:
      - checkout
      - run:
          name: Guard isolated Raw Sandium branch
          command: test "$CIRCLE_BRANCH" = "raw-sandium/bootstrap"
      - run:
          name: Validate scaffold
          command: |
            python3 -m unittest discover -s tests -v
            python3 -m py_compile tools/raw.py tools/ci_preflight.py
      - run:
          name: Check clean Chromium host feasibility only
          command: timeout 120s python3 tools/ci_preflight.py
          no_output_timeout: 3m
      - store_artifacts:
          path: artifacts
          destination: raw-sandium-preflight
workflows:
  raw-sandium-feasibility:
    when: << pipeline.parameters.run_raw_preflight >>
    jobs:
      - raw-preflight:
          filters:
            branches:
              only: raw-sandium/bootstrap

  raw-sandium-bootstrap:
    when: << pipeline.parameters.run_raw_bootstrap >>
    jobs:
      - raw-bootstrap:
          filters:
            branches:
              only: raw-sandium/bootstrap

  raw-sandium-source:
    when: << pipeline.parameters.run_raw_source >>
    jobs:
      - raw-source:
          filters:
            branches:
              only: raw-sandium/bootstrap

  "RawS full":
    when: << pipeline.parameters.run_raw_full >>
    jobs:
      - raw-first:
          name: RawS full - first ARM64 slice
          filters:
            branches:
              only: raw-sandium/bootstrap
      - raw-compile:
          name: RawS full - ARM64 slice 2
          stage: 2
          requires: [RawS full - first ARM64 slice]
      - raw-compile:
          name: RawS full - ARM64 slice 3
          stage: 3
          requires: [RawS full - ARM64 slice 2]
