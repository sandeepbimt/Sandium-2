version: 2.1
parameters:
  preserve_raws1396:
    type: boolean
    default: false
jobs:
  preserve-1396-copy:
    machine:
      image: ubuntu-2404:current
    resource_class: large
    steps:
    - checkout
    - run:
        name: Setup
        command: python3 -u tools/ci_preserve_1396.py setup
    - restore_cache:
        name: Restore original receipt
        keys:
        - raws-final-receipt-v1-1okrnzzf7a7dVnuYH3RZUQh3v8ABzZh4G4yc4YAiROY=
    - run:
        name: Original Receipt
        command: python3 -u tools/ci_preserve_1396.py original-receipt
    - restore_cache:
        name: Restore original archive
        keys:
        - raws-final-base-v1-xLg0fZPI+fw9SpoFza6mLhAhAB2lVxH6jMOzj9OmBBU=
    - run:
        name: Copy
        command: python3 -u tools/ci_preserve_1396.py copy
    - save_cache:
        name: Save byte-identical archive
        key: raws-final-preserve1396-base-v2-{{ checksum ".preserve-1396-transport.key"
          }}
        paths:
        - raw-workspace-checkpoint.manifest.json
        - raw-workspace-checkpoint.shards
    - save_cache:
        name: Save unchanged original receipt with copy provenance
        key: raws-final-preserve1396-receipt-v2-{{ checksum ".preserve-1396-transport.key"
          }}
        paths:
        - .raws-preserved-1396
  preserve-1396-readback:
    machine:
      image: ubuntu-2404:current
    resource_class: large
    steps:
    - checkout
    - run:
        name: Setup
        command: python3 -u tools/ci_preserve_1396.py setup
    - run:
        name: Install only the archive reader if needed
        command: command -v zstd || (sudo apt-get update -qq && sudo apt-get install
          -y zstd)
    - restore_cache:
        name: Fresh worker restore of new receipt only
        keys:
        - raws-final-preserve1396-receipt-v2-{{ checksum ".preserve-1396-transport.key"
          }}
    - restore_cache:
        name: Fresh worker restore of new archive only
        keys:
        - raws-final-preserve1396-base-v2-{{ checksum ".preserve-1396-transport.key"
          }}
    - run:
        name: Readback
        command: python3 -u tools/ci_preserve_1396.py readback
    - store_artifacts:
        path: preservation-proof.json
        destination: raws-1396-preservation/proof.json
workflows:
  Preserve exact RawS 1396:
    when: << pipeline.parameters.preserve_raws1396 >>
    jobs:
    - preserve-1396-copy:
        filters:
          branches:
            only: maintenance/raws-1396-preserve
    - preserve-1396-readback:
        filters:
          branches:
            only: maintenance/raws-1396-preserve
        requires:
        - preserve-1396-copy
