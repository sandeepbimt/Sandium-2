            - restore_cache:
                name: Restore Stage 4 Brave compilation checkpoint
                keys:
                  - sandium-brave-checkpoint-v1-{{ .Branch }}-{{ .Environment.CIRCLE_WORKFLOW_ID }}-stage-4


      - restore_cache:
          name: Restore pinned Node runtime
          keys:
            - sandium-brave-node-v1-24.16.0

      - run:
          name: Install pinned Node.js 24.16.0 and pnpm 11.11.0
          command: |
            set -euo pipefail
            ROOT="$CIRCLE_WORKING_DIRECTORY"
            NODE_DIR="$ROOT/node-runtime"
            if [ ! -x "$NODE_DIR/bin/node" ]; then
              mkdir -p "$NODE_DIR"
              curl -fsSL --retry 3 https://nodejs.org/dist/v24.16.0/node-v24.16.0-linux-x64.tar.xz -o "$ROOT/node-v24.16.0.tar.xz"
              tar -xJf "$ROOT/node-v24.16.0.tar.xz" --strip-components=1 -C "$NODE_DIR"
              rm -f "$ROOT/node-v24.16.0.tar.xz"
            fi
            export PATH="$NODE_DIR/bin:$PATH"
            node --version
            npm --version
            npm install --global pnpm@11.11.0
            pnpm --version
            test "$(node --version)" = "v24.16.0"
            test "$(pnpm --version)" = "11.11.0"
            echo "export PATH=\"$NODE_DIR/bin:\$PATH\"" >> "$BASH_ENV"

      - save_cache:
          name: Save pinned Node runtime for later stages and runs
          key: sandium-brave-node-v1-24.16.0
          paths:
            - node-runtime

      - restore_cache:
          name: Restore pnpm package store across stages and runs
          keys:
            - sandium-brave-pnpm-store-v1-11.11.0

      - run:
          name: Checkout pinned Brave Core and initialize matching Chromium source
          no_output_timeout: 45m
          command: |
            set -euo pipefail
            ROOT="$CIRCLE_WORKING_DIRECTORY"
            WORKDIR="$ROOT/brave-work"
            SRC_DIR="$WORKDIR/src"
            CORE_DIR="$SRC_DIR/brave"
            BRAVE_CORE_TAG="v1.98.62"
            REAPI_ADDRESS="$(printenv AFTERBIRD_REAPI_ADDRESS 2>/dev/null || true)"
            [ -n "$REAPI_ADDRESS" ] || REAPI_ADDRESS="remote.buildbuddy.io:443"

            rm -rf "$WORKDIR"
            mkdir -p "$CORE_DIR" "$HOME/.cache/pnpm-store"
            export PATH="$ROOT/node-runtime/bin:$PATH"
            pnpm config set store-dir "$HOME/.cache/pnpm-store"

            git clone --depth 1 --branch "$BRAVE_CORE_TAG" https://github.com/brave/brave-core.git "$CORE_DIR"
            test "$(git -C "$CORE_DIR" describe --tags --exact-match)" = "$BRAVE_CORE_TAG"

            # Use Brave's normal .env configuration. No credentials are written here.
            cat > "$CORE_DIR/.env" <<EOF
            rbe_service=$REAPI_ADDRESS
            use_remoteexec=true
            gn_args_use_siso=true
            gn_args_use_reclient=false
            siso_limits_local=8
            siso_limits_remote=80
            EOF

            CHROMIUM_TAG="$(cd "$CORE_DIR" && node -e 'console.log(JSON.parse(require("fs").readFileSync("package.json")).config.projects.chrome.tag)')"
            test "$CHROMIUM_TAG" = "156.0.8078.74"
            echo "BRAVE_CORE_TAG=$BRAVE_CORE_TAG"
            echo "BRAVE_CORE_SHA=$(git -C "$CORE_DIR" rev-parse HEAD)"
            echo "CHROMIUM_TAG=$CHROMIUM_TAG"
            echo "REAPI_ADDRESS=$REAPI_ADDRESS"

            cd "$CORE_DIR"
            pnpm run init --target_os=android --target_arch=arm64 --no-history

            cd "$WORKDIR"
            ./src/build/install-build-deps.sh --android

            # Carry forward the proven REAPI diagnostic-path fix with a strict source guard.
            FILE="$SRC_DIR/build/config/compiler/compiler.gni"
            test -s "$FILE"
            OLD_COUNT="$(grep -Ec '^[[:space:]]*clang_diagnostic_dir = rebase_path\("//out/clang-crashreports", root_build_dir\)[[:space:]]*  c4-afterbird-staged-checkpoint-build:
    jobs:
