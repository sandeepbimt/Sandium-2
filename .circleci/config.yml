version: 2.1
parameters:
  run_experiment:
    type: boolean
    default: false
  publication_reviewed:
    type: boolean
    default: false
  allow_seed_import:
    type: boolean
    default: false
  experiment_namespace:
    type: string
    default: sandium-exp-single-v1-bridge-crash01
jobs:
  import-experimental-seed:
    machine:
      image: ubuntu-2404:current
    resource_class: large
    retention:
      caches: 15d
    environment:
      SANDIUM_STAGE: '0'
      SANDIUM_PIPELINE_NUMBER: << pipeline.number >>
      SANDIUM_EXPERIMENT_SCOPE: << pipeline.parameters.experiment_namespace >>
      SANDIUM_EXPERIMENT_REVIEWED: << pipeline.parameters.publication_reviewed >>
      SANDIUM_ALLOW_SEED_IMPORT: << pipeline.parameters.allow_seed_import >>
      SISO_LIMITS: local=8,remote=80
    steps:
    - checkout
    - run:
        name: Require explicit experimental review
        command: python3 -u .circleci/bridge/driver.py gate
    - run:
        name: Ensure legacy shard extraction tools on each fresh machine
        command: bash .circleci/scripts/ensure-flow-tools.sh --with-test-tools
    - run:
        name: Test bridge metadata, rollup and native-boundary lifecycle before cache changes
        command: '/usr/bin/python3 .circleci/tests/test_status_underlap_patch.py

          /usr/bin/python3 .circleci/scripts/test-sandium-native-theme.py

          /usr/bin/python3 .circleci/scripts/test-sandium-welcome-setup.py

          /usr/bin/python3 .circleci/scripts/test-sandium-adblock-resources.py

          /usr/bin/python3 .circleci/scripts/test-sandium-visible-branding.py

          /usr/bin/python3 .circleci/scripts/test-sandium-filter-subscriptions.py

          /usr/bin/python3 .circleci/scripts/test-sandium-filter-bootstrap.py

          /usr/bin/python3 tests/test_balanced_tracer.py

          /usr/bin/python3 tests/test_browser_crash_regressions.py

          /usr/bin/python3 tests/test_settings_origin_crash.py

          /usr/bin/python3 tests/test_bridge_quiescence.py

          /usr/bin/python3 tests/test_flow_wiring.py

          /usr/bin/python3 tests/test_flow_tools.py

          /usr/bin/python3 tests/test_legacy_bridge.py

          /usr/bin/python3 tests/test_bridge_rollup.py

          /usr/bin/python3 tests/test_bridge_chain.py

          /usr/bin/python3 tests/test_job_budget.py

          /usr/bin/python3 tests/test_bridge_pipeline.py'
    - restore_cache:
        name: Restore latest accepted experimental head only
        keys:
        - sandium-experimental-head-v1-{{ checksum ".checkpoint-state/scope-key" }}-
    - run:
        name: Select exact checkpoint and honor verified APK completion
        command: python3 -u .circleci/bridge/driver.py seed-select
    - restore_cache:
        name: Read-only import of the original verified 26 GiB base
        keys:
        - sandium-brave-handoff-v2-sandium/fix-archive-completion-gate-d0bc6af6-e2a7-451e-8561-3c90eb48c2e1-stage-1
    - run:
        name: Verify original compressed base; no decompressed conversion
        command: python3 -u .circleci/bridge/driver.py seed-capture
        no_output_timeout: 35m
    - save_cache:
        name: Retain identical original compressed base in isolated namespace
        key: sandium-bridge-base-v1-{{ checksum ".checkpoint-state/base.key" }}
        paths:
        - brave-workspace-checkpoint.shards
        - brave-workspace-checkpoint.manifest.json
    - run:
        name: Prepare experimental head after payload save
        command: python3 -u .circleci/bridge/driver.py publish
    - save_cache:
        name: Publish experimental head last; never canonical promotion
        key: sandium-experimental-head-v1-{{ checksum ".checkpoint-state/scope-key" }}-{{ checksum ".checkpoint-head/receipt.json"
          }}
        paths:
        - .checkpoint-head/receipt.json
  sandium-stage-1:
    machine:
      image: ubuntu-2404:current
    resource_class: large
    retention:
      caches: 15d
    environment:
