        - raws-apt-v1-ubuntu2404-{{ checksum "upstream.lock.json" }}-
    - run:
        name: Configure independent RawS apt cache
        command: bash tools/prepare_apt_cache.sh
        no_output_timeout: 55m
    - run:
        name: Strict remote BuildBuddy ARM64 compile, maximum 25 minutes
        command: python3 -u tools/ci_compile.py --stage 1
        no_output_timeout: 55m
    - save_cache:
        name: Save RawS apt downloads
        key: raws-apt-v1-ubuntu2404-{{ checksum "upstream.lock.json" }}-<< pipeline.id >>-1
        paths:
        - .raws-apt-cache/archives
    - store_artifacts:
        path: artifacts
        destination: raws-arm64
    - run:
        name: Final archive progress-capture
        command: python3 -u tools/ci_final_archive.py progress-capture
        no_output_timeout: 55m
    - save_cache:
        name: Save isolated one-off increment
        key: raws-final-delta-v1-{{ checksum ".checkpoint-state/outgoing.key" }}
