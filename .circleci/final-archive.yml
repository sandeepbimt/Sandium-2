# Explicit one-off config, never automatic.
version: 2.1
parameters:
  run_raw_final_archive:
    type: boolean
    default: false
jobs:
  raws-final-compile:
    machine:
      image: ubuntu-2404:current
    resource_class: large
    retention:
      caches: 15d
    environment:
      RAWS_STAGE: '1'
      RAWS_PIPELINE_NUMBER: << pipeline.number >>
      RAWS_CHECKPOINT_REVIEWED: 'true'
      RAWS_ALLOW_FRESH_SEED: 'false'
      SISO_LIMITS: local=8,remote=80
      RAWS_FINAL_ARCHIVE: 'true'
    steps:
    - checkout
    - run:
        name: Start one-off job budget before setup
        command: 'mkdir -p .checkpoint-state

          python3 -c ''import json,time;json.dump({"epoch":time.time()},open(".checkpoint-state/job-start.json","w"))'''
        no_output_timeout: 55m
    - run:
        name: Install CI validation and checkpoint tools
        command: sudo apt-get update -qq && sudo apt-get install -y zstd python3-yaml
        no_output_timeout: 55m
    - run:
        name: Guard isolated RawS checkout
        command: 'test "$CIRCLE_BRANCH" = "raw-sandium/official158"

          /usr/bin/python3 -m unittest discover -s tests -v'
        no_output_timeout: 55m
    - run:
        name: RawS Full gate
        command: python3 -u tools/ci_full.py gate
        no_output_timeout: 55m
    - run:
        name: Ensure verified shard tools
        command: command -v zstd >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y zstd)
        no_output_timeout: 55m
    - restore_cache:
        name: Restore latest accepted RawS receipt only
        keys:
        - raws-full-head-v1-{{ checksum ".checkpoint-state/scope-key" }}-
    - restore_cache:
        name: Restore isolated one-off progress before normal head fallback
        keys:
        - raws-final-progress-v1-{{ checksum ".checkpoint-state/scope-key" }}-
    - run:
        name: Final archive prepare
        command: python3 -u tools/ci_final_archive.py prepare
        no_output_timeout: 55m
    - restore_cache:
        name: Restore exact RawS base
        keys:
        - raws-full-base-v1-{{ checksum ".checkpoint-state/base.key" }}
    - run:
        name: RawS Full restore-base
        command: python3 -u tools/ci_full.py restore-base
        no_output_timeout: 55m
    - run:
        name: Clear disposable incoming delta
        command: rm -rf .checkpoint-incoming
        no_output_timeout: 55m
    - restore_cache:
        name: Restore exact delta 0
        keys:
        - raws-final-delta-v1-{{ checksum ".checkpoint-state/slot-0.key" }}
        - raws-full-delta-v1-{{ checksum ".checkpoint-state/slot-0.key" }}
    - run:
        name: RawS Full restore-layer --slot 0
        command: python3 -u tools/ci_full.py restore-layer --slot 0
        no_output_timeout: 55m
    - run:
