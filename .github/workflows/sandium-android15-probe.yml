name: Sandium Android 15 capability probe
on:
  push:
    branches: [experiment/android15-smoke]
    paths: [.github/workflows/sandium-android15-probe.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sandium-android15-probe
  cancel-in-progress: false
jobs:
  android15:
    if: github.repository_visibility == 'public'
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    steps:
      - name: Enable owner-approved scoped KVM access and install official Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          # Owner approved read/write access for this disposable runner user only.
          sudo setfacl -m "u:$(id -un):rw" /dev/kvm
          getfacl /dev/kvm
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libpulse0 libnss3 libx11-6 libxcb1 libxcomposite1 libxcursor1 libxi6 libxtst6 libxrandr2 libasound2t64 libegl1 libvulkan1
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$SDKMANAGER" 'emulator' 'platform-tools'
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          # Verified official r09 archive; explicit checksum catches truncated CDN downloads.
          curl --fail --location --retry 3 --max-time 300 -o image.zip 'https://dl.google.com/android/repository/sys-img/google_apis/x86_64-35_r09.zip'
          echo 'c67b9ba0ff5bc0eb6d046871bfa228af14d4d47b02f0cdae94f048e511b7566e  image.zip' | sha256sum --check
          mkdir -p "$ANDROID_HOME/system-images/android-35/google_apis"
          unzip -q image.zip -d "$ANDROID_HOME/system-images/android-35/google_apis"
          rm image.zip
          "$ANDROID_HOME/emulator/emulator" -version
          "$ANDROID_HOME/emulator/emulator" -accel-check
          cat "$ANDROID_HOME/system-images/android-35/google_apis/x86_64/source.properties"
      - name: Verify exact APK and boot Android 15 with KVM required
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 2 --max-time 180 -o Sandium.apk 'https://output.circle-artifacts.com/output/job/a61031d0-7df0-4f68-8662-6c7da64ca68a/artifacts/0/sandium-arm-translation-test-only/brave-apk/Sandium-Brave-test.apk'
          echo '35f4ad516b3a82f709494add76bff1df7beb8e87439a9a82f7cbcd6fa6cf6737  Sandium.apk' | sha256sum --check
          unzip -l Sandium.apk | grep 'lib/' | head -15 || true
          export ANDROID_AVD_HOME="$RUNNER_TEMP/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd --force --name sandium15 --package 'system-images;android-35;google_apis;x86_64'
          cat >> "$ANDROID_AVD_HOME/sandium15.avd/config.ini" <<'CONFIG'
          hw.lcd.width=720
          hw.lcd.height=1600
          hw.lcd.density=280
          hw.ramSize=3072
          hw.cpu.ncore=2
          CONFIG
          "$ANDROID_HOME/emulator/emulator" -avd sandium15 -no-window -no-audio -no-snapshot -no-boot-anim -gpu swiftshader -accel on > emulator.log 2>&1 &
          echo $! > emulator.pid
          adb start-server
          timeout 480 bash -c 'until adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\r" | grep -qx 1; do kill -0 "$(cat emulator.pid)" || { tail -80 emulator.log; exit 1; }; sleep 4; done'
          adb shell getprop ro.build.version.release
          adb shell getprop ro.build.version.sdk
          adb shell getprop ro.product.cpu.abilist
          adb shell getprop ro.dalvik.vm.native.bridge
          adb shell wm size
          adb shell wm density
          adb shell input keyevent 82
          adb shell cmd overlay enable-exclusive --category com.android.internal.systemui.navbar.gestural
          adb shell settings get secure navigation_mode
          adb logcat -c
          adb logcat -v threadtime > logcat.txt &
          adb uninstall com.brave.browser_default || true
          adb install --no-streaming Sandium.apk
          adb shell dumpsys package com.brave.browser_default | grep -E 'versionName|versionCode|primaryCpuAbi|targetSdk|enableOnBackInvokedCallback'
          adb shell getconf PAGE_SIZE
          adb shell getprop ro.build.fingerprint
          adb shell getprop ro.dalvik.vm.isa.arm64
          for ROUND in 1 2 3; do
            echo "LAUNCH_ROUND=$ROUND"
            adb shell am force-stop com.brave.browser_default
            adb shell monkey -p com.brave.browser_default -c android.intent.category.LAUNCHER 1
            sleep 12
            adb shell pidof com.brave.browser_default || true
            adb shell dumpsys activity activities | grep -E 'mResumedActivity|topResumedActivity' || true
            adb logcat -b crash -d -v threadtime
          done
          adb shell dumpsys activity exit-info com.brave.browser_default
          adb logcat -d -v threadtime | grep -E 'DEBUG|libndk_translation|browser_default|cr_LibraryLoader|linker' | tail -350 || true
          # A boot/install pass is not a successful application launch.
          adb shell pidof com.brave.browser_default
          adb shell dumpsys activity activities | grep -E 'topResumedActivity=.*com.brave.browser_default'
          echo 'Android15 exact APK stayed alive across three launches.' >> "$GITHUB_STEP_SUMMARY"
      - name: Guard1242 functional navigation evidence (not phone performance)
        shell: bash
        run: |
          set -euo pipefail
          cat > test_navigation.py <<'PYFILE'
          """Isolated APK UI test driver. No account, no phone, no private browsing data."""
          import subprocess as sp, time, re, json, base64, xml.etree.ElementTree as ET
          from pathlib import Path
          PKG='com.brave.browser_default'
          def adb(*args,timeout=30,check=True):
              return sp.run(['adb',*args],capture_output=True,text=True,timeout=timeout,check=check).stdout
          
          def nodes():
              adb('shell','uiautomator','dump','/sdcard/ui.xml')
              s=adb('shell','cat','/sdcard/ui.xml')
              return ET.fromstring(s).findall('.//node')
          
          def center(n):
              x,y,x2,y2=map(int,re.findall(r'\d+',n.attrib['bounds']))
              return ((x+x2)//2,(y+y2)//2)
          
          def click(n):
              x,y=center(n); adb('shell','input','tap',str(x),str(y))
          
          def match(label,ns=None):
              for n in nodes() if ns is None else ns:
                  if label.lower() in (n.get('text','')+' '+n.get('content-desc','')).lower(): return n
              return None
          
          def evidence(label):
              print('CASE',label,time.time(),flush=True)
              ns=nodes()
              print('UI',json.dumps([n.attrib for n in ns if n.get('text') or n.get('content-desc') or 'url_bar' in n.get('resource-id','')]),flush=True)
              data=sp.check_output(['adb','exec-out','screencap','-p'])
              Path(label+'.png').write_bytes(data)
              print('PNG_BEGIN '+label,flush=True)
              print(base64.b64encode(data).decode(),flush=True)
              print('PNG_END '+label,flush=True)
              return ns
          
          def wait_ready():
              deadline=time.time()+240
              while time.time()<deadline:
                  ns=nodes(); start=match('Start browsing',ns)
                  if start is not None and start.get('enabled')=='true':
                      click(start);time.sleep(12);evidence('after_start');return
                  print('ONBOARDING',[(n.get('text'),n.get('enabled')) for n in ns if n.get('text')],flush=True)
                  time.sleep(10)
              evidence('onboarding_timeout');raise RuntimeError('Start browsing did not become enabled; no bypass used')
          
          
          def resource(suffix,ns=None):
              for n in nodes() if ns is None else ns:
                  if n.get('resource-id','').endswith('/'+suffix): return n
              return None
          
          def type_url(url):
              ns=nodes()
              n=resource('url_bar',ns)
              if n is None:n=resource('search_box_text',ns)
              if n is None:n=match('Search or type',ns)
              if n is None:raise RuntimeError('No observed address/search bar to type URL')
              click(n);time.sleep(1)
              adb('shell','input','keycombination','113','29')
              adb('shell','input','text',url)
              adb('shell','input','keyevent','66')
              time.sleep(5)
          
          def gesture(cancel=False):
              # Real edge touch sequence, not KEYCODE_BACK. Keep app animation scales unchanged.
              adb('shell','input','touchscreen','motionevent','DOWN','1','800')
              for x in [20,50,100,160,220]:
                  adb('shell','input','touchscreen','motionevent','MOVE',str(x),'800');time.sleep(.05)
              if cancel:
                  for x in [180,100,40,3]:
                      adb('shell','input','touchscreen','motionevent','MOVE',str(x),'800');time.sleep(.1)
                  time.sleep(.3)
                  adb('shell','input','touchscreen','motionevent','UP','3','800')
              else:
                  adb('shell','input','touchscreen','motionevent','MOVE','400','800')
                  adb('shell','input','touchscreen','motionevent','UP','420','800')
              time.sleep(2)
          
          def film(label,action):
              p=sp.Popen(['adb','shell','screenrecord','--bit-rate','300000','--time-limit','12','/sdcard/'+label+'.mp4'],stdout=sp.DEVNULL,stderr=sp.PIPE)
              time.sleep(1)
              try:action();time.sleep(1)
              finally:
                  adb('shell','pkill','-INT','screenrecord',check=False)
                  try:p.wait(timeout=5)
                  except sp.TimeoutExpired:p.terminate()
              data=sp.check_output(['adb','exec-out','cat','/sdcard/'+label+'.mp4'])
              print('VIDEO_BEGIN '+label,flush=True);print(base64.b64encode(data).decode(),flush=True);print('VIDEO_END '+label,flush=True)
          
          def expect(text):
              if match(text) is None:
                  evidence('unexpected_'+text)
                  raise RuntimeError('Expected visible page label '+text)
          
          def forward():
              ns=nodes();n=match('Forward',ns)
              if n is None:
                  menu=resource('menu_button',ns)
                  if menu is None:menu=match('More options',ns)
                  if menu is None:raise RuntimeError('Menu control not found for Forward')
                  click(menu);time.sleep(1);n=match('Forward')
              if n is None:raise RuntimeError('Forward control not exposed in observed menu')
              click(n);time.sleep(3)
          
          def home():
              n=resource('home_button')
              if n is None:n=match('Homepage')
              if n is None:n=match('Home')
              if n is None:raise RuntimeError('Homepage control not exposed in observed UI')
              click(n);time.sleep(3)
          
          
          def navigation_matrix():
              for round in range(1,4):
                  print('NAV_ROUND',round,flush=True)
                  if round!=2:  # rounds1/3 process cold; round2 warm, retain site cache in all.
                      adb('shell','am','force-stop',PKG)
                      adb('shell','monkey','-p',PKG,'-c','android.intent.category.LAUNCHER','1');time.sleep(6)
                  type_url('http://127.0.0.1:8765/a');expect('PAGE_A')
                  link=match('Go to PAGE_B')
                  if link is None:raise RuntimeError('Test link not visible')
                  click(link);time.sleep(4);expect('PAGE_B')
                  film('r%d_cancel'%round,lambda:gesture(True));expect('PAGE_B')
                  film('r%d_back'%round,lambda:gesture(False));expect('PAGE_A')
                  evidence('r%d_restored_a'%round)
                  forward();expect('PAGE_B')
                  adb('shell','input','swipe','360','1300','360','400','500');time.sleep(2)
                  film('r%d_hiddenbar_back'%round,lambda:gesture(False));expect('PAGE_A')
                  home();evidence('r%d_home'%round)
          
          if __name__=='__main__':
              wait_ready()
              navigation_matrix()
          PYFILE
          cat > serve_test.py <<'PYFILE'
          from http.server import BaseHTTPRequestHandler,HTTPServer
          from urllib.parse import urlparse
          import time
          class Handler(BaseHTTPRequestHandler):
           def do_GET(self):
            path=urlparse(self.path).path
            if path=='/event':
             print('BROWSER_EVENT',time.time(),self.path,flush=True);self.send_response(204);self.end_headers();return
            page='B' if path=='/b' else 'A';other='A' if page=='B' else 'B'
            body=f'''<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>PAGE_{page}</title><style>body{{margin:0;background:#{'162432' if page=='A' else '263b24'};color:#eee;font:24px sans-serif}}main{{padding:24px}}a{{display:block;padding:20px;background:#244f67;color:#fff;border-radius:12px}}section{{height:1900px;background:linear-gradient(#314253,#202b38)}}</style></head><body><main><h1>PAGE_{page}</h1><a href="/{other.lower()}">Go to PAGE_{other}</a><p>Stable controlled navigation fixture.</p><section>Scrollable content</section><p>End PAGE_{page}</p></main><script>const report=(name,extra='')=>fetch('/event?page={page}&event='+name+'&extra='+extra,{{keepalive:true}});report('script');addEventListener('pageshow',e=>report('pageshow',e.persisted));addEventListener('pagehide',e=>report('pagehide',e.persisted));</script></body></html>'''.encode()
            self.send_response(200);self.send_header('Content-Type','text/html');self.send_header('Cache-Control','max-age=3600');self.send_header('Content-Length',str(len(body)));self.end_headers();self.wfile.write(body)
          HTTPServer(('127.0.0.1',8765),Handler).serve_forever()
          PYFILE
          cat > run_matrix.py <<'PYFILE'
          import test_navigation as t
          import time,json,traceback,subprocess as sp
          results=[]
          def case(name,fn):
           start=time.monotonic()
           try:
            fn();alive=t.adb('shell','pidof',t.PKG).strip()
            if not alive:raise RuntimeError('Application not alive')
            results.append({'case':name,'status':'executed; inspect evidence for visual verdict','seconds':round(time.monotonic()-start,2)})
           except Exception as e:results.append({'case':name,'status':'blocked/failed','error':str(e)})
           print('RESULT',json.dumps(results[-1]),flush=True)
          def public(url,cold):
           if cold:
            t.adb('shell','am','force-stop',t.PKG);t.adb('shell','monkey','-p',t.PKG,'-c','android.intent.category.LAUNCHER','1');time.sleep(5)
           t.type_url(url);time.sleep(6)
           ns=t.nodes();print('PAGE_STATE',url, json.dumps([{'text':n.get('text'),'id':n.get('resource-id')} for n in ns if n.get('text')][:50]),flush=True)
           t.gesture(True);t.gesture(False)
          def external():
           print('IMPLICIT_VIEW',t.adb('shell','am','start','-W','-a','android.intent.action.VIEW','-d','https://www.wikipedia.org/'),flush=True)
           time.sleep(5);t.evidence('external_view')
          case('onboarding',t.wait_ready)
          if results[-1]['status'].startswith('executed'):
           case('controlled_three_round_navigation',t.navigation_matrix)
           for url in ['https://www.bhaskar.com/','https://www.thehindu.com/','https://en.wikipedia.org/wiki/India','https://www.youtube.com/','https://timesofindia.indiatimes.com/']:
            for cold in [True,False]:case(('process_cold' if cold else 'warm')+' '+url,lambda u=url,c=cold:public(u,c))
           case('implicit_external_VIEW',external)
           case('google_search',lambda:t.type_url('https://www.google.com/search?q=India%20news'))
           t.evidence('google_results')
           # Adult-site technical smoke only. No screenshot, page text, or media collection.
           for cold in [True,False]:
            def adult(c=cold):
             if c:t.adb('shell','am','force-stop',t.PKG);t.adb('shell','monkey','-p',t.PKG,'-c','android.intent.category.LAUNCHER','1');time.sleep(5)
             t.type_url('https://www.xvideos.com/');time.sleep(6)
             print('ADULT_TECHNICAL_STATE',t.adb('shell','pidof',t.PKG),flush=True)
             t.gesture(False)
            case('adult_public_process_cold' if cold else 'adult_public_warm',adult)
          print('FINAL_RESULTS',json.dumps(results),flush=True)
          if any(x['status']=='blocked/failed' for x in results):raise SystemExit(1)
          PYFILE
          python -u serve_test.py > fixture.log 2>&1 &
          adb reverse tcp:8765 tcp:8765
          python -u run_matrix.py
      - name: Bounded diagnostic evidence and cleanup (no artifact storage)
        if: always()
        shell: bash
        run: |
          if [ -f emulator.log ]; then tail -100 emulator.log; fi
          if [ -f logcat.txt ]; then grep -E 'FATAL EXCEPTION|Fatal signal|ANR in|chromium|BackNavigation|BackGesture|WindowOnBack' logcat.txt | tail -150 || true; fi
          adb shell dumpsys activity activities | grep -E 'mResumedActivity|topResumedActivity' || true
          cat fixture.log 2>/dev/null || true
          adb logcat -b crash -d -v threadtime || true
          adb shell dumpsys activity exit-info com.brave.browser_default || true
          adb emu kill || true
          if [ -f emulator.pid ]; then kill "$(cat emulator.pid)" 2>/dev/null || true; fi
