name: Sandium Android 15 capability probe
on:
  push:
    branches: [experiment/android15-smoke]
    paths: [.github/workflows/sandium-android15-probe.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sandium-android15-probe
  cancel-in-progress: false
jobs:
  android15:
    if: github.repository_visibility == 'public'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Enable owner-approved scoped KVM access and install official Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          # Owner approved read/write access for this disposable runner user only.
          sudo setfacl -m "u:$(id -un):rw" /dev/kvm
          getfacl /dev/kvm
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libpulse0 libnss3 libx11-6 libxcb1 libxcomposite1 libxcursor1 libxi6 libxtst6 libxrandr2 libasound2t64 libegl1 libvulkan1
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$SDKMANAGER" 'emulator' 'platform-tools'
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          # Verified official r09 archive; explicit checksum catches truncated CDN downloads.
          curl --fail --location --retry 3 --max-time 300 -o image.zip 'https://dl.google.com/android/repository/sys-img/google_apis/x86_64-35_r09.zip'
          echo 'c67b9ba0ff5bc0eb6d046871bfa228af14d4d47b02f0cdae94f048e511b7566e  image.zip' | sha256sum --check
          mkdir -p "$ANDROID_HOME/system-images/android-35/google_apis"
          unzip -q image.zip -d "$ANDROID_HOME/system-images/android-35/google_apis"
          rm image.zip
          "$ANDROID_HOME/emulator/emulator" -version
          "$ANDROID_HOME/emulator/emulator" -accel-check
          cat "$ANDROID_HOME/system-images/android-35/google_apis/x86_64/source.properties"
      - name: Verify exact APK and boot Android 15 with KVM required
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 2 --max-time 180 -o Sandium.apk 'https://output.circle-artifacts.com/output/job/a61031d0-7df0-4f68-8662-6c7da64ca68a/artifacts/0/sandium-arm-translation-test-only/brave-apk/Sandium-Brave-test.apk'
          echo '35f4ad516b3a82f709494add76bff1df7beb8e87439a9a82f7cbcd6fa6cf6737  Sandium.apk' | sha256sum --check
          unzip -l Sandium.apk | grep 'lib/' | head -15 || true
          export ANDROID_AVD_HOME="$RUNNER_TEMP/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd --force --name sandium15 --package 'system-images;android-35;google_apis;x86_64'
          cat >> "$ANDROID_AVD_HOME/sandium15.avd/config.ini" <<'CONFIG'
          hw.lcd.width=720
          hw.lcd.height=1600
          hw.lcd.density=280
          hw.ramSize=3072
          hw.cpu.ncore=2
          CONFIG
          "$ANDROID_HOME/emulator/emulator" -avd sandium15 -no-window -no-audio -no-snapshot -no-boot-anim -gpu swiftshader -accel on > emulator.log 2>&1 &
          echo $! > emulator.pid
          adb start-server
          timeout 480 bash -c 'until adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\r" | grep -qx 1; do kill -0 "$(cat emulator.pid)" || { tail -80 emulator.log; exit 1; }; sleep 4; done'
          adb shell getprop ro.build.version.release
          adb shell getprop ro.build.version.sdk
          adb shell getprop ro.product.cpu.abilist
          adb shell getprop ro.dalvik.vm.native.bridge
          adb shell wm size
          adb shell wm density
          adb shell input keyevent 82
          adb shell cmd overlay enable-exclusive --category com.android.internal.systemui.navbar.gestural
          adb shell settings get secure navigation_mode
          adb logcat -c
          adb logcat -v threadtime > logcat.txt &
          adb uninstall com.brave.browser_default || true
          adb install --no-streaming Sandium.apk
          adb shell dumpsys package com.brave.browser_default | grep -E 'versionName|versionCode|primaryCpuAbi|targetSdk|enableOnBackInvokedCallback'
          adb shell getconf PAGE_SIZE
          adb shell getprop ro.build.fingerprint
          adb shell getprop ro.dalvik.vm.isa.arm64
      - name: Minimal ARM64 JNI target ISA probe
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p probe/src/org/sandium/probe probe/classes probe/lib/arm64-v8a
          cat > probe/src/org/sandium/probe/Main.java <<'JAVA'
          package org.sandium.probe;
          public class Main extends android.app.Activity {
           static {System.loadLibrary("probe");}
           public static native String inspect();
           public void onCreate(android.os.Bundle b){super.onCreate(b);String result=inspect();android.util.Log.i("SandiumBridgeProbe",result);android.widget.TextView t=new android.widget.TextView(this);t.setText(result);setContentView(t);}
          }
          JAVA
          cat > probe/AndroidManifest.xml <<'XML'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="org.sandium.probe"><uses-sdk android:minSdkVersion="29" android:targetSdkVersion="35"/><application android:label="Sandium bridge probe" android:extractNativeLibs="true"><activity android:name=".Main" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application></manifest>
          XML
          cat > probe/probe.c <<'C'
          #include <jni.h>
          #include <dlfcn.h>
          #include <android/log.h>
          #include <stdio.h>
          #include <unistd.h>
          #include <errno.h>
          #include <string.h>
          JNIEXPORT jstring JNICALL Java_org_sandium_probe_Main_inspect(JNIEnv*e,jclass c){
           Dl_info info={0};void*target=(void*)(*e)->FindClass;int found=dladdr(target,&info);
           unsigned char *base=(unsigned char*)info.dli_fbase;
           __android_log_print(ANDROID_LOG_INFO,"SandiumBridgeProbe","JNI target=%p dladdr=%d path=%s base=%p ELFmachine=%u magic=%02x%02x%02x%02x",target,found,info.dli_fname?info.dli_fname:"null",base,found&&base?base[18]+256*base[19]:0,found&&base?base[0]:0,found&&base?base[1]:0,found&&base?base[2]:0,found&&base?base[3]:0);
           FILE*maps=fopen("/proc/self/maps","r");char line[1024];if(maps){while(fgets(line,sizeof(line),maps)){unsigned long lo=0,hi=0;if(sscanf(line,"%lx-%lx",&lo,&hi)==2&&((unsigned long)target>=lo&&(unsigned long)target<hi))__android_log_print(ANDROID_LOG_INFO,"SandiumBridgeProbe","TARGET_MAP %s",line);}fclose(maps);}
           unsigned char h[20]={0};char link[512]={0};char out[2048];
           ssize_t n=readlink("/proc/self/exe",link,sizeof(link)-1);int le=errno;
           FILE*f=fopen("/proc/self/exe","rb");int oe=errno;size_t r=f?fread(h,1,20,f):0;int re=errno;if(f)fclose(f);
           snprintf(out,sizeof(out),"compiled_arm64=%d link=%s readlink_n=%ld errno=%d fopen_ok=%d fopen_errno=%d read_n=%lu read_errno=%d ELF=%02x%02x%02x%02x class=%u endian=%u machine=%u guard_would_skip=%d",
          #ifdef __aarch64__
           1,
          #else
           0,
          #endif
           link,(long)n,le,f!=NULL,oe,(unsigned long)r,re,h[0],h[1],h[2],h[3],h[4],h[5],h[18]+256*h[19],r==20&&h[0]==127&&h[1]=='E'&&h[2]=='L'&&h[3]=='F'&&h[4]==2&&h[5]==1&&h[18]==62&&h[19]==0);
           return (*e)->NewStringUTF(e,out);
          }
          C
          BT=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          NDK=$(find "$ANDROID_HOME/ndk" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          JAR=$(find "$ANDROID_HOME/platforms" -name android.jar | sort -V | tail -1)
          echo "BT=$BT NDK=$NDK JAR=$JAR"
          "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android29-clang" -shared -fPIC -O0 probe/probe.c -ldl -llog -o probe/lib/arm64-v8a/libprobe.so
          javac -source 8 -target 8 -bootclasspath "$JAR" -d probe/classes probe/src/org/sandium/probe/Main.java
          "$BT/d8" --lib "$JAR" --output probe probe/classes/org/sandium/probe/Main.class
          "$BT/aapt" package -f -M probe/AndroidManifest.xml -I "$JAR" -F probe/unsigned.apk
          (cd probe && zip -q unsigned.apk classes.dex lib/arm64-v8a/libprobe.so)
          keytool -genkeypair -keystore probe/key.jks -storepass android -keypass android -alias test -dname 'CN=Disposable emulator diagnostic' -keyalg RSA -validity 2
          "$BT/apksigner" sign --ks probe/key.jks --ks-pass pass:android --key-pass pass:android --out probe/probe.apk probe/unsigned.apk
          adb install probe/probe.apk
          adb shell am start -W -n org.sandium.probe/.Main
          sleep 5
          adb logcat -d -s SandiumBridgeProbe:I AndroidRuntime:E
          adb shell pidof org.sandium.probe
      - name: Bounded diagnostic evidence and cleanup (no artifact storage)
        if: always()
        shell: bash
        run: |
          if [ -f emulator.log ]; then tail -100 emulator.log; fi
          if [ -f logcat.txt ]; then grep -E 'FATAL EXCEPTION|Fatal signal|ANR in|chromium|BackNavigation|BackGesture|WindowOnBack' logcat.txt | tail -150 || true; fi
          adb shell dumpsys activity activities | grep -E 'mResumedActivity|topResumedActivity' || true
          cat fixture.log 2>/dev/null || true
          adb logcat -b crash -d -v threadtime || true
          adb shell dumpsys activity exit-info com.brave.browser_default || true
          adb emu kill || true
          if [ -f emulator.pid ]; then kill "$(cat emulator.pid)" 2>/dev/null || true; fi
