name: Sandium pipeline self-test

on:
  push:
    paths:
      - ".circleci/config.yml"
      - ".circleci/scripts/archive-brave-workspace.sh"
      - ".circleci/scripts/sandium-checkpoint-shards.py"
      - ".circleci/scripts/test-sandium-checkpoint-shards.py"
      - ".circleci/scripts/checkpoint-stage-receipt.py"
      - ".circleci/scripts/test-checkpoint-stage-receipt.py"
      - ".circleci/scripts/verify-brave-remote-metrics.py"
      - ".circleci/scripts/test-brave-remote-metrics.py"
      - ".circleci/scripts/test-brave-build-flow.py"
      - ".circleci/scripts/prepare-brave-source.sh"
      - ".circleci/scripts/test-ai-chat-gn-patch.py"
      - ".circleci/scripts/test-brave-wallet-enum-patch.py"
      - ".circleci/scripts/sandium-self-heal.py"
      - ".circleci/scripts/repair-ai-chat-android.py"
      - ".circleci/scripts/test-sandium-self-heal.py"
      - ".circleci/scripts/apply-sandium-wallet-java-compile-contract.py"
      - ".circleci/scripts/test-sandium-wallet-java-compile-contract.py"
      - ".github/workflows/sandium-pipeline-self-test.yml"
  pull_request:
    paths:
      - ".circleci/config.yml"
      - ".circleci/scripts/archive-brave-workspace.sh"
      - ".circleci/scripts/sandium-checkpoint-shards.py"
      - ".circleci/scripts/test-sandium-checkpoint-shards.py"
      - ".circleci/scripts/checkpoint-stage-receipt.py"
      - ".circleci/scripts/test-checkpoint-stage-receipt.py"
      - ".circleci/scripts/verify-brave-remote-metrics.py"
      - ".circleci/scripts/test-brave-remote-metrics.py"
      - ".circleci/scripts/test-brave-build-flow.py"
      - ".circleci/scripts/prepare-brave-source.sh"
      - ".circleci/scripts/test-ai-chat-gn-patch.py"
      - ".github/workflows/sandium-pipeline-self-test.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pipeline:
    name: Pipeline syntax, archive and artifact-gate tests
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CircleCI CLI
        run: |
          curl -1sLf https://packages.circleci.com/public/setup.deb.sh | sudo -E bash
          sudo apt-get update -qq
          sudo apt-get install -y circleci zstd
          circleci version
      - name: Validate CircleCI pipeline configuration
        run: circleci config validate .circleci/config.yml
      - name: Compile retained pipeline helpers
        run: |
          python3 -m py_compile \
            .circleci/scripts/sandium-checkpoint-shards.py \
            .circleci/scripts/test-sandium-checkpoint-shards.py \
            .circleci/scripts/checkpoint-stage-receipt.py \
            .circleci/scripts/test-checkpoint-stage-receipt.py \
            .circleci/scripts/verify-brave-remote-metrics.py \
            .circleci/scripts/test-brave-remote-metrics.py \
            .circleci/scripts/test-brave-build-flow.py \
            .circleci/scripts/test-ai-chat-gn-patch.py \
            .circleci/scripts/test-brave-wallet-enum-patch.py \
            .circleci/scripts/test-chromium-feature-list-patch.py \
            .circleci/scripts/test-brave-reference-stage-gate.py \
            .circleci/scripts/test-ai-chat-android-gate.py \
            .circleci/scripts/sandium-self-heal.py \
            .circleci/scripts/repair-ai-chat-android.py \
            .circleci/scripts/test-sandium-self-heal.py
            .circleci/scripts/apply-sandium-wallet-java-compile-contract.py \
            .circleci/scripts/test-sandium-wallet-java-compile-contract.py
          bash -n .circleci/scripts/archive-brave-workspace.sh
          bash -n .circleci/scripts/verify-brave-reference.sh
          bash -n .circleci/scripts/verify-brave-remote-smoke.sh
          bash -n .circleci/scripts/capture-brave-siso-checkpoint.sh
          bash -n .circleci/scripts/prepare-brave-source.sh
          bash -n .circleci/scripts/recover-siso-missing-cas-inputs.sh
      - name: Test checkpoint archive and restore without action ledger
        run: python3 .circleci/scripts/test-sandium-checkpoint-shards.py
      - name: Test stage archive receipt
        run: python3 .circleci/scripts/test-checkpoint-stage-receipt.py
      - name: Test remote execution diagnostics
        run: python3 .circleci/scripts/test-brave-remote-metrics.py
      - name: Test build flow continuation
        run: python3 .circleci/scripts/test-brave-build-flow.py
      - name: Test pinned Brave AI Chat GN/C++ patch against isolated fixtures
        run: python3 .circleci/scripts/test-ai-chat-gn-patch.py
      - name: Test pinned Brave Wallet enum empty-input GN patch
        run: python3 .circleci/scripts/test-brave-wallet-enum-patch.py
      - name: Test disabled Chromium AI Chat and Brave News feature-list overlay
        run: python3 .circleci/scripts/test-chromium-feature-list-patch.py
      - name: Test stage-aware canonical reference and incomplete handoff gate
        run: python3 .circleci/scripts/test-brave-reference-stage-gate.py
      - name: Test disabled AI Chat Android implementation and GN dependency guards
        run: python3 .circleci/scripts/test-ai-chat-android-gate.py
      - name: Test Sandium Self-Heal Engine failure detection and bounded repairs
        run: python3 .circleci/scripts/test-sandium-self-heal.py
      - name: Test Wallet-disabled Java compile contract
        run: python3 .circleci/scripts/test-sandium-wallet-java-compile-contract.py
