name: Sandium pipeline self-test

on:
  push:
    paths:
      - ".circleci/scripts/**"
      - ".circleci/tests/**"
      - ".circleci/checkpoint/**"
      - ".circleci/bridge/**"
      - ".circleci/scripts/ensure-flow-tools.sh"
      - ".circleci/scripts/flow_wiring.py"
      - ".circleci/scripts/test-sandium-ui-prune.py"
      - ".circleci/scripts/apply-sandium-ui-prune.py"
      - ".circleci/experimental-steps/**"
      - "tests/**"
      - ".circleci/config.yml"
      - ".circleci/scripts/archive-brave-workspace.sh"
      - ".circleci/scripts/sandium-checkpoint-shards.py"
      - ".circleci/scripts/test-sandium-checkpoint-shards.py"
      - ".circleci/scripts/checkpoint-stage-receipt.py"
      - ".circleci/scripts/test-checkpoint-stage-receipt.py"
      - ".circleci/scripts/verify-brave-remote-metrics.py"
      - ".circleci/scripts/test-brave-remote-metrics.py"
      - ".circleci/scripts/test-brave-build-flow.py"
      - ".circleci/scripts/apply-sandium-blur-transition.py"
      - ".circleci/scripts/test-sandium-blur-transition.py"
      - ".circleci/scripts/apply-sandium-page-transition-full.py"
      - ".circleci/scripts/test-sandium-page-transition-full.py"
      - ".circleci/scripts/prepare-brave-source.sh"
      - ".github/workflows/sandium-pipeline-self-test.yml"
  pull_request:
    paths:
      - ".circleci/scripts/**"
      - ".circleci/tests/**"
      - ".circleci/checkpoint/**"
      - ".circleci/bridge/**"
      - ".circleci/scripts/ensure-flow-tools.sh"
      - ".circleci/scripts/flow_wiring.py"
      - ".circleci/scripts/test-sandium-ui-prune.py"
      - ".circleci/scripts/apply-sandium-ui-prune.py"
      - ".circleci/experimental-steps/**"
      - "tests/**"
      - ".circleci/config.yml"
      - ".circleci/scripts/archive-brave-workspace.sh"
      - ".circleci/scripts/sandium-checkpoint-shards.py"
      - ".circleci/scripts/test-sandium-checkpoint-shards.py"
      - ".circleci/scripts/checkpoint-stage-receipt.py"
      - ".circleci/scripts/test-checkpoint-stage-receipt.py"
      - ".circleci/scripts/verify-brave-remote-metrics.py"
      - ".circleci/scripts/test-brave-remote-metrics.py"
      - ".circleci/scripts/test-brave-build-flow.py"
      - ".github/workflows/sandium-pipeline-self-test.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pipeline:
    name: Pipeline syntax, archive and artifact-gate tests
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CircleCI CLI
        run: |
          curl -1sLf https://packages.circleci.com/public/setup.deb.sh | sudo -E bash
          sudo apt-get update -qq
          sudo apt-get install -y circleci zstd
          circleci version
      - name: Validate CircleCI pipeline configuration
        run: circleci config validate .circleci/config.yml
      - name: Compile retained pipeline helpers
        run: |
          python3 -m py_compile \
            .circleci/scripts/sandium-checkpoint-shards.py \
            .circleci/scripts/test-sandium-checkpoint-shards.py \
            .circleci/scripts/checkpoint-stage-receipt.py \
            .circleci/scripts/test-checkpoint-stage-receipt.py \
            .circleci/scripts/verify-brave-remote-metrics.py \
            .circleci/scripts/test-brave-remote-metrics.py \
            .circleci/scripts/test-brave-build-flow.py \
            .circleci/scripts/apply-sandium-blur-transition.py \
            .circleci/scripts/test-sandium-blur-transition.py \
            .circleci/scripts/apply-sandium-page-transition-full.py \
            .circleci/scripts/test-sandium-page-transition-full.py \
            .circleci/scripts/apply-sandium-full-overlays.py \
            .circleci/scripts/test-sandium-feature-policies.py
          bash -n .circleci/scripts/archive-brave-workspace.sh
          bash -n .circleci/scripts/verify-brave-reference.sh
          bash -n .circleci/scripts/verify-brave-remote-smoke.sh
          bash -n .circleci/scripts/capture-brave-siso-checkpoint.sh
          bash -n .circleci/scripts/prepare-brave-source.sh
      - name: Test checkpoint archive and restore without action ledger
        run: python3 .circleci/scripts/test-sandium-checkpoint-shards.py
      - name: Test stage archive receipt
        run: python3 .circleci/scripts/test-checkpoint-stage-receipt.py
      - name: Test remote execution diagnostics
        run: python3 .circleci/scripts/test-brave-remote-metrics.py
      - name: Test build flow continuation
        run: python3 .circleci/scripts/test-brave-build-flow.py
      - name: Test Sandium disabled Brave feature policies
        run: python3 .circleci/scripts/test-sandium-feature-policies.py
      - name: Test Sandium transition overlay
        run: python3 .circleci/scripts/test-sandium-page-transition-full.py
      - name: Install Flow test dependencies
        run: python3 -m pip install PyYAML==6.0.3
      - name: Test Flow checkpoint reconstruction and disk guards
        run: python3 tests/test_single_pipeline.py
      - name: Test composed welcome crash fix
        run: python3 tests/test_composition.py
      - name: Test legacy-base bridge metadata and restore
        run: python3 tests/test_legacy_bridge.py
      - name: Test delta-only rollup against unchanged base
        run: python3 tests/test_bridge_rollup.py
      - name: Test Flow bridge lifecycle and timeout cleanup
        run: python3 tests/test_bridge_pipeline.py
      - name: Test selected and system Python package isolation
        run: python3 tests/test_flow_tools.py
      - name: Test actual Flow overlay and UI-test wiring in all stages
        run: python3 tests/test_flow_wiring.py
      - name: Test scoped checkpoint quiescence and writer diagnostics
        run: python3 tests/test_bridge_quiescence.py
      - name: Test removed typography and Origin settings ordering
        run: |
          python3 tests/test_browser_crash_regressions.py
          python3 tests/test_settings_origin_crash.py
      - name: Test Balanced S contour and animator lifecycle
        run: python3 tests/test_balanced_tracer.py
      - name: Test visible identity and thirty-list checkpoint migration
        run: |
          python3 .circleci/scripts/test-sandium-visible-branding.py
          python3 .circleci/scripts/test-sandium-filter-subscriptions.py
          python3 .circleci/scripts/test-sandium-filter-bootstrap.py
      - name: Test redirect resources and stale-callback protection
        run: python3 .circleci/scripts/test-sandium-adblock-resources.py
      - name: Test dynamic onboarding readiness and checkpoint overwrite
        run: python3 .circleci/scripts/test-sandium-welcome-setup.py
      - name: Test shared native charcoal and pale-green palette
        run: python3 .circleci/scripts/test-sandium-native-theme.py
      - name: Test bounded Android 16 status underlap and checkpoint rollback
        run: python3 .circleci/tests/test_status_underlap_patch.py
