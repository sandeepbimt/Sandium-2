name: Sandium lightweight ledger self-test

on:
  push:
    paths:
      - ".circleci/scripts/brave-action-ledger.py"
      - ".circleci/scripts/test-brave-action-ledger.py"
      - ".github/workflows/sandium-ledger-self-test.yml"
  pull_request:
    paths:
      - ".circleci/scripts/brave-action-ledger.py"
      - ".circleci/scripts/test-brave-action-ledger.py"
      - ".github/workflows/sandium-ledger-self-test.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  action-ledger:
    name: Python syntax and action-frontier regression
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile ledger and test scripts
        run: |
          python3 -m py_compile \
            .circleci/scripts/brave-action-ledger.py \
            .circleci/scripts/test-brave-action-ledger.py
      - name: Test staged action-frontier reconciliation
        run: python3 .circleci/scripts/test-brave-action-ledger.py
